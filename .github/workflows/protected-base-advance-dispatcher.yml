name: Protected Base Advance Dispatcher

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: atlas-protected-base-advance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  dispatch-open-prs:
    if: github.repository == 'Oteryn/Oteryn-Atlas'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch bounded compatibility evaluation for same-repository open PRs
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/open-main-prs.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" > "$payload"
          mapfile -t pr_numbers < <(node --input-type=module - "$payload" <<'NODE'
          import fs from 'node:fs';
          const pages = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const repository = process.env.GITHUB_REPOSITORY;
          const values = pages.flat().filter((pr) => pr.state === 'open'
            && pr.base?.ref === 'main'
            && pr.base?.repo?.full_name === repository
            && pr.head?.repo?.full_name === repository)
            .map(({ number }) => number)
            .filter((number) => Number.isSafeInteger(number) && number > 0)
            .sort((left, right) => left - right);
          process.stdout.write(values.join('\n'));
          NODE
          )
          for pr_number in "${pr_numbers[@]}"; do
            gh workflow run protected-verification-controller.yml \
              --repo "$GITHUB_REPOSITORY" --ref main \
              -f "pr_number=$pr_number" -f "trigger=base_advance:$GITHUB_SHA"
          done
