name: Protected Base Advance Dispatcher

on:
  push:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: atlas-protected-base-advance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  dispatch-open-prs:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch bounded compatibility evaluation for same-repository open PRs
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          export ATLAS_DEFAULT_BRANCH="$default_branch"
          payload="$RUNNER_TEMP/open-main-prs.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" > "$payload"
          mapfile -t pr_numbers < <(node --input-type=module - "$payload" <<'NODE'
          import fs from 'node:fs';
          const pages = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const repository = process.env.GITHUB_REPOSITORY;
          const values = pages.flat().filter((pr) => pr.state === 'open'
            && pr.base?.ref === process.env.ATLAS_DEFAULT_BRANCH
            && pr.base?.repo?.full_name === repository
            && pr.head?.repo?.full_name === repository)
            .map(({ number }) => number)
            .filter((number) => Number.isSafeInteger(number) && number > 0)
            .sort((left, right) => left - right);
          process.stdout.write(values.join('\n'));
          NODE
          )
          for pr_number in "${pr_numbers[@]}"; do
            head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq .head.sha)"
            gh workflow run protected-admission.yml \
              --repo "$GITHUB_REPOSITORY" --ref "$default_branch" \
              -f "pr_number=$pr_number" -f "head_sha=$head_sha"
          done
