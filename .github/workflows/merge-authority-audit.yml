name: Merge authority audit
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  merge_group:
    types: [checks_requested]
permissions: {}
concurrency:
  group: atlas-merge-authority-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true
jobs:
  audit:
    name: Merge authority audit / protected-base validate
    if: >-
      github.event.repository.full_name == github.repository &&
      ((github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == github.event.repository.default_branch) ||
       (github.event_name == 'merge_group' &&
        github.event.action == 'checks_requested' &&
        github.event.merge_group.base_ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        github.event.merge_group.head_sha == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      ATLAS_EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
      ATLAS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ATLAS_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
      ATLAS_EVENT_ACTION: ${{ github.event.action }}
      ATLAS_PR_NUMBER: ${{ github.event.pull_request.number }}
      ATLAS_CODE_REVISION: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      ATLAS_PROTECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - name: Check out exact protected audit authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          persist-credentials: false
          fetch-depth: 0
          path: trusted-base
      - name: Check out inert candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - name: Independently validate exact authority and generated workflow bytes
        run: node trusted-base/tools/verification/run-protected-authority-audit.mjs "$PWD/trusted-base" "$PWD/candidate"
