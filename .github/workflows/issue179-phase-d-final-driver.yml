name: Issue 179 Phase D Final Qualification

on:
  push:
    branches:
      - feat/issue-179-molehill-resource-admission

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

concurrency:
  group: issue-179-phase-d-final-qualification
  cancel-in-progress: true

jobs:
  qualify:
    name: Molehill exact-head Phase D qualification
    runs-on:
      group: atlas-runners
      labels: oteryn-atlas-pc
    timeout-minutes: 240
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      short_sha: ${{ steps.target.outputs.short }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Oteryn/Oteryn-Atlas
      PR_NUMBER: '190'
      TASK_BRANCH: feat/issue-179-molehill-resource-admission
      ATLAS_PUBLICATION_ORIGIN: http://192.168.1.2:8097
      ATLAS_E2E_WORKERS: '1'
      ATLAS_E2E_RESOURCE_CLASS: browser-full
      ATLAS_E2E_AUTHORITY_MODE: authoritative
    steps:
      - name: Resolve self-removed final target
        id: target
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $deadline = [DateTime]::UtcNow.AddMinutes(10)
          $target = $null
          do {
            $pr = gh api "repos/$env:REPO/pulls/$env:PR_NUMBER" | ConvertFrom-Json
            if ([string]$pr.head.ref -ne $env:TASK_BRANCH) { throw "Unexpected PR head ref: $($pr.head.ref)" }
            $candidate = [string]$pr.head.sha
            if ($candidate -and $candidate -ne $env:GITHUB_SHA) { $target = $candidate; break }
            Start-Sleep -Seconds 5
          } while ([DateTime]::UtcNow -lt $deadline)
          if (-not $target) { throw 'Timed out waiting for the self-removed final task head.' }
          $short = $target.Substring(0, 7)
          "sha=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "short=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "TARGET_SHA=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SHORT_SHA=$short" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check out exact self-removed target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fence exact target and driver removal
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:TARGET_SHA) { throw 'Checkout does not equal resolved target.' }
          git merge-base --is-ancestor $env:GITHUB_SHA $env:TARGET_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Final target is not descended from the driver source commit.' }
          if (Test-Path '.github/workflows/issue179-phase-d-final-driver.yml') { throw 'Transient driver remains in final target.' }
          $pr = gh api "repos/$env:REPO/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if ([string]$pr.head.sha -ne $env:TARGET_SHA) { throw 'PR head moved before qualification.' }
          if (@(git status --porcelain).Count -ne 0) { throw 'Final target checkout is dirty.' }

      - name: Download exact hosted shadow plan
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $deadline = [DateTime]::UtcNow.AddMinutes(20)
          $ciRun = $null
          $artifact = $null
          do {
            $runs = gh api "repos/$env:REPO/actions/runs?head_sha=$env:TARGET_SHA&event=pull_request&per_page=100" | ConvertFrom-Json
            $ciRun = @($runs.workflow_runs | Where-Object { $_.name -eq 'CI' } | Sort-Object created_at -Descending | Select-Object -First 1)
            if ($ciRun.Count -eq 1) {
              $artifacts = gh api "repos/$env:REPO/actions/runs/$($ciRun[0].id)/artifacts?per_page=100" | ConvertFrom-Json
              $artifact = @($artifacts.artifacts | Where-Object { $_.name -like "atlas-shadow-plan-$($ciRun[0].id)-*" } | Select-Object -First 1)
              if ($artifact.Count -eq 1) { break }
            }
            Start-Sleep -Seconds 5
          } while ([DateTime]::UtcNow -lt $deadline)
          if ($ciRun.Count -ne 1 -or $artifact.Count -ne 1) { throw 'Timed out waiting for exact-head hosted shadow plan.' }
          $planDir = Join-Path (Get-Location) 'artifacts/driver-plan'
          New-Item -ItemType Directory -Force $planDir | Out-Null
          gh run download $ciRun[0].id --repo $env:REPO --name $artifact[0].name --dir $planDir
          if ($LASTEXITCODE -ne 0) { throw 'Hosted shadow plan download failed.' }
          $planPath = Join-Path $planDir 'shadow-verification-plan.json'
          $plan = Get-Content $planPath -Raw | ConvertFrom-Json
          if ([string]$plan.repository -ne $env:REPO) { throw 'Shadow plan repository mismatch.' }
          if ([string]$plan.headSha -ne $env:TARGET_SHA) { throw 'Shadow plan head mismatch.' }
          if (-not [bool]$plan.shadowOnly) { throw 'Shadow plan is not shadow-only.' }
          if ([int]$plan.retryPolicy.retries -ne 0) { throw 'Shadow plan retry policy is not zero.' }
          if (@($plan.stableTestIds).Count -eq 0) { throw 'Shadow plan contains no stable IDs.' }
          "PLAN_PATH=$planPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run plan-bound canonical Chromium gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path (Get-Location) "artifacts/e2e/atlas190-primary-$env:SHORT_SHA"
          if (Test-Path $artifactRoot) { Remove-Item $artifactRoot -Recurse -Force }
          $env:ATLAS_CODE_REVISION = $env:TARGET_SHA
          $env:ATLAS_EXPECTED_REVISION = $env:TARGET_SHA
          $env:ATLAS_E2E_PROJECT = "atlas190-primary-$env:SHORT_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:ATLAS_E2E_ARTIFACTS_HOST = "../artifacts/e2e/atlas190-primary-$env:SHORT_SHA"
          $env:ATLAS_VERIFICATION_PLAN_PATH = (Resolve-Path $env:PLAN_PATH).Path
          $env:ATLAS_E2E_LOCK_TIMEOUT_SECONDS = '21600'
          Remove-Item Env:ATLAS_E2E_SLOT -ErrorAction SilentlyContinue
          Remove-Item Env:ATLAS_E2E_SLOT_COUNT -ErrorAction SilentlyContinue
          .\e2e\run.ps1
          if ($LASTEXITCODE -ne 0) { throw "Canonical Chromium gate exited $LASTEXITCODE." }
          $summaryPath = Join-Path $artifactRoot 'summary.json'
          $summary = Get-Content $summaryPath -Raw | ConvertFrom-Json
          $plan = Get-Content $env:PLAN_PATH -Raw | ConvertFrom-Json
          if ($summary.status -ne 'passed') { throw 'Summary is not passed.' }
          if ($summary.metadata.expectedRevision -ne $env:TARGET_SHA) { throw 'Summary revision mismatch.' }
          if ([int]$summary.metadata.workers -ne 1) { throw 'Summary workers are not 1.' }
          if (@($summary.scenarios).Count -ne @($plan.stableTestIds).Count) { throw 'Scenario census differs from plan.' }
          if (@($summary.scenarios | Where-Object { $_.status -ne 'passed' }).Count -ne 0) { throw 'Summary contains non-passed scenarios.' }
          if (@($summary.scenarios | Where-Object { [int]$_.retry -ne 0 }).Count -ne 0) { throw 'Summary contains retries.' }
          node tools/verification/validate-e2e-evidence.mjs --plan $env:PLAN_PATH --summary $summaryPath --head-sha $env:TARGET_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Plan-bound evidence validation failed.' }
          Write-Output "Final Phase D Chromium evidence: $(@($summary.scenarios).Count)/$(@($summary.scenarios).Count) PASS retries=0."

      - name: Upload exact primary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas190-primary-${{ steps.target.outputs.short }}
          path: artifacts/e2e/atlas190-primary-${{ steps.target.outputs.short }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish manually reviewed exact-head evidence
    needs: qualify
    if: ${{ needs.qualify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Oteryn/Oteryn-Atlas
      PR_NUMBER: '190'
      TASK_BRANCH: feat/issue-179-molehill-resource-admission
      TARGET_SHA: ${{ needs.qualify.outputs.target_sha }}
      SHORT_SHA: ${{ needs.qualify.outputs.short_sha }}
    steps:
      - name: Require explicit manual visual-review marker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pr = gh api "repos/$env:REPO/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if ([string]$pr.head.sha -ne $env:TARGET_SHA) { throw 'PR head moved before visual publication.' }
          $marker = "Visual-Review-Approved-For: $env:TARGET_SHA"
          if (-not ([string]$pr.body).Contains($marker)) { throw "Manual visual review marker is absent: $marker" }

      - name: Check out reviewed exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.qualify.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact primary evidence and hosted shadow plan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'artifacts/publish-primary','artifacts/publish-plan' | Out-Null
          gh run download $env:GITHUB_RUN_ID --repo $env:REPO --name "atlas190-primary-$env:SHORT_SHA" --dir 'artifacts/publish-primary'
          if ($LASTEXITCODE -ne 0) { throw 'Primary artifact download failed.' }
          $runs = gh api "repos/$env:REPO/actions/runs?head_sha=$env:TARGET_SHA&event=pull_request&per_page=100" | ConvertFrom-Json
          $ci = @($runs.workflow_runs | Where-Object { $_.name -eq 'CI' } | Sort-Object created_at -Descending | Select-Object -First 1)
          if ($ci.Count -ne 1) { throw 'Exact-head CI run not found.' }
          $artifacts = gh api "repos/$env:REPO/actions/runs/$($ci[0].id)/artifacts?per_page=100" | ConvertFrom-Json
          $planArtifact = @($artifacts.artifacts | Where-Object { $_.name -like "atlas-shadow-plan-$($ci[0].id)-*" } | Select-Object -First 1)
          if ($planArtifact.Count -ne 1) { throw 'Exact-head shadow plan artifact not found.' }
          gh run download $ci[0].id --repo $env:REPO --name $planArtifact[0].name --dir 'artifacts/publish-plan'
          if ($LASTEXITCODE -ne 0) { throw 'Shadow plan artifact download failed.' }

      - name: Create digest-bound visual approval and publish atlas-local-e2e
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $summary = (Resolve-Path 'artifacts/publish-primary/summary.json').Path
          $plan = (Resolve-Path 'artifacts/publish-plan/shadow-verification-plan.json').Path
          .\e2e\approve-visual-user-acceptance.ps1 -SummaryPath $summary -Reviewer 'OpenAI ChatGPT' -ConfirmReviewedAllScreenshots
          if ($LASTEXITCODE -ne 0) { throw 'Visual approval manifest generation failed.' }
          $review = (Resolve-Path 'artifacts/publish-primary/visual-review.json').Path
          .\e2e\publish-local-e2e-status.ps1 -SummaryPath $summary -VerificationPlanPath $plan -VisualReviewPath $review -RemoteBranch $env:TASK_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'atlas-local-e2e publisher failed.' }

      - name: Upload visual review manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas190-visual-review-${{ needs.qualify.outputs.short_sha }}
          path: artifacts/publish-primary/visual-review.json
          if-no-files-found: warn
          retention-days: 14
