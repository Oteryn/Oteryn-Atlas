name: Issue 179 Phase D Final Qualification

on:
  push:
    branches:
      - feat/issue-179-molehill-resource-admission

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

concurrency:
  group: issue-179-phase-d-final-qualification
  cancel-in-progress: true

jobs:
  qualify:
    name: Molehill exact-head Phase D qualification
    runs-on:
      group: atlas-runners
      labels: oteryn-atlas-pc
    timeout-minutes: 240
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      short_sha: ${{ steps.target.outputs.short }}
      evidence_run: ${{ steps.target.outputs.evidence_run }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Oteryn/Oteryn-Atlas
      PR_NUMBER: '190'
      TASK_BRANCH: feat/issue-179-molehill-resource-admission
      EXPECTED_BASE_SHA: b23c44f7d828550ee9208255642f9a7c3c3f3324
      ATLAS_PUBLICATION_ORIGIN: http://192.168.1.2:8097
      ATLAS_E2E_WORKERS: '1'
      ATLAS_E2E_RESOURCE_CLASS: browser-full
      ATLAS_E2E_AUTHORITY_MODE: authoritative
      ATLAS_TRUSTED_EVIDENCE_ROOT: C:\Oteryn\evidence\atlas-pr-e2e
    steps:
      - name: Resolve self-removed final target
        id: target
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $deadline = [DateTime]::UtcNow.AddMinutes(10)
          $target = $null
          do {
            $pr = gh api "repos/$env:REPO/pulls/$env:PR_NUMBER" | ConvertFrom-Json
            if ([string]$pr.head.ref -ne $env:TASK_BRANCH) { throw "Unexpected PR head ref: $($pr.head.ref)" }
            if ([string]$pr.base.sha -ne $env:EXPECTED_BASE_SHA) { throw "Unexpected PR base SHA: $($pr.base.sha)" }
            $candidate = [string]$pr.head.sha
            if ($candidate -and $candidate -ne $env:GITHUB_SHA) { $target = $candidate; break }
            Start-Sleep -Seconds 5
          } while ([DateTime]::UtcNow -lt $deadline)
          if (-not $target) { throw 'Timed out waiting for the self-removed final task head.' }
          $short = $target.Substring(0, 7)
          $evidenceRun = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "sha=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "short=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "evidence_run=$evidenceRun" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "TARGET_SHA=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SHORT_SHA=$short" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check out exact self-removed target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fence exact target and driver removal
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:TARGET_SHA) { throw 'Checkout does not equal resolved target.' }
          git merge-base --is-ancestor $env:GITHUB_SHA $env:TARGET_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Final target is not descended from the driver source commit.' }
          if (Test-Path '.github/workflows/issue179-phase-d-final-driver.yml') { throw 'Transient driver remains in final target.' }
          $pr = gh api "repos/$env:REPO/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if ([string]$pr.head.sha -ne $env:TARGET_SHA) { throw 'PR head moved before qualification.' }
          if ([string]$pr.base.sha -ne $env:EXPECTED_BASE_SHA) { throw 'PR base moved before qualification.' }
          if (@(git status --porcelain).Count -ne 0) { throw 'Final target checkout is dirty.' }

      - name: Download exact hosted shadow plan
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $deadline = [DateTime]::UtcNow.AddMinutes(30)
          $ciRun = $null
          $artifact = $null
          do {
            $runs = gh api "repos/$env:REPO/actions/runs?head_sha=$env:TARGET_SHA&event=pull_request&per_page=100" | ConvertFrom-Json
            $ciRun = @($runs.workflow_runs | Where-Object { $_.name -eq 'CI' } | Sort-Object created_at -Descending | Select-Object -First 1)
            if ($ciRun.Count -eq 1) {
              $artifacts = gh api "repos/$env:REPO/actions/runs/$($ciRun[0].id)/artifacts?per_page=100" | ConvertFrom-Json
              $artifact = @($artifacts.artifacts | Where-Object { $_.name -like "atlas-shadow-plan-$($ciRun[0].id)-*" } | Select-Object -First 1)
              if ($artifact.Count -eq 1) { break }
            }
            Start-Sleep -Seconds 5
          } while ([DateTime]::UtcNow -lt $deadline)
          if ($ciRun.Count -ne 1 -or $artifact.Count -ne 1) { throw 'Timed out waiting for exact-head hosted shadow plan.' }
          $planDir = Join-Path (Get-Location) 'artifacts/driver-plan'
          New-Item -ItemType Directory -Force $planDir | Out-Null
          gh run download $ciRun[0].id --repo $env:REPO --name $artifact[0].name --dir $planDir
          if ($LASTEXITCODE -ne 0) { throw 'Hosted shadow plan download failed.' }
          $planPath = Join-Path $planDir 'shadow-verification-plan.json'
          $plan = Get-Content $planPath -Raw | ConvertFrom-Json
          if ([string]$plan.repository -ne $env:REPO) { throw 'Shadow plan repository mismatch.' }
          if ([string]$plan.headSha -ne $env:TARGET_SHA) { throw 'Shadow plan head mismatch.' }
          if ([string]$plan.integrationBaseSha -ne $env:EXPECTED_BASE_SHA) { throw 'Shadow plan integration base mismatch.' }
          if (-not [bool]$plan.shadowOnly) { throw 'Shadow plan is not shadow-only.' }
          if ([int]$plan.retryPolicy.retries -ne 0) { throw 'Shadow plan retry policy is not zero.' }
          if (@($plan.stableTestIds).Count -eq 0) { throw 'Shadow plan contains no stable IDs.' }
          "PLAN_PATH=$planPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run plan-bound canonical Chromium gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:ATLAS_TRUSTED_EVIDENCE_ROOT (Join-Path $env:TARGET_SHA "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
          $runRoot = Join-Path $evidenceRoot 'run'
          if (Test-Path $evidenceRoot) { Remove-Item $evidenceRoot -Recurse -Force }
          New-Item -ItemType Directory -Force $evidenceRoot | Out-Null
          Copy-Item $env:PLAN_PATH (Join-Path $evidenceRoot 'pr-verification-plan.json') -Force
          $metadata = [ordered]@{
            version = 1
            repository = $env:REPO
            prNumber = [int]$env:PR_NUMBER
            headSha = $env:TARGET_SHA
            baseSha = $env:EXPECTED_BASE_SHA
            headRef = $env:TASK_BRANCH
            workflowRunId = [long]$env:GITHUB_RUN_ID
            workflowRunAttempt = [int]$env:GITHUB_RUN_ATTEMPT
            bootstrap = 'phase-d-final'
          }
          $metadata | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $evidenceRoot 'run-metadata.json')
          $env:ATLAS_CODE_REVISION = $env:TARGET_SHA
          $env:ATLAS_EXPECTED_REVISION = $env:TARGET_SHA
          $env:ATLAS_E2E_PROJECT = "atlas190-primary-$env:SHORT_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:ATLAS_E2E_ARTIFACTS_HOST = $runRoot
          $env:ATLAS_VERIFICATION_PLAN_PATH = (Resolve-Path $env:PLAN_PATH).Path
          $env:ATLAS_E2E_LOCK_TIMEOUT_SECONDS = '21600'
          Remove-Item Env:ATLAS_E2E_SLOT -ErrorAction SilentlyContinue
          Remove-Item Env:ATLAS_E2E_SLOT_COUNT -ErrorAction SilentlyContinue
          .\e2e\run.ps1
          if ($LASTEXITCODE -ne 0) { throw "Canonical Chromium gate exited $LASTEXITCODE." }
          $summaryPath = Join-Path $runRoot 'summary.json'
          $summary = Get-Content $summaryPath -Raw | ConvertFrom-Json
          $plan = Get-Content $env:PLAN_PATH -Raw | ConvertFrom-Json
          if ($summary.status -ne 'passed') { throw 'Summary is not passed.' }
          if ($summary.metadata.expectedRevision -ne $env:TARGET_SHA) { throw 'Summary revision mismatch.' }
          if ([int]$summary.metadata.workers -ne 1) { throw 'Summary workers are not 1.' }
          if (@($summary.scenarios).Count -ne @($plan.stableTestIds).Count) { throw 'Scenario census differs from plan.' }
          if (@($summary.scenarios | Where-Object { $_.status -ne 'passed' }).Count -ne 0) { throw 'Summary contains non-passed scenarios.' }
          if (@($summary.scenarios | Where-Object { [int]$_.retry -ne 0 }).Count -ne 0) { throw 'Summary contains retries.' }
          node tools/verification/validate-e2e-evidence.mjs --plan $env:PLAN_PATH --summary $summaryPath --head-sha $env:TARGET_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Plan-bound evidence validation failed.' }
          $safeRoot = Join-Path (Get-Location) 'artifacts/driver-metadata'
          New-Item -ItemType Directory -Force $safeRoot | Out-Null
          foreach ($entry in @(
            @{ Source = $summaryPath; Name = 'summary.json' },
            @{ Source = (Join-Path $runRoot 'resource-admission.json'); Name = 'resource-admission.json' },
            @{ Source = (Join-Path $runRoot 'slot-lease.json'); Name = 'slot-lease.json' },
            @{ Source = (Join-Path $evidenceRoot 'pr-verification-plan.json'); Name = 'pr-verification-plan.json' },
            @{ Source = (Join-Path $evidenceRoot 'run-metadata.json'); Name = 'run-metadata.json' }
          )) { Copy-Item -LiteralPath $entry.Source -Destination (Join-Path $safeRoot $entry.Name) -Force }
          Write-Output "Final Phase D Chromium evidence: $(@($summary.scenarios).Count)/$(@($summary.scenarios).Count) PASS retries=0; full-frame evidence retained at $evidenceRoot"

      - name: Upload bounded qualification metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas190-metadata-${{ steps.target.outputs.short }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/driver-metadata/summary.json
            artifacts/driver-metadata/resource-admission.json
            artifacts/driver-metadata/slot-lease.json
            artifacts/driver-metadata/pr-verification-plan.json
            artifacts/driver-metadata/run-metadata.json
          if-no-files-found: warn
          retention-days: 14

  review-marker:
    name: Require completed perceptual review marker
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Oteryn/Oteryn-Atlas
      PR_NUMBER: '190'
      TARGET_SHA: ${{ needs.qualify.outputs.target_sha }}
      EVIDENCE_RUN: ${{ needs.qualify.outputs.evidence_run }}
    steps:
      - name: Require exact visual approval marker
        id: marker
        shell: bash
        run: |
          set -euo pipefail
          body="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""')"
          grep -Fx "Visual-Review-Approved-For: $TARGET_SHA" <<<"$body"
          grep -Fx "Visual-Evidence-Run: $EVIDENCE_RUN" <<<"$body"
          reviewer="$(grep -E '^Visual-Reviewed-By: [A-Za-z0-9 ._@-]{1,80}$' <<<"$body" | tail -1 | sed 's/^Visual-Reviewed-By: //')"
          test -n "$reviewer"
          echo "reviewer=$reviewer" >> "$GITHUB_OUTPUT"

  publish:
    name: Bind review and publish exact-head status
    needs: [qualify, review-marker]
    runs-on:
      group: atlas-runners
      labels: oteryn-atlas-pc
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Oteryn/Oteryn-Atlas
      PR_NUMBER: '190'
      TASK_BRANCH: feat/issue-179-molehill-resource-admission
      EXPECTED_BASE_SHA: b23c44f7d828550ee9208255642f9a7c3c3f3324
      TARGET_SHA: ${{ needs.qualify.outputs.target_sha }}
      EVIDENCE_RUN: ${{ needs.qualify.outputs.evidence_run }}
      REVIEWER: ${{ needs.review-marker.outputs.reviewer }}
      ATLAS_TRUSTED_EVIDENCE_ROOT: C:\Oteryn\evidence\atlas-pr-e2e
    steps:
      - name: Check out reviewed exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.qualify.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-fence exact PR identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pr = gh api "repos/$env:REPO/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if ([string]$pr.head.sha -ne $env:TARGET_SHA) { throw 'PR head moved after perceptual review.' }
          if ([string]$pr.base.sha -ne $env:EXPECTED_BASE_SHA) { throw 'PR base moved after perceptual review.' }
          if ((git rev-parse HEAD).Trim() -ne $env:TARGET_SHA) { throw 'Reviewed target checkout mismatch.' }
          $body = [string]$pr.body
          if (-not $body.Contains("Visual-Review-Approved-For: $env:TARGET_SHA")) { throw 'Visual approval marker disappeared.' }
          if (-not $body.Contains("Visual-Evidence-Run: $env:EVIDENCE_RUN")) { throw 'Visual evidence run marker disappeared.' }

      - name: Bind perceptual approval and publish atlas-local-e2e
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:ATLAS_TRUSTED_EVIDENCE_ROOT (Join-Path $env:TARGET_SHA $env:EVIDENCE_RUN)
          $summary = Join-Path $evidenceRoot 'run\summary.json'
          $plan = Join-Path $evidenceRoot 'pr-verification-plan.json'
          .\e2e\approve-visual-user-acceptance.ps1 -SummaryPath $summary -Reviewer $env:REVIEWER -ConfirmReviewedAllScreenshots
          if ($LASTEXITCODE -ne 0) { throw 'Visual approval manifest generation failed.' }
          $review = Join-Path $evidenceRoot 'run\visual-review.json'
          .\e2e\publish-local-e2e-status.ps1 -SummaryPath $summary -VerificationPlanPath $plan -VisualReviewPath $review -RemoteBranch $env:TASK_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'atlas-local-e2e publisher failed.' }
