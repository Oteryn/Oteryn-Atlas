name: Protected Hosted Verification Executor

on:
  workflow_run:
    workflows: ["Protected Verification Controller"]
    types: [completed]
  workflow_dispatch:
    inputs:
      controller_run_id:
        description: Exact successful protected controller run to consume
        required: true
        type: string
      pr_number:
        description: Untrusted PR routing key validated against protected plan
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: atlas-protected-hosted-${{ inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'pull_request_target' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      bootstrap_active: ${{ steps.controller.outputs.bootstrap_active }}
      controller_run_id: ${{ steps.controller.outputs.controller_run_id }}
      bundle_name: ${{ steps.contract.outputs.bundle_name }}
      candidate_head_sha: ${{ steps.contract.outputs.candidate_head_sha }}
      protected_base_sha: ${{ steps.contract.outputs.protected_base_sha }}
      controller_source_sha: ${{ steps.contract.outputs.controller_source_sha }}
      pr_number: ${{ steps.contract.outputs.pr_number }}
      hosted_count: ${{ steps.contract.outputs.hosted_count }}
      specialist_count: ${{ steps.contract.outputs.specialist_count }}
      disposition: ${{ steps.lifecycle.outputs.disposition }}
      execute_environment: ${{ steps.lifecycle.outputs.execute_environment }}
      execute_hosted: ${{ steps.lifecycle.outputs.execute_hosted }}
      heavy_executions_required: ${{ steps.lifecycle.outputs.heavy_executions_required }}
      reuse_count: ${{ steps.lifecycle.outputs.reuse_count }}
      state_artifact_name: ${{ steps.lifecycle.outputs.state_artifact_name }}
      previous_state_present: ${{ steps.previous.outputs.previous_state_present }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve authoritative protected controller run
        id: controller
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ inputs.controller_run_id || github.event.workflow_run.id }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$DISPATCH_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            mkdir -p artifacts/controller
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WORKFLOW_RUN_ID" > artifacts/controller/controller-producer-run.json
            producer_head_sha="$(node --input-type=module - artifacts/controller/controller-producer-run.json <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (run.repository?.full_name !== process.env.GITHUB_REPOSITORY
            || run.path !== '.github/workflows/protected-verification-controller.yml'
            || run.event !== 'workflow_dispatch'
            || run.status !== 'completed' || run.conclusion !== 'success'
            || Number(run.run_attempt) !== 1 || run.head_branch !== 'main'
            || run.actor?.login !== 'github-actions[bot]' || run.triggering_actor?.login !== 'github-actions[bot]'
            || !/^[a-f0-9]{40}$/.test(run.head_sha ?? '')) {
            throw new Error('workflow_dispatch producer is not an authoritative protected controller run.');
          }
          process.stdout.write(run.head_sha);
          NODE
            )"
            printf 'producer_head_sha=%s\n' "$producer_head_sha" >> "$GITHUB_OUTPUT"
          fi
          printf 'bootstrap_active=true\ncontroller_run_id=%s\n' "$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download the unique protected-verification-plan artifact
        if: steps.controller.outputs.bootstrap_active == 'true'
        shell: bash
        env:
          CONTROLLER_RUN_ID: ${{ steps.controller.outputs.controller_run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/controller
          mapfile -t names < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROLLER_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("protected-verification-plan-"))) | .name')
          test "${#names[@]}" -eq 1
          gh run download "$CONTROLLER_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "${names[0]}" --dir artifacts/controller
          test -s artifacts/controller/protected-verification-plan.json

      - name: Resolve protected controller and candidate identities
        if: steps.controller.outputs.bootstrap_active == 'true'
        id: identity
        shell: bash
        env:
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          PRODUCER_HEAD_SHA: ${{ steps.controller.outputs.producer_head_sha }}
        run: |
          set -euo pipefail
          node --input-type=module - artifacts/controller/protected-verification-plan.json "$GITHUB_OUTPUT" <<'NODE'
          import fs from 'node:fs';
          const [planPath, outputPath] = process.argv.slice(2);
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          if (plan.schemaVersion !== 3 || plan.controller?.id !== 'atlas-protected-hosted-controller-v3' || plan.controller?.version !== 3) throw new Error('Protected hosted plan controller identity is invalid.');
          if (plan.controller.sourceSha !== plan.protectedBaseSha) throw new Error('Protected hosted controller source must be the protected base.');
          for (const [name, value] of [['controller_source_sha', plan.controller.sourceSha], ['candidate_head_sha', plan.candidateHeadSha], ['protected_base_sha', plan.protectedBaseSha]]) {
            if (!/^[a-f0-9]{40}$/.test(value)) throw new Error(`${name} is not an exact SHA.`);
            fs.appendFileSync(outputPath, `${name}=${value}\n`);
          }
          if (!Number.isSafeInteger(plan.prNumber) || plan.prNumber < 1) throw new Error('Protected hosted plan PR number is invalid.');
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            if (!/^[1-9][0-9]*$/.test(process.env.DISPATCH_PR_NUMBER ?? '')) throw new Error('workflow_dispatch PR routing key is malformed.');
            if (Number(process.env.DISPATCH_PR_NUMBER) !== plan.prNumber) throw new Error('workflow_dispatch PR routing key does not match protected plan.');
            if (process.env.PRODUCER_HEAD_SHA !== plan.protectedBaseSha || process.env.PRODUCER_HEAD_SHA !== plan.controller.sourceSha) {
              throw new Error('workflow_dispatch protected controller producer head does not match protected plan.');
            }
          }
          fs.appendFileSync(outputPath, `pr_number=${plan.prNumber}\n`);
          NODE

      - name: Check out exact protected controller source
        if: steps.controller.outputs.bootstrap_active == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.controller_source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: protected-control

      - name: Reject superseded head before expensive execution
        if: steps.controller.outputs.bootstrap_active == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
          CANDIDATE_HEAD_SHA: ${{ steps.identity.outputs.candidate_head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > artifacts/controller/current-pr.json
          node protected-control/tools/verification/assert-current-pr-head.mjs \
            --payload artifacts/controller/current-pr.json --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" --expected-head-sha "$CANDIDATE_HEAD_SHA"

      - name: Derive immutable hosted execution contract from protected plan
        if: steps.controller.outputs.bootstrap_active == 'true'
        id: contract
        shell: bash
        env:
          CURRENT_HEAD_SHA: ${{ steps.identity.outputs.candidate_head_sha }}
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
        run: |
          set -euo pipefail
          node --input-type=module - artifacts/controller/protected-verification-plan.json artifacts/controller/protected-hosted-execution.json "$GITHUB_OUTPUT" <<'NODE'
          import fs from 'node:fs';
          import { buildProtectedHostedExecutionContract } from './protected-control/tools/verification/protected-hosted-execution.mjs';
          const [planPath, outputPath, githubOutput] = process.argv.slice(2);
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const contract = buildProtectedHostedExecutionContract(plan, { currentHeadSha: process.env.CURRENT_HEAD_SHA });
          fs.writeFileSync(outputPath, `${JSON.stringify(contract, null, 2)}\n`);
          const bundleName = `protected-hosted-execution-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          for (const [name, value] of [
            ['bundle_name', bundleName], ['candidate_head_sha', contract.candidateHeadSha],
            ['controller_source_sha', contract.controllerSourceSha], ['protected_base_sha', plan.protectedBaseSha],
            ['pr_number', process.env.PR_NUMBER],
            ['hosted_count', contract.hosted.stableTestIds.length], ['specialist_count', contract.specialist.stableTestIds.length],
          ]) fs.appendFileSync(githubOutput, `${name}=${value}\n`);
          NODE

      - name: Restore latest authoritative exact-candidate lifecycle state
        if: steps.controller.outputs.bootstrap_active == 'true'
        id: previous
        shell: bash
        env:
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
          CANDIDATE_HEAD_SHA: ${{ steps.identity.outputs.candidate_head_sha }}
        run: |
          set -euo pipefail
          state_name="protected-verification-state-pr-$PR_NUMBER-$CANDIDATE_HEAD_SHA"
          printf 'state_artifact_name=%s\nprevious_state_present=false\n' "$state_name" >> "$GITHUB_OUTPUT"
          list="$RUNNER_TEMP/protected-state-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$state_name&per_page=100" > "$list"
          mapfile -t candidates < <(node --input-type=module - "$list" <<'NODE'
          import fs from 'node:fs';
          const artifacts = (JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).artifacts ?? [])
            .filter((artifact) => !artifact.expired && artifact.workflow_run?.id)
            .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
          for (const artifact of artifacts) process.stdout.write(`${artifact.id}\t${artifact.workflow_run.id}\n`);
          NODE
          )
          for candidate in "${candidates[@]}"; do
            IFS=$'\t' read -r artifact_id producer_run_id <<< "$candidate"
            [[ "$artifact_id" =~ ^[0-9]+$ && "$producer_run_id" =~ ^[0-9]+$ ]] || continue
            (( producer_run_id < GITHUB_RUN_ID )) || continue
            run_json="$RUNNER_TEMP/protected-state-run-$producer_run_id.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$producer_run_id" > "$run_json"
            if ! node --input-type=module - "$run_json" <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (run.status !== 'completed'
            || run.path !== '.github/workflows/protected-hosted-executor.yml'
            || !['workflow_run', 'workflow_dispatch'].includes(run.event)
            || run.repository?.full_name !== process.env.GITHUB_REPOSITORY) process.exit(1);
          NODE
            then
              continue
            fi
            candidate_dir="$RUNNER_TEMP/protected-state-$artifact_id"
            rm -rf "$candidate_dir"
            mkdir -p "$candidate_dir"
            if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$candidate_dir/state.zip"; then
              continue
            fi
            if ! unzip -q "$candidate_dir/state.zip" -d "$candidate_dir/unpacked"; then
              continue
            fi
            mapfile -t states < <(find "$candidate_dir/unpacked" -type f -name protected-verification-state.json -print)
            [[ "${#states[@]}" -eq 1 ]] || continue
            if node --input-type=module - "${states[0]}" "$run_json" "$PR_NUMBER" "$CANDIDATE_HEAD_SHA" <<'NODE'
          import fs from 'node:fs';
          import { validateProtectedVerificationState } from './protected-control/tools/verification/protected-verification-state.mjs';
          const [statePath, runPath, prValue, candidateHeadSha] = process.argv.slice(2);
          const state = validateProtectedVerificationState(JSON.parse(fs.readFileSync(statePath, 'utf8')));
          const run = JSON.parse(fs.readFileSync(runPath, 'utf8'));
          if (state.repository !== process.env.GITHUB_REPOSITORY || state.prNumber !== Number(prValue)
            || state.candidateHeadSha !== candidateHeadSha
            || state.producer.runId !== Number(run.id) || state.producer.runAttempt !== Number(run.run_attempt)
            || state.producer.workflowPath !== run.path || state.producer.event !== run.event) process.exit(1);
          NODE
            then
              cp "${states[0]}" artifacts/controller/previous-protected-verification-state.json
              cp "$run_json" artifacts/controller/previous-state-run.json
              printf 'previous_state_present=true\nprevious_state_run_id=%s\n' "$producer_run_id" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - name: Decide active base compatibility, evidence reuse and circuit breakers
        if: steps.controller.outputs.bootstrap_active == 'true'
        id: lifecycle
        shell: bash
        env:
          PREVIOUS_STATE_PRESENT: ${{ steps.previous.outputs.previous_state_present }}
        run: |
          set -euo pipefail
          plan=artifacts/controller/protected-verification-plan.json
          execution=artifacts/controller/protected-hosted-execution.json
          previous=artifacts/controller/previous-protected-verification-state.json
          changed=artifacts/controller/base-advance-changed-paths.json
          merge_status=clean
          if [[ "$PREVIOUS_STATE_PRESENT" == true ]]; then
            read -r old_base current_base candidate_head < <(node --input-type=module - "$previous" "$plan" <<'NODE'
          import fs from 'node:fs';
          const previous = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const current = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          process.stdout.write(`${previous.plan.protectedBaseSha} ${current.protectedBaseSha} ${current.candidateHeadSha}`);
          NODE
            )
            git -C protected-control fetch --no-tags origin "$old_base" "$current_base" "$candidate_head"
            git -C protected-control diff --name-only --diff-filter=ACDMRTUXB "$old_base" "$current_base" \
              | node --input-type=module - "$changed" <<'NODE'
          import fs from 'node:fs';
          const chunks = [];
          for await (const chunk of process.stdin) chunks.push(chunk);
          const paths = chunks.join('').split(/\r?\n/).filter(Boolean).sort();
          fs.writeFileSync(process.argv[2], `${JSON.stringify(paths, null, 2)}\n`);
          NODE
            set +e
            git -C protected-control merge-tree --write-tree "$current_base" "$candidate_head" > "$RUNNER_TEMP/merge-tree.txt" 2>&1
            merge_rc=$?
            set -e
            if [[ "$merge_rc" -eq 1 ]]; then merge_status=conflict
            elif [[ "$merge_rc" -ne 0 ]]; then cat "$RUNNER_TEMP/merge-tree.txt" >&2; exit "$merge_rc"
            fi
          else
            printf '[]\n' > "$changed"
          fi
          node --input-type=module - "$plan" "$execution" "$previous" "$changed" "$merge_status" artifacts/controller/protected-verification-lifecycle.json "$GITHUB_OUTPUT" <<'NODE'
          import fs from 'node:fs';
          import { decideProtectedWorkflowLifecycle } from './protected-control/tools/verification/protected-verification-workflow.mjs';
          import { verificationStateArtifactName } from './protected-control/tools/verification/protected-verification-state.mjs';
          const [planPath, executionPath, previousPath, changedPath, mergeStatus, outputPath, githubOutput] = process.argv.slice(2);
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const plan = read(planPath);
          const execution = read(executionPath);
          const previousState = fs.existsSync(previousPath) ? read(previousPath) : null;
          const authorityManifest = read('protected-control/tools/verification/verification-authority-manifest.json');
          const lifecycle = decideProtectedWorkflowLifecycle({
            currentPlan: plan,
            currentExecution: execution,
            previousState,
            baseAdvance: {
              changedPaths: read(changedPath),
              mergeStatus,
              authorityPaths: authorityManifest.components.map(({ path }) => path),
              candidateRequiredPaths: ['src/', 'web/', 'package.json', 'package-lock.json'],
            },
            now: new Date().toISOString(),
          });
          fs.writeFileSync(outputPath, `${JSON.stringify(lifecycle, null, 2)}\n`);
          const values = {
            disposition: lifecycle.disposition,
            execute_environment: String(lifecycle.executeEnvironment),
            execute_hosted: String(lifecycle.executeHostedEvidenceIds.length > 0),
            heavy_executions_required: String(lifecycle.heavyExecutionsRequired),
            reuse_count: String(lifecycle.reuseEvidenceIds.length),
            state_artifact_name: verificationStateArtifactName(plan.prNumber, plan.candidateHeadSha),
          };
          for (const [name, value] of Object.entries(values)) fs.appendFileSync(githubOutput, `${name}=${value}\n`);
          NODE

      - name: Publish protected execution contract
        if: steps.controller.outputs.bootstrap_active == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.contract.outputs.bundle_name }}
          path: |
            artifacts/controller/protected-verification-plan.json
            artifacts/controller/protected-hosted-execution.json
            artifacts/controller/product-identities.json
            artifacts/controller/verification-authority-identity.json
            artifacts/controller/protected-execution-environment-identity.json
            artifacts/controller/protected-verification-lifecycle.json
            artifacts/controller/base-advance-changed-paths.json
            artifacts/controller/previous-protected-verification-state.json
            artifacts/controller/previous-state-run.json
          if-no-files-found: error
          retention-days: 14

  reuse-evidence:
    if: needs.preflight.outputs.bootstrap_active == 'true' && needs.preflight.outputs.reuse_count != '0'
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      BUNDLE_NAME: ${{ needs.preflight.outputs.bundle_name }}
      CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.candidate_head_sha }}
      CONTROLLER_SOURCE_SHA: ${{ needs.preflight.outputs.controller_source_sha }}
    steps:
      - name: Download exact lifecycle bundle
        id: download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/controller artifacts/reuse/manifests
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BUNDLE_NAME" --dir artifacts/controller
          test -s artifacts/controller/protected-verification-plan.json
          test -s artifacts/controller/protected-verification-lifecycle.json
          test -s artifacts/controller/previous-protected-verification-state.json

      - name: Check out exact protected controller source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.controller_source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: protected-control

      - name: Rebind reusable evidence to the current forensic plan instance
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { materializeProtectedWorkflowReuse } from './protected-control/tools/verification/protected-verification-workflow.mjs';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const plan = read('artifacts/controller/protected-verification-plan.json');
          const lifecycle = read('artifacts/controller/protected-verification-lifecycle.json');
          const previousState = read('artifacts/controller/previous-protected-verification-state.json');
          const artifactName = `protected-reused-evidence-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const reused = materializeProtectedWorkflowReuse({
            currentPlan: plan,
            lifecycle,
            previousState,
            runProvenance: {
              repository: process.env.GITHUB_REPOSITORY,
              runId: Number(process.env.GITHUB_RUN_ID),
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              jobName: 'reuse-evidence',
              artifactName,
            },
          });
          const safe = (value) => value.replace(/[^A-Za-z0-9_.-]/g, '_');
          for (const manifest of reused.evidenceManifests) {
            fs.writeFileSync(path.join('artifacts/reuse/manifests', `${safe(manifest.evidenceId)}.evidence.json`), `${JSON.stringify(manifest, null, 2)}\n`);
          }
          if (reused.environmentQualification) {
            fs.writeFileSync('artifacts/reuse/protected-environment-qualification.json', `${JSON.stringify(reused.environmentQualification, null, 2)}\n`);
          }
          fs.writeFileSync('artifacts/reuse/reuse-summary.json', `${JSON.stringify({
            schemaVersion: 1,
            candidateHeadSha: plan.candidateHeadSha,
            planSemanticDigest: plan.planSemanticDigest,
            planInstanceDigest: plan.planInstanceDigest,
            disposition: lifecycle.disposition,
            evidenceIds: reused.evidenceManifests.map(({ evidenceId }) => evidenceId).sort(),
          }, null, 2)}\n`);
          NODE

      - name: Publish digest-bound reused evidence
        id: publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-reused-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/reuse
          if-no-files-found: error
          retention-days: 14

  environment-qualification:
    if: needs.preflight.outputs.bootstrap_active == 'true' && needs.preflight.outputs.execute_environment == 'true'
    needs: [preflight]
    outputs:
      failure_stage: ${{ steps.failure.outputs.failure_stage }}
      failure_code: ${{ steps.failure.outputs.failure_code }}
      failure_ownership: ${{ steps.failure.outputs.failure_ownership }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.candidate_head_sha }}
      CONTROLLER_RUN_ID: ${{ needs.preflight.outputs.controller_run_id }}
      PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
      BUNDLE_NAME: ${{ needs.preflight.outputs.bundle_name }}
      ATLAS_CANDIDATE_IMAGE: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    steps:
      - name: Download protected plan and execution contract
        id: download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/controller artifacts/environment
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BUNDLE_NAME" --dir artifacts/controller
          test -s artifacts/controller/protected-verification-plan.json
          test -s artifacts/controller/protected-hosted-execution.json

      - name: Check out protected default-branch source for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        id: checkout_dispatch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: protected-control

      - name: Fence workflow_dispatch source to exact protected controller
        if: github.event_name == 'workflow_dispatch'
        id: checkout_dispatch_fence
        shell: bash
        env:
          CONTROLLER_SOURCE_SHA: ${{ needs.preflight.outputs.controller_source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C protected-control rev-parse HEAD)" = "$CONTROLLER_SOURCE_SHA"

      - name: Check out exact protected controller source for workflow_run
        if: github.event_name == 'workflow_run'
        id: checkout_workflow_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.controller_source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: protected-control

      - name: Fence exact head and materialize protected dependencies
        id: fence
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > artifacts/controller/current-pr.json
          node protected-control/tools/verification/assert-current-pr-head.mjs \
            --payload artifacts/controller/current-pr.json --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" --expected-head-sha "$CANDIDATE_HEAD_SHA"
          npm ci --prefix protected-control/e2e --ignore-scripts --no-audit --no-fund
          git -C protected-control fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git -C protected-control rev-parse FETCH_HEAD)" = "$CANDIDATE_HEAD_SHA"
          candidate_dir="$RUNNER_TEMP/atlas-environment-candidate-$GITHUB_RUN_ID"
          git -C protected-control worktree add --detach "$candidate_dir" "$CANDIDATE_HEAD_SHA"
          test ! -e "$candidate_dir/e2e/node_modules"
          ln -s /protected-e2e-node-modules/node_modules "$candidate_dir/e2e/node_modules"
          printf '%s\n' "$candidate_dir" > artifacts/environment/candidate-dir.txt

      - name: Qualify exact protected environment once
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="$(cat artifacts/environment/candidate-dir.txt)"
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          restore_artifact_ownership() {
            sudo chown -R "$host_uid:$host_gid" artifacts/environment
          }
          trap restore_artifact_ownership EXIT
          sudo chown 1000:1000 artifacts/environment
          timeout --signal=KILL 180s docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 192 \
            --memory 1536m \
            --cpus 2 \
            --user 1000:1000 \
            --shm-size 1g \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --env "ATLAS_PROTECTED_CONTAINER_IMAGE=$ATLAS_CANDIDATE_IMAGE" \
            --env HOME=/tmp/home \
            --mount "type=bind,src=$candidate_dir,dst=/candidate,readonly" \
            --mount "type=bind,src=$PWD/protected-control,dst=/protected-control,readonly" \
            --mount "type=bind,src=$PWD/protected-control/e2e/node_modules,dst=/protected-e2e-node-modules/node_modules,readonly" \
            --mount "type=bind,src=$PWD/artifacts/environment,dst=/tmp/artifacts" \
            "$ATLAS_CANDIDATE_IMAGE" \
            bash -lc 'set -euo pipefail
              mkdir -p /tmp/home /tmp/atlas-python-bin /tmp/atlas-python-pycache /tmp/artifacts
              ln -s /usr/bin/python3 /tmp/atlas-python-bin/python
              export PATH="/tmp/atlas-python-bin:$PATH"
              export PYTHONPYCACHEPREFIX=/tmp/atlas-python-pycache
              cd /protected-control
              node tools/verification/protected-execution-environment-probe.mjs \
                --config tools/verification/protected-execution-environment.json \
                --output /tmp/artifacts/protected-environment-qualification.json'
          restore_artifact_ownership
          trap - EXIT
          test -s artifacts/environment/protected-environment-qualification.json

      - name: Bind environment qualification into dependency evidence
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildEvidenceManifest } from './protected-control/tools/verification/evidence-manifest.mjs';
          import { validateProtectedExecutionEnvironmentQualification } from './protected-control/tools/verification/protected-execution-environment.mjs';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const plan = read('artifacts/controller/protected-verification-plan.json');
          const qualification = validateProtectedExecutionEnvironmentQualification(
            read('artifacts/environment/protected-environment-qualification.json'), plan.environmentIdentity,
          );
          const manifest = buildEvidenceManifest({
            evidenceId: 'ENVIRONMENT_QUALIFICATION', evidenceType: 'ENVIRONMENT_QUALIFICATION',
            result: 'SUCCESS', disposition: 'EXECUTED', candidateHeadSha: plan.candidateHeadSha,
            planSemanticDigest: plan.planSemanticDigest, planInstanceDigest: plan.planInstanceDigest,
            authorityDigest: plan.authorityDigest, environmentDigest: plan.environmentDigest,
            productIdentities: {}, stableTestIds: [], executionPolicyDigest: plan.executionPolicyDigest,
            runProvenance: {
              repository: process.env.GITHUB_REPOSITORY, runId: Number(process.env.GITHUB_RUN_ID),
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobName: 'environment-qualification',
              artifactName: `protected-environment-qualification-${process.env.CONTROLLER_RUN_ID}-${plan.candidateHeadSha}`,
            },
            dependencies: {
              evidenceDigests: [],
              evidenceSemanticDigests: [],
              paths: ['tools/verification/protected-execution-environment-probe.mjs', 'tools/verification/protected-execution-environment.json'],
              dataCapabilities: [],
            },
            availability: { expiresAt: new Date(Date.now() + 14 * 86400000).toISOString(), revoked: false },
          });
          fs.writeFileSync('artifacts/environment/protected-environment-qualification.json', `${JSON.stringify(qualification, null, 2)}\n`);
          fs.writeFileSync('artifacts/environment/environment-evidence-manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Publish protected environment qualification
        id: publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-environment-qualification-${{ needs.preflight.outputs.controller_run_id }}-${{ needs.preflight.outputs.candidate_head_sha }}
          path: |
            artifacts/environment/protected-environment-qualification.json
            artifacts/environment/environment-evidence-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Classify environment workflow outcome
        if: always()
        id: failure
        shell: bash
        env:
          DOWNLOAD: ${{ steps.download.outcome }}
          CHECKOUT_DISPATCH: ${{ steps.checkout_dispatch.outcome }}
          CHECKOUT_DISPATCH_FENCE: ${{ steps.checkout_dispatch_fence.outcome }}
          CHECKOUT_WORKFLOW_RUN: ${{ steps.checkout_workflow_run.outcome }}
          FENCE: ${{ steps.fence.outcome }}
          PROBE: ${{ steps.probe.outcome }}
          BIND: ${{ steps.bind.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          if [[ "$PROBE" == failure ]]; then
            printf 'failure_stage=ENVIRONMENT_QUALIFICATION\nfailure_code=ENVIRONMENT_PROBE_FAILED\nfailure_ownership=environment\n' >> "$GITHUB_OUTPUT"
          elif [[ "$PUBLISH" == failure ]]; then
            printf 'failure_stage=ENVIRONMENT_QUALIFICATION\nfailure_code=ENVIRONMENT_ARTIFACT_PUBLICATION_FAILED\nfailure_ownership=external\n' >> "$GITHUB_OUTPUT"
          elif [[ "$DOWNLOAD" == failure || "$CHECKOUT_DISPATCH" == failure || "$CHECKOUT_DISPATCH_FENCE" == failure || "$CHECKOUT_WORKFLOW_RUN" == failure || "$FENCE" == failure || "$BIND" == failure ]]; then
            printf 'failure_stage=AUTHORITY_PREFLIGHT\nfailure_code=ENVIRONMENT_AUTHORITY_WIRING_FAILED\nfailure_ownership=authority\n' >> "$GITHUB_OUTPUT"
          fi

  hosted-shards:
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.bootstrap_active == 'true' &&
      needs.preflight.outputs.execute_hosted == 'true' &&
      (needs.environment-qualification.result == 'success' || needs.environment-qualification.result == 'skipped') &&
      (needs.reuse-evidence.result == 'success' || needs.reuse-evidence.result == 'skipped')
    needs: [preflight, reuse-evidence, environment-qualification]
    outputs:
      failure_stage: ${{ steps.failure.outputs.failure_stage }}
      failure_code: ${{ steps.failure.outputs.failure_code }}
      failure_ownership: ${{ steps.failure.outputs.failure_ownership }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            index: 0
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.candidate_head_sha }}
      CONTROLLER_RUN_ID: ${{ needs.preflight.outputs.controller_run_id }}
      PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
      BUNDLE_NAME: ${{ needs.preflight.outputs.bundle_name }}
      ATLAS_E2E_WORKERS: '1'
      ATLAS_E2E_SHARD: ${{ matrix.shard }}/1
    steps:
      - name: Download protected execution and environment contracts
        id: download
        shell: bash
        env:
          EXECUTE_ENVIRONMENT: ${{ needs.preflight.outputs.execute_environment }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/controller artifacts/environment artifacts/reused
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BUNDLE_NAME" --dir artifacts/controller
          if [[ "$EXECUTE_ENVIRONMENT" == true ]]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "protected-environment-qualification-$CONTROLLER_RUN_ID-$CANDIDATE_HEAD_SHA" --dir artifacts/environment
          else
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "protected-reused-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --dir artifacts/reused
            mapfile -t environment_manifests < <(find artifacts/reused -type f -name 'ENVIRONMENT_QUALIFICATION.evidence.json')
            mapfile -t qualifications < <(find artifacts/reused -type f -name protected-environment-qualification.json)
            test "${#environment_manifests[@]}" -eq 1
            test "${#qualifications[@]}" -eq 1
            cp "${environment_manifests[0]}" artifacts/environment/environment-evidence-manifest.json
            cp "${qualifications[0]}" artifacts/environment/protected-environment-qualification.json
          fi
          test -s artifacts/controller/protected-verification-plan.json
          test -s artifacts/controller/protected-hosted-execution.json
          test -s artifacts/environment/protected-environment-qualification.json
          test -s artifacts/environment/environment-evidence-manifest.json

      - name: Check out protected default-branch source for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        id: checkout_dispatch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: protected-control

      - name: Fence workflow_dispatch source to exact protected controller
        if: github.event_name == 'workflow_dispatch'
        id: checkout_dispatch_fence
        shell: bash
        env:
          CONTROLLER_SOURCE_SHA: ${{ needs.preflight.outputs.controller_source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C protected-control rev-parse HEAD)" = "$CONTROLLER_SOURCE_SHA"

      - name: Check out exact protected controller source for workflow_run
        if: github.event_name == 'workflow_run'
        id: checkout_workflow_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.controller_source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: protected-control

      - name: Validate environment dependency and fence current head
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > artifacts/controller/current-pr.json
          node protected-control/tools/verification/assert-current-pr-head.mjs \
            --payload artifacts/controller/current-pr.json --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" --expected-head-sha "$CANDIDATE_HEAD_SHA"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateEvidenceManifest } from './protected-control/tools/verification/evidence-manifest.mjs';
          import { validateProtectedExecutionEnvironmentQualification } from './protected-control/tools/verification/protected-execution-environment.mjs';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const plan = read('artifacts/controller/protected-verification-plan.json');
          validateProtectedExecutionEnvironmentQualification(read('artifacts/environment/protected-environment-qualification.json'), plan.environmentIdentity);
          const evidence = validateEvidenceManifest(read('artifacts/environment/environment-evidence-manifest.json'));
          if (evidence.evidenceId !== 'ENVIRONMENT_QUALIFICATION' || evidence.result !== 'SUCCESS'
            || evidence.candidateHeadSha !== plan.candidateHeadSha
            || evidence.planSemanticDigest !== plan.planSemanticDigest || evidence.planInstanceDigest !== plan.planInstanceDigest
            || evidence.authorityDigest !== plan.authorityDigest || evidence.environmentDigest !== plan.environmentDigest) {
            throw new Error('Environment evidence identity mismatch.');
          }
          NODE

      - name: Materialize exact candidate and enumerate capability source lists
        id: select
        shell: bash
        run: |
          set -euo pipefail
          git -C protected-control fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git -C protected-control rev-parse FETCH_HEAD)" = "$CANDIDATE_HEAD_SHA"
          candidate_dir="$RUNNER_TEMP/atlas-candidate-$GITHUB_RUN_ID-${{ matrix.shard }}"
          git -C protected-control worktree add --detach "$candidate_dir" "$CANDIDATE_HEAD_SHA"
          printf '%s\n' "$candidate_dir" > artifacts/controller/candidate-dir.txt
          execution=artifacts/controller/protected-hosted-execution.json
          npm ci --prefix protected-control/e2e --ignore-scripts --no-audit --no-fund
          (cd protected-control && ATLAS_ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts/controller/protected-playwright-list" \
            npm exec --prefix e2e -- playwright test --config=e2e/playwright.config.mjs --list) \
            > artifacts/controller/protected-playwright-source-list.txt
          test ! -e "$candidate_dir/e2e/node_modules"
          ln -s /protected-e2e-node-modules/node_modules "$candidate_dir/e2e/node_modules"
          timeout --signal=KILL 120s docker run --rm \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 192 --memory 1536m --cpus 2 --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount "type=bind,src=$candidate_dir,dst=/candidate,readonly" \
            --mount "type=bind,src=$PWD/protected-control/e2e/node_modules,dst=/protected-e2e-node-modules/node_modules,readonly" \
            mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07 \
            bash -lc 'cd /candidate && CI=1 ATLAS_ARTIFACTS_DIR=/tmp/artifacts /candidate/e2e/node_modules/.bin/playwright test --config=/candidate/e2e/playwright.config.mjs --list' \
            > artifacts/controller/candidate-playwright-source-list.txt
          ! jq -e '.hosted.partitions[]? | select(.dataCapability == "real_fullworld")' "$execution" >/dev/null
          jq -e '[.hosted.partitions[]?.dataCapability] | all(. == "qualification_fixture" or . == "bounded_real_world")' "$execution" >/dev/null
          mkdir -p artifacts/controller/test-lists
          mapfile -t capabilities < <(jq -r '.hosted.partitions[] | select((.stableTestIds | length) > 0) | .dataCapability' "$execution" | sort -u)
          test "${#capabilities[@]}" -gt 0
          for dataCapability in "${capabilities[@]}"; do
            mkdir -p "artifacts/controller/test-lists/$dataCapability"
            node protected-control/tools/verification/protected-playwright-selection.mjs \
              --list artifacts/controller/protected-playwright-source-list.txt --execution "$execution" \
              --placement protected --data-capability "$dataCapability" \
              > "artifacts/controller/test-lists/$dataCapability/protected.txt"
            node protected-control/tools/verification/protected-playwright-selection.mjs \
              --list artifacts/controller/candidate-playwright-source-list.txt --execution "$execution" \
              --placement candidate-additions --data-capability "$dataCapability" \
              > "artifacts/controller/test-lists/$dataCapability/candidate-additions.txt"
            node protected-control/tools/verification/protected-playwright-selection.mjs \
              --list artifacts/controller/candidate-playwright-source-list.txt --execution "$execution" \
              --placement candidate-modifications --data-capability "$dataCapability" \
              > "artifacts/controller/test-lists/$dataCapability/candidate-modifications.txt"
          done

      - name: Build exact protected products required by hosted partitions
        id: product
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - artifacts/controller/protected-verification-plan.json artifacts/controller/protected-hosted-execution.json artifacts/controller/hosted-products.json <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { buildQualificationWorld, qualificationTrustDescriptor, verifyQualificationWorld } from './protected-control/tools/verification/qualification-world.mjs';
          const [planPath, executionPath, outputPath] = process.argv.slice(2);
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const execution = JSON.parse(fs.readFileSync(executionPath, 'utf8'));
          const capabilities = [...new Set(execution.hosted.partitions.filter((p) => p.stableTestIds.length).map((p) => p.dataCapability))].sort();
          if (capabilities.includes('real_fullworld') || capabilities.some((value) => !['qualification_fixture', 'bounded_real_world'].includes(value))) throw new Error('unsupported hosted data capability');
          const products = {};
          const trustDir = path.join('artifacts', 'controller', 'product-trust');
          fs.mkdirSync(trustDir, { recursive: true });
          if (capabilities.includes('qualification_fixture')) {
            const destination = path.join(process.env.RUNNER_TEMP, `atlas-qualification-${process.env.GITHUB_RUN_ID}-${process.env.ATLAS_E2E_SHARD.replace('/', '-')}`);
            fs.rmSync(destination, { recursive: true, force: true });
            await buildQualificationWorld(destination);
            const manifest = await verifyQualificationWorld(destination);
            const expected = plan.productIdentities.qualification_fixture;
            if (!expected || expected.id !== manifest.fixtureId || expected.digest !== manifest.productDigest) throw new Error('Qualification fixture identity does not match protected plan.');
            const trustPath = path.join(trustDir, 'qualification_fixture.json');
            fs.writeFileSync(trustPath, `${JSON.stringify(qualificationTrustDescriptor(manifest))}\n`);
            products.qualification_fixture = { root: destination, trustPath: path.resolve(trustPath) };
          }
          if (capabilities.includes('bounded_real_world')) {
            const registry = JSON.parse(fs.readFileSync('./protected-control/tools/verification/protected-hosted-product-identities.json', 'utf8'));
            const expected = plan.productIdentities.bounded_real_world;
            if (!expected || expected.id !== registry.bounded_real_world?.id || expected.digest !== registry.bounded_real_world?.digest) throw new Error('bounded_real_world protected plan identity does not match protected registry');
            const { buildBoundedRealWorld, verifyBoundedRealWorld, boundedRealTrustDescriptor } = await import('./protected-control/tools/verification/bounded-real-world.mjs');
            const destination = path.join(process.env.RUNNER_TEMP, `atlas-bounded-real-${process.env.GITHUB_RUN_ID}-${process.env.ATLAS_E2E_SHARD.replace('/', '-')}`);
            fs.rmSync(destination, { recursive: true, force: true });
            const built = await buildBoundedRealWorld(destination, { sourceRoot: './protected-control' });
            const verified = await verifyBoundedRealWorld(destination);
            if (built.productDigest !== expected.digest || verified.productDigest !== expected.digest) throw new Error('bounded_real_world product identity does not match protected plan');
            const trustPath = path.join(trustDir, 'bounded_real_world.json');
            fs.writeFileSync(trustPath, `${JSON.stringify(boundedRealTrustDescriptor(verified))}\n`);
            products.bounded_real_world = { root: destination, trustPath: path.resolve(trustPath) };
          }
          fs.writeFileSync(outputPath, `${JSON.stringify(products, null, 2)}\n`);
          NODE

      - name: Build separate protected-body and candidate execution contexts
        id: context
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="$(cat artifacts/controller/candidate-dir.txt)"
          protected_context="$RUNNER_TEMP/protected-execution-context-$GITHUB_RUN_ID-${{ matrix.shard }}"
          candidate_context="$RUNNER_TEMP/candidate-additions-execution-context-$GITHUB_RUN_ID-${{ matrix.shard }}"
          rm -rf "$protected_context" "$candidate_context"
          mkdir -p "$protected_context" "$candidate_context"
          rsync -a --delete --exclude='.git' "$candidate_dir/" "$protected_context/"
          for path in web src; do test -d "$protected_context/$path"; test ! -L "$protected_context/$path"; done
          rm -rf "$protected_context/e2e"
          cp -a protected-control/e2e "$protected_context/e2e"
          rm -rf "$protected_context/e2e/node_modules"
          rm -f "$protected_context/.dockerignore" "$protected_context/e2e/Dockerfile.dockerignore"
          mkdir -p "$protected_context/tools/verification"
          cp protected-control/tools/verification/stable-id.mjs "$protected_context/tools/verification/stable-id.mjs"
          rsync -a --delete --exclude='.git' "$candidate_dir/" "$candidate_context/"
          for path in e2e e2e/tests web src; do test -d "$candidate_context/$path"; test ! -L "$candidate_context/$path"; done
          rm -rf "$candidate_context/e2e/node_modules"
          rm -f "$candidate_context/.dockerignore" "$candidate_context/e2e/Dockerfile.dockerignore"
          cp protected-control/e2e/Dockerfile "$candidate_context/e2e/Dockerfile"
          cp protected-control/e2e/package.json protected-control/e2e/package-lock.json "$candidate_context/e2e/"
          cp protected-control/e2e/playwright.config.mjs protected-control/e2e/summary-reporter.mjs "$candidate_context/e2e/"
          mkdir -p "$candidate_context/tools/verification"
          cp protected-control/tools/verification/stable-id.mjs "$candidate_context/tools/verification/stable-id.mjs"
          printf '%s\n' "$protected_context" > artifacts/controller/protected-execution-context.txt
          printf '%s\n' "$candidate_context" > artifacts/controller/candidate-additions-execution-context.txt

      - name: Run each hosted data-capability partition against only its exact product
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          protected_context="$(cat artifacts/controller/protected-execution-context.txt)"
          candidate_context="$(cat artifacts/controller/candidate-additions-execution-context.txt)"
          execution=artifacts/controller/protected-hosted-execution.json
          products=artifacts/controller/hosted-products.json
          shard_root="$PWD/artifacts/hosted-shard-${{ matrix.shard }}"
          source_manifest="$shard_root/source-manifest.json"
          mkdir -p "$shard_root/sources"
          printf '[]\n' > "$source_manifest"
          export ATLAS_CODE_REVISION="$CANDIDATE_HEAD_SHA"
          export ATLAS_PLAN_SEMANTIC_DIGEST="$(jq -r .planSemanticDigest artifacts/controller/protected-verification-plan.json)"
          export ATLAS_PLAN_INSTANCE_DIGEST="$(jq -r .planInstanceDigest artifacts/controller/protected-verification-plan.json)"
          export ATLAS_AUTHORITY_DIGEST="$(jq -r .authorityDigest artifacts/controller/protected-verification-plan.json)"
          export ATLAS_ENVIRONMENT_DIGEST="$(jq -r .environmentDigest artifacts/controller/protected-verification-plan.json)"
          export ATLAS_E2E_SHARD='1/1'
          compose_down() { docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml down -v --remove-orphans >/dev/null 2>&1 || true; }
          trap compose_down EXIT
          append_source() {
            local placement="$1" dataCapability="$2" summaryPath="$3" tmp
            tmp="$(mktemp)"
            jq --arg placement "$placement" --arg dataCapability "$dataCapability" --arg summaryPath "$summaryPath" \
              '. + [{placement: $placement, dataCapability: $dataCapability, summaryPath: $summaryPath}]' "$source_manifest" > "$tmp"
            mv "$tmp" "$source_manifest"
          }
          mapfile -t capabilities < <(jq -r '.hosted.partitions[] | select((.stableTestIds | length) > 0) | .dataCapability' "$execution" | sort -u)
          for dataCapability in "${capabilities[@]}"; do
            case "$dataCapability" in qualification_fixture|bounded_real_world) ;; *) exit 1 ;; esac
            product_root="$(jq -r --arg capability "$dataCapability" '.[$capability].root // empty' "$products")"
            trust_path="$(jq -r --arg capability "$dataCapability" '.[$capability].trustPath // empty' "$products")"
            test -d "$product_root"; test -s "$trust_path"
            protected_list="$PWD/artifacts/controller/test-lists/$dataCapability/protected.txt"
            candidate_list="$PWD/artifacts/controller/test-lists/$dataCapability/candidate-additions.txt"
            modification_list="$PWD/artifacts/controller/test-lists/$dataCapability/candidate-modifications.txt"
            test -f "$protected_list"; test -f "$candidate_list"; test -f "$modification_list"
            [[ -s "$protected_list" || -s "$candidate_list" || -s "$modification_list" ]]
            export COMPOSE_PROJECT_NAME="atlas-protected-${GITHUB_RUN_ID}-${{ matrix.shard }}-${dataCapability//_/-}"
            export ATLAS_QUALIFICATION_PUBLICATION_HOST="$product_root"
            export ATLAS_QUALIFICATION_TRUST_JSON="$(jq -c . "$trust_path")"
            export ATLAS_EXECUTION_CONTEXT="$protected_context" ATLAS_PROTECTED_TEST_LIST="$protected_list"
            export ATLAS_E2E_ARTIFACTS_HOST="$shard_root/sources/protected/$dataCapability"
            mkdir -p "$ATLAS_E2E_ARTIFACTS_HOST"
            compose_down
            docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml up -d --wait atlas-publication atlas-web
            if [[ -s "$protected_list" ]]; then
              export ATLAS_EXECUTION_CONTEXT="$protected_context" ATLAS_PROTECTED_TEST_LIST="$protected_list" ATLAS_E2E_ARTIFACTS_HOST="$shard_root/sources/protected/$dataCapability"
              mkdir -p "$ATLAS_E2E_ARTIFACTS_HOST"
              docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml build e2e
              docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml run --rm e2e
              append_source protected "$dataCapability" "$ATLAS_E2E_ARTIFACTS_HOST/summary.json"
            fi
            if [[ -s "$modification_list" ]]; then
              export ATLAS_EXECUTION_CONTEXT="$candidate_context" ATLAS_PROTECTED_TEST_LIST="$modification_list" ATLAS_E2E_ARTIFACTS_HOST="$shard_root/sources/candidate-modifications/$dataCapability"
              mkdir -p "$ATLAS_E2E_ARTIFACTS_HOST"
              docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml build e2e
              docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml run --rm e2e
              append_source candidate-modifications "$dataCapability" "$ATLAS_E2E_ARTIFACTS_HOST/summary.json"
            fi
            if [[ -s "$candidate_list" ]]; then
              export ATLAS_EXECUTION_CONTEXT="$candidate_context" ATLAS_PROTECTED_TEST_LIST="$candidate_list" ATLAS_E2E_ARTIFACTS_HOST="$shard_root/sources/candidate-additions/$dataCapability"
              mkdir -p "$ATLAS_E2E_ARTIFACTS_HOST"
              docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml build e2e
              docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml run --rm e2e
              append_source candidate-additions "$dataCapability" "$ATLAS_E2E_ARTIFACTS_HOST/summary.json"
            fi
            compose_down
          done

      - name: Convert shard result into protected machine evidence
        id: summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node protected-control/tools/verification/protected-hosted-shard-summary.mjs \
            --plan artifacts/controller/protected-verification-plan.json \
            --execution artifacts/controller/protected-hosted-execution.json \
            --source-manifest artifacts/hosted-shard-${{ matrix.shard }}/source-manifest.json \
            --shard-index ${{ matrix.index }} --shard-count 1 \
            > artifacts/hosted-shard-${{ matrix.shard }}/protected-shard-summary.json

      - name: Build dependency-bound hosted shard manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildEvidenceManifest } from './protected-control/tools/verification/evidence-manifest.mjs';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const plan = read('artifacts/controller/protected-verification-plan.json');
          const execution = read('artifacts/controller/protected-hosted-execution.json');
          const summary = read('artifacts/hosted-shard-${{ matrix.shard }}/protected-shard-summary.json');
          const environment = read('artifacts/environment/environment-evidence-manifest.json');
          const capabilities = [...new Set(execution.hosted.partitions.map(({ dataCapability }) => dataCapability))].sort();
          const products = Object.fromEntries(capabilities.map((capability) => [capability, plan.productIdentities[capability]]));
          const manifest = buildEvidenceManifest({
            evidenceId: 'HOSTED_FUNCTIONAL:SHARD_${{ matrix.shard }}', evidenceType: 'HOSTED_FUNCTIONAL',
            result: 'SUCCESS', disposition: 'EXECUTED', candidateHeadSha: plan.candidateHeadSha,
            planSemanticDigest: plan.planSemanticDigest, planInstanceDigest: plan.planInstanceDigest,
            authorityDigest: plan.authorityDigest, environmentDigest: plan.environmentDigest,
            productIdentities: products, stableTestIds: summary.executedStableTestIds,
            executionPolicyDigest: plan.executionPolicyDigest,
            runProvenance: {
              repository: process.env.GITHUB_REPOSITORY, runId: Number(process.env.GITHUB_RUN_ID),
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobName: 'hosted-shards',
              artifactName: `protected-hosted-shard-${process.env.CONTROLLER_RUN_ID}-${{ matrix.shard }}`,
            },
            dependencies: {
              evidenceDigests: [environment.evidenceDigest],
              evidenceSemanticDigests: [environment.evidenceSemanticDigest],
              paths: [], dataCapabilities: capabilities,
            },
            availability: { expiresAt: new Date(Date.now() + 14 * 86400000).toISOString(), revoked: false },
          });
          fs.writeFileSync('artifacts/hosted-shard-${{ matrix.shard }}/protected-shard-evidence.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Publish protected shard evidence
        id: publish
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-hosted-shard-${{ needs.preflight.outputs.controller_run_id }}-${{ matrix.shard }}
          path: |
            artifacts/hosted-shard-${{ matrix.shard }}/protected-shard-summary.json
            artifacts/hosted-shard-${{ matrix.shard }}/protected-shard-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Classify hosted workflow outcome
        if: always()
        id: failure
        shell: bash
        env:
          DOWNLOAD: ${{ steps.download.outcome }}
          CHECKOUT_DISPATCH: ${{ steps.checkout_dispatch.outcome }}
          CHECKOUT_DISPATCH_FENCE: ${{ steps.checkout_dispatch_fence.outcome }}
          CHECKOUT_WORKFLOW_RUN: ${{ steps.checkout_workflow_run.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          SELECT: ${{ steps.select.outcome }}
          PRODUCT: ${{ steps.product.outcome }}
          CONTEXT: ${{ steps.context.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          SUMMARY: ${{ steps.summary.outcome }}
          MANIFEST: ${{ steps.manifest.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          if [[ "$PRODUCT" == failure ]]; then
            printf 'failure_stage=EXECUTING\nfailure_code=PROTECTED_PRODUCT_BUILD_FAILED\nfailure_ownership=product\n' >> "$GITHUB_OUTPUT"
          elif [[ "$BROWSER" == failure ]]; then
            printf 'failure_stage=EXECUTING\nfailure_code=HOSTED_BROWSER_ASSERTION_FAILED\nfailure_ownership=candidate\n' >> "$GITHUB_OUTPUT"
          elif [[ "$PUBLISH" == failure ]]; then
            printf 'failure_stage=EXECUTING\nfailure_code=HOSTED_ARTIFACT_PUBLICATION_FAILED\nfailure_ownership=external\n' >> "$GITHUB_OUTPUT"
          elif [[ "$DOWNLOAD" == failure || "$CHECKOUT_DISPATCH" == failure || "$CHECKOUT_DISPATCH_FENCE" == failure || "$CHECKOUT_WORKFLOW_RUN" == failure || "$VALIDATE" == failure || "$SELECT" == failure || "$CONTEXT" == failure || "$SUMMARY" == failure || "$MANIFEST" == failure ]]; then
            printf 'failure_stage=AUTHORITY_PREFLIGHT\nfailure_code=HOSTED_AUTHORITY_WIRING_FAILED\nfailure_ownership=authority\n' >> "$GITHUB_OUTPUT"
          fi

  fan-in:
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.bootstrap_active == 'true' &&
      needs.preflight.outputs.disposition != 'BLOCKED' &&
      needs.preflight.outputs.disposition != 'REINTEGRATE' &&
      (needs.reuse-evidence.result == 'success' || needs.reuse-evidence.result == 'skipped') &&
      (needs.environment-qualification.result == 'success' || needs.environment-qualification.result == 'skipped') &&
      (needs.hosted-shards.result == 'success' || needs.hosted-shards.result == 'skipped')
    needs: [preflight, reuse-evidence, environment-qualification, hosted-shards]
    outputs:
      failure_stage: ${{ steps.failure.outputs.failure_stage }}
      failure_code: ${{ steps.failure.outputs.failure_code }}
      failure_ownership: ${{ steps.failure.outputs.failure_ownership }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.candidate_head_sha }}
      CONTROLLER_RUN_ID: ${{ needs.preflight.outputs.controller_run_id }}
      PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
      BUNDLE_NAME: ${{ needs.preflight.outputs.bundle_name }}
      REUSE_COUNT: ${{ needs.preflight.outputs.reuse_count }}
      EXECUTE_ENVIRONMENT: ${{ needs.preflight.outputs.execute_environment }}
      EXECUTE_HOSTED: ${{ needs.preflight.outputs.execute_hosted }}
    steps:
      - name: Download exact plan and all executed or reused evidence
        id: download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/controller artifacts/environment artifacts/reused artifacts/shards
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BUNDLE_NAME" --dir artifacts/controller
          if [[ "$REUSE_COUNT" != 0 ]]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "protected-reused-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --dir artifacts/reused
          fi
          if [[ "$EXECUTE_ENVIRONMENT" == true ]]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "protected-environment-qualification-$CONTROLLER_RUN_ID-$CANDIDATE_HEAD_SHA" --dir artifacts/environment
          fi
          if [[ "$EXECUTE_HOSTED" == true ]]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --pattern 'protected-hosted-shard-*' --dir artifacts/shards
          fi
          test -s artifacts/controller/protected-verification-plan.json
          test -s artifacts/controller/protected-hosted-execution.json
          test -s artifacts/controller/protected-verification-lifecycle.json

      - name: Check out exact protected controller source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.controller_source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: protected-control

      - name: Reject stale head before evidence acceptance
        id: fence
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > artifacts/controller/current-pr.json
          node protected-control/tools/verification/assert-current-pr-head.mjs \
            --payload artifacts/controller/current-pr.json --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" --expected-head-sha "$CANDIDATE_HEAD_SHA"

      - name: Validate one exact mixed EXECUTED and REUSED fan-in and build lifecycle state
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { buildEvidenceManifest } from './protected-control/tools/verification/evidence-manifest.mjs';
          import { buildProtectedWorkflowSuccessState } from './protected-control/tools/verification/protected-verification-workflow.mjs';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const walk = (dir, predicate) => {
            if (!fs.existsSync(dir)) return [];
            const values = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) values.push(...walk(full, predicate));
              else if (predicate(entry.name)) values.push(full);
            }
            return values.sort();
          };
          const plan = read('artifacts/controller/protected-verification-plan.json');
          const execution = read('artifacts/controller/protected-hosted-execution.json');
          const lifecycle = read('artifacts/controller/protected-verification-lifecycle.json');
          const previousState = fs.existsSync('artifacts/controller/previous-protected-verification-state.json')
            ? read('artifacts/controller/previous-protected-verification-state.json') : null;
          const manifestFiles = [
            ...walk('artifacts/reused', (name) => name.endsWith('.evidence.json')),
            ...walk('artifacts/environment', (name) => name === 'environment-evidence-manifest.json'),
            ...walk('artifacts/shards', (name) => name === 'protected-shard-evidence.json'),
          ];
          const manifests = manifestFiles.map(read);
          const qualificationFiles = [
            ...walk('artifacts/environment', (name) => name === 'protected-environment-qualification.json'),
            ...walk('artifacts/reused', (name) => name === 'protected-environment-qualification.json'),
          ];
          const zeroWork = lifecycle.expectedEvidence.length === 0;
          if (qualificationFiles.length !== (zeroWork ? 0 : 1)) throw new Error(`Expected ${zeroWork ? 'no' : 'exactly one'} environment qualification, got ${qualificationFiles.length}.`);
          const producer = {
            repository: process.env.GITHUB_REPOSITORY,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            workflowPath: '.github/workflows/protected-hosted-executor.yml',
            event: process.env.GITHUB_EVENT_NAME,
          };
          const success = buildProtectedWorkflowSuccessState({
            currentPlan: plan,
            currentExecution: execution,
            lifecycle,
            evidenceManifests: manifests,
            environmentQualification: zeroWork ? null : read(qualificationFiles[0]),
            previousState,
            currentHeadSha: process.env.CANDIDATE_HEAD_SHA,
            producer,
          });
          const capabilities = [...new Set(execution.hosted.partitions.map(({ dataCapability }) => dataCapability))].sort();
          const products = Object.fromEntries(capabilities.map((capability) => [capability, plan.productIdentities[capability]]));
          const fanInEvidence = buildEvidenceManifest({
            evidenceId: 'FANIN:HOSTED',
            evidenceType: 'FANIN',
            result: 'SUCCESS',
            disposition: 'EXECUTED',
            candidateHeadSha: plan.candidateHeadSha,
            planSemanticDigest: plan.planSemanticDigest,
            planInstanceDigest: plan.planInstanceDigest,
            authorityDigest: plan.authorityDigest,
            environmentDigest: plan.environmentDigest,
            productIdentities: products,
            stableTestIds: execution.hosted.stableTestIds,
            executionPolicyDigest: plan.executionPolicyDigest,
            runProvenance: {
              repository: process.env.GITHUB_REPOSITORY,
              runId: Number(process.env.GITHUB_RUN_ID),
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              jobName: 'fan-in',
              artifactName: `protected-hosted-fan-in-${plan.protectedBaseSha}-${plan.candidateHeadSha}`,
            },
            dependencies: {
              evidenceDigests: success.state.evidenceManifests.map(({ evidenceDigest }) => evidenceDigest).sort(),
              evidenceSemanticDigests: success.state.evidenceManifests.map(({ evidenceSemanticDigest }) => evidenceSemanticDigest).sort(),
              paths: [],
              dataCapabilities: capabilities,
            },
            availability: { expiresAt: new Date(Date.now() + 14 * 86400000).toISOString(), revoked: false },
          });
          const payload = {
            ...success.result,
            schemaVersion: 2,
            protectedBaseSha: plan.protectedBaseSha,
            controllerSourceSha: plan.controller.sourceSha,
            disposition: lifecycle.disposition,
            heavyExecutionsRequired: lifecycle.heavyExecutionsRequired,
            evidenceManifest: fanInEvidence,
            stateDigest: success.state.stateDigest,
            stateArtifactName: `protected-verification-state-pr-${plan.prNumber}-${plan.candidateHeadSha}`,
            specialistStableTestIds: execution.specialist.stableTestIds,
            reviewGroupIds: execution.review.groupIds,
          };
          fs.writeFileSync('artifacts/controller/protected-hosted-fan-in.json', `${JSON.stringify(payload, null, 2)}\n`);
          fs.writeFileSync('artifacts/controller/protected-verification-state.json', `${JSON.stringify(success.state, null, 2)}\n`);
          NODE

      - name: Publish protected hosted fan-in evidence
        id: publish_fan_in
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-hosted-fan-in-${{ needs.preflight.outputs.protected_base_sha }}-${{ needs.preflight.outputs.candidate_head_sha }}
          path: |
            artifacts/controller/protected-hosted-fan-in.json
            artifacts/controller/protected-verification-state.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish exact-candidate verification lifecycle state
        id: publish_state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.preflight.outputs.state_artifact_name }}
          path: artifacts/controller/protected-verification-state.json
          if-no-files-found: error
          retention-days: 14

      - name: Classify fan-in workflow outcome
        if: always()
        id: failure
        shell: bash
        env:
          DOWNLOAD: ${{ steps.download.outcome }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          FENCE: ${{ steps.fence.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PUBLISH_FAN_IN: ${{ steps.publish_fan_in.outcome }}
          PUBLISH_STATE: ${{ steps.publish_state.outcome }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_FAN_IN" == failure || "$PUBLISH_STATE" == failure ]]; then
            printf 'failure_stage=FANIN\nfailure_code=FANIN_ARTIFACT_PUBLICATION_FAILED\nfailure_ownership=external\n' >> "$GITHUB_OUTPUT"
          elif [[ "$DOWNLOAD" == failure || "$CHECKOUT" == failure || "$FENCE" == failure || "$VALIDATE" == failure ]]; then
            printf 'failure_stage=FANIN\nfailure_code=FANIN_AUTHORITY_VALIDATION_FAILED\nfailure_ownership=authority\n' >> "$GITHUB_OUTPUT"
          fi

  failure-closeout:
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.bootstrap_active == 'true' &&
      (needs.preflight.outputs.disposition == 'BLOCKED' ||
       needs.preflight.outputs.disposition == 'REINTEGRATE' ||
       needs.reuse-evidence.result == 'failure' ||
       needs.environment-qualification.result == 'failure' ||
       needs.hosted-shards.result == 'failure' ||
       needs.fan-in.result == 'failure')
    needs: [preflight, reuse-evidence, environment-qualification, hosted-shards, fan-in]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      BUNDLE_NAME: ${{ needs.preflight.outputs.bundle_name }}
      CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.candidate_head_sha }}
      PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
      DISPOSITION: ${{ needs.preflight.outputs.disposition }}
      REUSE_RESULT: ${{ needs.reuse-evidence.result }}
      ENVIRONMENT_RESULT: ${{ needs.environment-qualification.result }}
      HOSTED_RESULT: ${{ needs.hosted-shards.result }}
      FAN_IN_RESULT: ${{ needs.fan-in.result }}
      ENVIRONMENT_STAGE: ${{ needs.environment-qualification.outputs.failure_stage }}
      ENVIRONMENT_CODE: ${{ needs.environment-qualification.outputs.failure_code }}
      ENVIRONMENT_OWNERSHIP: ${{ needs.environment-qualification.outputs.failure_ownership }}
      HOSTED_STAGE: ${{ needs.hosted-shards.outputs.failure_stage }}
      HOSTED_CODE: ${{ needs.hosted-shards.outputs.failure_code }}
      HOSTED_OWNERSHIP: ${{ needs.hosted-shards.outputs.failure_ownership }}
      FAN_IN_STAGE: ${{ needs.fan-in.outputs.failure_stage }}
      FAN_IN_CODE: ${{ needs.fan-in.outputs.failure_code }}
      FAN_IN_OWNERSHIP: ${{ needs.fan-in.outputs.failure_ownership }}
    steps:
      - name: Download exact failed lifecycle bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/controller
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BUNDLE_NAME" --dir artifacts/controller
          test -s artifacts/controller/protected-verification-plan.json
          test -s artifacts/controller/protected-hosted-execution.json
          test -s artifacts/controller/protected-verification-lifecycle.json

      - name: Check out exact protected controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.controller_source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: protected-control

      - name: Classify real workflow failure and persist executable progress state
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          current_pr=artifacts/controller/current-pr.json
          api_available=true
          if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$current_pr"; then
            api_available=false
            printf '{"head":{"sha":"%s"}}\n' "$CANDIDATE_HEAD_SHA" > "$current_pr"
          fi
          node --input-type=module - "$current_pr" "$api_available" <<'NODE'
          import fs from 'node:fs';
          import { buildProtectedVerificationState } from './protected-control/tools/verification/protected-verification-state.mjs';
          import {
            buildProtectedWorkflowFailureState,
          } from './protected-control/tools/verification/protected-verification-workflow.mjs';
          const [currentPrPath, apiAvailableValue] = process.argv.slice(2);
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const plan = read('artifacts/controller/protected-verification-plan.json');
          const execution = read('artifacts/controller/protected-hosted-execution.json');
          const lifecycle = read('artifacts/controller/protected-verification-lifecycle.json');
          const previousState = fs.existsSync('artifacts/controller/previous-protected-verification-state.json')
            ? read('artifacts/controller/previous-protected-verification-state.json') : null;
          const currentHeadSha = read(currentPrPath).head?.sha ?? plan.candidateHeadSha;
          const producer = {
            repository: process.env.GITHUB_REPOSITORY,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            workflowPath: '.github/workflows/protected-hosted-executor.yml',
            event: process.env.GITHUB_EVENT_NAME,
          };
          let state;
          if (lifecycle.disposition === 'BLOCKED') {
            if (!previousState) throw new Error('Blocked lifecycle has no durable prior state.');
            state = buildProtectedVerificationState({
              repository: plan.repository,
              prNumber: plan.prNumber,
              candidateHeadSha: plan.candidateHeadSha,
              plan,
              execution,
              lifecycle,
              progress: lifecycle.progress,
              evidenceManifests: previousState.evidenceManifests,
              evidenceArchive: previousState.evidenceArchive,
              environmentQualification: previousState.environmentQualification,
              producer,
            });
          } else {
            let stage = 'AUTHORITY_PREFLIGHT';
            let code = 'UNCLASSIFIED_PROTECTED_WORKFLOW_FAILURE';
            let sourceOwnership = 'authority';
            let integrationCompatible;
            if (apiAvailableValue !== 'true') {
              stage = 'AUTHORITY_PREFLIGHT'; code = 'GITHUB_PR_IDENTITY_API_UNAVAILABLE'; sourceOwnership = 'external';
            } else if (lifecycle.disposition === 'REINTEGRATE') {
              stage = 'BASE_COMPATIBILITY'; code = 'CANDIDATE_BASE_MERGE_CONFLICT'; sourceOwnership = 'candidate'; integrationCompatible = false;
            } else if (process.env.ENVIRONMENT_RESULT === 'failure') {
              stage = process.env.ENVIRONMENT_STAGE || 'ENVIRONMENT_QUALIFICATION';
              code = process.env.ENVIRONMENT_CODE || 'ENVIRONMENT_JOB_FAILED';
              sourceOwnership = process.env.ENVIRONMENT_OWNERSHIP || 'environment';
            } else if (process.env.HOSTED_RESULT === 'failure') {
              stage = process.env.HOSTED_STAGE || 'EXECUTING';
              code = process.env.HOSTED_CODE || 'HOSTED_JOB_FAILED';
              sourceOwnership = process.env.HOSTED_OWNERSHIP || 'candidate';
            } else if (process.env.REUSE_RESULT === 'failure') {
              stage = 'BASE_COMPATIBILITY'; code = 'EVIDENCE_REUSE_VALIDATION_FAILED'; sourceOwnership = 'authority';
            } else if (process.env.FAN_IN_RESULT === 'failure') {
              stage = process.env.FAN_IN_STAGE || 'FANIN';
              code = process.env.FAN_IN_CODE || 'FANIN_JOB_FAILED';
              sourceOwnership = process.env.FAN_IN_OWNERSHIP || 'authority';
            }
            state = buildProtectedWorkflowFailureState({
              currentPlan: plan,
              currentExecution: execution,
              lifecycle,
              previousState,
              stage,
              code,
              sourceOwnership,
              currentCandidateHeadSha: currentHeadSha,
              integrationCompatible,
              producer,
            });
          }
          fs.writeFileSync('artifacts/controller/protected-verification-state.json', `${JSON.stringify(state, null, 2)}\n`);
          fs.writeFileSync('artifacts/controller/failure-summary.json', `${JSON.stringify({
            schemaVersion: 1,
            candidateHeadSha: plan.candidateHeadSha,
            disposition: lifecycle.disposition,
            status: state.progress.status,
            failureClass: state.progress.failureClass ?? null,
            owner: state.progress.owner ?? null,
            candidateMutationAllowed: state.progress.candidateMutationAllowed ?? false,
            nextAttemptAllowed: state.progress.nextAttemptAllowed ?? false,
            circuitBreaker: state.progress.circuitBreaker ?? null,
          }, null, 2)}\n`);
          NODE

      - name: Publish failed or blocked exact-candidate lifecycle state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.preflight.outputs.state_artifact_name }}
          path: |
            artifacts/controller/protected-verification-state.json
            artifacts/controller/failure-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Stop protected execution after durable failure classification
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/controller/failure-summary.json >&2
          exit 1
