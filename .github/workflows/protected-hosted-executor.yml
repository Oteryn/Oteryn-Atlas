name: Protected Hosted Verification Executor

on:
  workflow_run:
    workflows: ["Protected Verification Controller"]
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: atlas-protected-hosted-pr-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request_target') ||
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      bootstrap_active: ${{ steps.controller.outputs.bootstrap_active }}
      controller_run_id: ${{ steps.controller.outputs.controller_run_id }}
      bundle_name: ${{ steps.contract.outputs.bundle_name }}
      candidate_head_sha: ${{ steps.contract.outputs.candidate_head_sha }}
      controller_source_sha: ${{ steps.contract.outputs.controller_source_sha }}
      pr_number: ${{ steps.contract.outputs.pr_number }}
      hosted_count: ${{ steps.contract.outputs.hosted_count }}
      specialist_count: ${{ steps.contract.outputs.specialist_count }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve authoritative protected controller run
        id: controller
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          PROTECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BOOTSTRAP_PR_NUMBER: ${{ github.event.pull_request.number }}
          BOOTSTRAP_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            [[ "$WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]]
            printf 'bootstrap_active=true\ncontroller_run_id=%s\n' "$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$EVENT_NAME" = pull_request
          [[ "$PROTECTED_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BOOTSTRAP_CANDIDATE_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BOOTSTRAP_PR_NUMBER" =~ ^[0-9]+$ ]]
          set +e
          base_probe="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/protected-hosted-executor.yml?ref=$PROTECTED_BASE_SHA" 2>&1)"
          base_probe_rc=$?
          set -e
          if (( base_probe_rc == 0 )); then
            printf 'bootstrap_active=false\ncontroller_run_id=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -Eq 'HTTP 404|Not Found' <<<"$base_probe"
          runs_json="$RUNNER_TEMP/protected-controller-runs.json"
          controller_run_id=''
          for attempt in {1..30}; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/protected-verification-controller.yml/runs?event=pull_request_target&per_page=100" > "$runs_json"
            controller_run_id="$(node --input-type=module - "$runs_json" "$BOOTSTRAP_PR_NUMBER" "$BOOTSTRAP_CANDIDATE_HEAD_SHA" "$PROTECTED_BASE_SHA" <<'NODE'
          import fs from 'node:fs';
          const [runsPath, prValue, candidateHeadSha, protectedBaseSha] = process.argv.slice(2);
          const prNumber = Number(prValue);
          const matches = (JSON.parse(fs.readFileSync(runsPath, 'utf8')).workflow_runs ?? [])
            .filter((run) => run.event === 'pull_request_target'
              && run.status === 'completed' && run.conclusion === 'success'
              && run.head_sha === candidateHeadSha
              && (run.pull_requests ?? []).some((pr) => Number(pr.number) === prNumber && pr.base?.sha === protectedBaseSha))
            .sort((a, b) => Number(b.id) - Number(a.id));
          if (matches.length) process.stdout.write(String(matches[0].id));
          NODE
            )"
            [[ -n "$controller_run_id" ]] && break
            (( attempt < 30 )) && sleep 10
          done
          [[ "$controller_run_id" =~ ^[0-9]+$ ]]
          printf 'bootstrap_active=true\ncontroller_run_id=%s\n' "$controller_run_id" >> "$GITHUB_OUTPUT"

      - name: Download the unique protected-verification-plan artifact
        if: steps.controller.outputs.bootstrap_active == 'true'
        shell: bash
        env:
          CONTROLLER_RUN_ID: ${{ steps.controller.outputs.controller_run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/controller
          mapfile -t names < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROLLER_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("protected-verification-plan-"))) | .name')
          test "${#names[@]}" -eq 1
          gh run download "$CONTROLLER_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "${names[0]}" --dir artifacts/controller
          test -s artifacts/controller/protected-verification-plan.json

      - name: Resolve protected controller and candidate identities
        if: steps.controller.outputs.bootstrap_active == 'true'
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - artifacts/controller/protected-verification-plan.json "$GITHUB_OUTPUT" <<'NODE'
          import fs from 'node:fs';
          const [planPath, outputPath] = process.argv.slice(2);
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          if (plan.schemaVersion !== 3 || plan.controller?.id !== 'atlas-protected-hosted-controller-v3' || plan.controller?.version !== 3) {
            throw new Error('Protected hosted plan controller identity is invalid.');
          }
          for (const [name, value] of [['controller_source_sha', plan.controller.sourceSha], ['candidate_head_sha', plan.candidateHeadSha]]) {
            if (!/^[a-f0-9]{40}$/.test(value)) throw new Error(`${name} is not an exact SHA.`);
            fs.appendFileSync(outputPath, `${name}=${value}\n`);
          }
          for (const field of ['planSemanticDigest', 'planInstanceDigest', 'authorityDigest', 'environmentDigest']) {
            if (!/^sha256:[a-f0-9]{64}$/.test(plan[field])) throw new Error(`${field} is invalid.`);
          }
          if (!Number.isSafeInteger(plan.prNumber) || plan.prNumber < 1) throw new Error('Protected hosted plan PR number is invalid.');
          fs.appendFileSync(outputPath, `pr_number=${plan.prNumber}\n`);
          NODE

      - name: Check out exact protected controller source
        if: steps.controller.outputs.bootstrap_active == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.controller_source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: protected-control

      - name: Reject superseded head before expensive execution
        if: steps.controller.outputs.bootstrap_active == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
          CANDIDATE_HEAD_SHA: ${{ steps.identity.outputs.candidate_head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > artifacts/controller/current-pr.json
          node protected-control/tools/verification/assert-current-pr-head.mjs \
            --payload artifacts/controller/current-pr.json --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" --expected-head-sha "$CANDIDATE_HEAD_SHA"

      - name: Derive immutable hosted execution contract from protected plan
        if: steps.controller.outputs.bootstrap_active == 'true'
        id: contract
        shell: bash
        env:
          CURRENT_HEAD_SHA: ${{ steps.identity.outputs.candidate_head_sha }}
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
        run: |
          set -euo pipefail
          node --input-type=module - artifacts/controller/protected-verification-plan.json artifacts/controller/protected-hosted-execution.json "$GITHUB_OUTPUT" <<'NODE'
          import fs from 'node:fs';
          import { buildProtectedHostedExecutionContract } from './protected-control/tools/verification/protected-hosted-execution.mjs';
          const [planPath, outputPath, githubOutput] = process.argv.slice(2);
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const contract = buildProtectedHostedExecutionContract(plan, { currentHeadSha: process.env.CURRENT_HEAD_SHA });
          fs.writeFileSync(outputPath, `${JSON.stringify(contract, null, 2)}\n`);
          const bundleName = `protected-hosted-execution-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          for (const [name, value] of [
            ['bundle_name', bundleName], ['candidate_head_sha', contract.candidateHeadSha],
            ['controller_source_sha', contract.controllerSourceSha], ['pr_number', process.env.PR_NUMBER],
            ['hosted_count', contract.hosted.stableTestIds.length], ['specialist_count', contract.specialist.stableTestIds.length],
          ]) fs.appendFileSync(githubOutput, `${name}=${value}\n`);
          NODE

      - name: Publish protected execution contract
        if: steps.controller.outputs.bootstrap_active == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.contract.outputs.bundle_name }}
          path: |
            artifacts/controller/protected-verification-plan.json
            artifacts/controller/protected-hosted-execution.json
            artifacts/controller/product-identities.json
            artifacts/controller/verification-authority-identity.json
            artifacts/controller/protected-execution-environment-identity.json
          if-no-files-found: error
          retention-days: 14

  environment-qualification:
    if: needs.preflight.outputs.bootstrap_active == 'true' && needs.preflight.outputs.hosted_count != '0'
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.candidate_head_sha }}
      CONTROLLER_RUN_ID: ${{ needs.preflight.outputs.controller_run_id }}
      PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
      BUNDLE_NAME: ${{ needs.preflight.outputs.bundle_name }}
      ATLAS_CANDIDATE_IMAGE: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    steps:
      - name: Download protected plan and execution contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/controller artifacts/environment
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BUNDLE_NAME" --dir artifacts/controller
          test -s artifacts/controller/protected-verification-plan.json
          test -s artifacts/controller/protected-hosted-execution.json

      - name: Check out exact protected controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.controller_source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: protected-control

      - name: Fence exact head and materialize protected dependencies
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > artifacts/controller/current-pr.json
          node protected-control/tools/verification/assert-current-pr-head.mjs \
            --payload artifacts/controller/current-pr.json --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" --expected-head-sha "$CANDIDATE_HEAD_SHA"
          npm ci --prefix protected-control/e2e --ignore-scripts --no-audit --no-fund
          git -C protected-control fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git -C protected-control rev-parse FETCH_HEAD)" = "$CANDIDATE_HEAD_SHA"
          candidate_dir="$RUNNER_TEMP/atlas-environment-candidate-$GITHUB_RUN_ID"
          git -C protected-control worktree add --detach "$candidate_dir" "$CANDIDATE_HEAD_SHA"
          test ! -e "$candidate_dir/e2e/node_modules"
          ln -s /protected-e2e-node-modules/node_modules "$candidate_dir/e2e/node_modules"
          printf '%s\n' "$candidate_dir" > artifacts/environment/candidate-dir.txt

      - name: Qualify exact protected environment once
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="$(cat artifacts/environment/candidate-dir.txt)"
          timeout --signal=KILL 180s docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 192 \
            --memory 1536m \
            --cpus 2 \
            --user 1000:1000 \
            --shm-size 1g \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --env "ATLAS_PROTECTED_CONTAINER_IMAGE=$ATLAS_CANDIDATE_IMAGE" \
            --env HOME=/tmp/home \
            --mount "type=bind,src=$candidate_dir,dst=/candidate,readonly" \
            --mount "type=bind,src=$PWD/protected-control,dst=/protected-control,readonly" \
            --mount "type=bind,src=$PWD/protected-control/e2e/node_modules,dst=/protected-e2e-node-modules/node_modules,readonly" \
            --mount "type=bind,src=$PWD/artifacts/environment,dst=/tmp/artifacts" \
            "$ATLAS_CANDIDATE_IMAGE" \
            bash -lc 'set -euo pipefail
              mkdir -p /tmp/home /tmp/atlas-python-bin /tmp/atlas-python-pycache /tmp/artifacts
              ln -s /usr/bin/python3 /tmp/atlas-python-bin/python
              export PATH="/tmp/atlas-python-bin:$PATH"
              export PYTHONPYCACHEPREFIX=/tmp/atlas-python-pycache
              cd /protected-control
              node tools/verification/protected-execution-environment-probe.mjs \
                --config tools/verification/protected-execution-environment.json \
                --output /tmp/artifacts/protected-environment-qualification.json'
          test -s artifacts/environment/protected-environment-qualification.json

      - name: Bind environment qualification into dependency evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildEvidenceManifest } from './protected-control/tools/verification/evidence-manifest.mjs';
          import { validateProtectedExecutionEnvironmentQualification } from './protected-control/tools/verification/protected-execution-environment.mjs';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const plan = read('artifacts/controller/protected-verification-plan.json');
          const qualification = validateProtectedExecutionEnvironmentQualification(
            read('artifacts/environment/protected-environment-qualification.json'), plan.environmentIdentity,
          );
          const manifest = buildEvidenceManifest({
            evidenceId: 'ENVIRONMENT_QUALIFICATION', evidenceType: 'ENVIRONMENT_QUALIFICATION',
            result: 'SUCCESS', disposition: 'EXECUTED', candidateHeadSha: plan.candidateHeadSha,
            planSemanticDigest: plan.planSemanticDigest, planInstanceDigest: plan.planInstanceDigest,
            authorityDigest: plan.authorityDigest, environmentDigest: plan.environmentDigest,
            productIdentities: {}, stableTestIds: [], executionPolicyDigest: plan.executionPolicyDigest,
            runProvenance: {
              repository: process.env.GITHUB_REPOSITORY, runId: Number(process.env.GITHUB_RUN_ID),
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobName: 'environment-qualification',
              artifactName: `protected-environment-qualification-${process.env.CONTROLLER_RUN_ID}-${plan.candidateHeadSha}`,
            },
            dependencies: {
              evidenceDigests: [],
              paths: ['tools/verification/protected-execution-environment-probe.mjs', 'tools/verification/protected-execution-environment.json'],
              dataCapabilities: [],
            },
            availability: { expiresAt: new Date(Date.now() + 14 * 86400000).toISOString(), revoked: false },
          });
          fs.writeFileSync('artifacts/environment/protected-environment-qualification.json', `${JSON.stringify(qualification, null, 2)}\n`);
          fs.writeFileSync('artifacts/environment/environment-evidence-manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Publish protected environment qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-environment-qualification-${{ needs.preflight.outputs.controller_run_id }}-${{ needs.preflight.outputs.candidate_head_sha }}
          path: |
            artifacts/environment/protected-environment-qualification.json
            artifacts/environment/environment-evidence-manifest.json
          if-no-files-found: error
          retention-days: 14

  hosted-shards:
    if: needs.preflight.outputs.bootstrap_active == 'true' && needs.preflight.outputs.hosted_count != '0'
    needs: [preflight, environment-qualification]
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            index: 0
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.candidate_head_sha }}
      CONTROLLER_RUN_ID: ${{ needs.preflight.outputs.controller_run_id }}
      PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
      BUNDLE_NAME: ${{ needs.preflight.outputs.bundle_name }}
      ATLAS_E2E_WORKERS: '1'
      ATLAS_E2E_SHARD: ${{ matrix.shard }}/1
    steps:
      - name: Download protected execution and environment contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/controller artifacts/environment
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BUNDLE_NAME" --dir artifacts/controller
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "protected-environment-qualification-$CONTROLLER_RUN_ID-$CANDIDATE_HEAD_SHA" --dir artifacts/environment
          test -s artifacts/controller/protected-verification-plan.json
          test -s artifacts/controller/protected-hosted-execution.json
          test -s artifacts/environment/protected-environment-qualification.json
          test -s artifacts/environment/environment-evidence-manifest.json

      - name: Check out exact protected controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.controller_source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: protected-control

      - name: Validate environment dependency and fence current head
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > artifacts/controller/current-pr.json
          node protected-control/tools/verification/assert-current-pr-head.mjs \
            --payload artifacts/controller/current-pr.json --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" --expected-head-sha "$CANDIDATE_HEAD_SHA"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateEvidenceManifest } from './protected-control/tools/verification/evidence-manifest.mjs';
          import { validateProtectedExecutionEnvironmentQualification } from './protected-control/tools/verification/protected-execution-environment.mjs';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const plan = read('artifacts/controller/protected-verification-plan.json');
          validateProtectedExecutionEnvironmentQualification(read('artifacts/environment/protected-environment-qualification.json'), plan.environmentIdentity);
          const evidence = validateEvidenceManifest(read('artifacts/environment/environment-evidence-manifest.json'));
          if (evidence.evidenceId !== 'ENVIRONMENT_QUALIFICATION' || evidence.result !== 'SUCCESS'
            || evidence.candidateHeadSha !== plan.candidateHeadSha
            || evidence.planSemanticDigest !== plan.planSemanticDigest || evidence.planInstanceDigest !== plan.planInstanceDigest
            || evidence.authorityDigest !== plan.authorityDigest || evidence.environmentDigest !== plan.environmentDigest) {
            throw new Error('Environment evidence identity mismatch.');
          }
          NODE

      - name: Materialize exact candidate and enumerate capability source lists
        shell: bash
        run: |
          set -euo pipefail
          git -C protected-control fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git -C protected-control rev-parse FETCH_HEAD)" = "$CANDIDATE_HEAD_SHA"
          candidate_dir="$RUNNER_TEMP/atlas-candidate-$GITHUB_RUN_ID-${{ matrix.shard }}"
          git -C protected-control worktree add --detach "$candidate_dir" "$CANDIDATE_HEAD_SHA"
          printf '%s\n' "$candidate_dir" > artifacts/controller/candidate-dir.txt
          execution=artifacts/controller/protected-hosted-execution.json
          npm ci --prefix protected-control/e2e --ignore-scripts --no-audit --no-fund
          (cd protected-control && ATLAS_ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts/controller/protected-playwright-list" \
            npm exec --prefix e2e -- playwright test --config=e2e/playwright.config.mjs --list) \
            > artifacts/controller/protected-playwright-source-list.txt
          test ! -e "$candidate_dir/e2e/node_modules"
          ln -s /protected-e2e-node-modules/node_modules "$candidate_dir/e2e/node_modules"
          timeout --signal=KILL 120s docker run --rm \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 192 --memory 1536m --cpus 2 --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount "type=bind,src=$candidate_dir,dst=/candidate,readonly" \
            --mount "type=bind,src=$PWD/protected-control/e2e/node_modules,dst=/protected-e2e-node-modules/node_modules,readonly" \
            mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07 \
            bash -lc 'cd /candidate && CI=1 ATLAS_ARTIFACTS_DIR=/tmp/artifacts /candidate/e2e/node_modules/.bin/playwright test --config=/candidate/e2e/playwright.config.mjs --list' \
            > artifacts/controller/candidate-playwright-source-list.txt
          ! jq -e '.hosted.partitions[]? | select(.dataCapability == "real_fullworld")' "$execution" >/dev/null
          jq -e '[.hosted.partitions[]?.dataCapability] | all(. == "qualification_fixture" or . == "bounded_real_world")' "$execution" >/dev/null
          mkdir -p artifacts/controller/test-lists
          mapfile -t capabilities < <(jq -r '.hosted.partitions[] | select((.stableTestIds | length) > 0) | .dataCapability' "$execution" | sort -u)
          test "${#capabilities[@]}" -gt 0
          for dataCapability in "${capabilities[@]}"; do
            mkdir -p "artifacts/controller/test-lists/$dataCapability"
            node protected-control/tools/verification/protected-playwright-selection.mjs \
              --list artifacts/controller/protected-playwright-source-list.txt --execution "$execution" \
              --placement protected --data-capability "$dataCapability" \
              > "artifacts/controller/test-lists/$dataCapability/protected.txt"
            node protected-control/tools/verification/protected-playwright-selection.mjs \
              --list artifacts/controller/candidate-playwright-source-list.txt --execution "$execution" \
              --placement candidate-additions --data-capability "$dataCapability" \
              > "artifacts/controller/test-lists/$dataCapability/candidate-additions.txt"
            node protected-control/tools/verification/protected-playwright-selection.mjs \
              --list artifacts/controller/candidate-playwright-source-list.txt --execution "$execution" \
              --placement candidate-modifications --data-capability "$dataCapability" \
              > "artifacts/controller/test-lists/$dataCapability/candidate-modifications.txt"
          done

      - name: Build exact protected products required by hosted partitions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - artifacts/controller/protected-verification-plan.json artifacts/controller/protected-hosted-execution.json artifacts/controller/hosted-products.json <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { buildQualificationWorld, qualificationTrustDescriptor, verifyQualificationWorld } from './protected-control/tools/verification/qualification-world.mjs';
          const [planPath, executionPath, outputPath] = process.argv.slice(2);
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const execution = JSON.parse(fs.readFileSync(executionPath, 'utf8'));
          const capabilities = [...new Set(execution.hosted.partitions.filter((p) => p.stableTestIds.length).map((p) => p.dataCapability))].sort();
          if (capabilities.includes('real_fullworld') || capabilities.some((value) => !['qualification_fixture', 'bounded_real_world'].includes(value))) throw new Error('unsupported hosted data capability');
          const products = {};
          const trustDir = path.join('artifacts', 'controller', 'product-trust');
          fs.mkdirSync(trustDir, { recursive: true });
          if (capabilities.includes('qualification_fixture')) {
            const destination = path.join(process.env.RUNNER_TEMP, `atlas-qualification-${process.env.GITHUB_RUN_ID}-${process.env.ATLAS_E2E_SHARD.replace('/', '-')}`);
            fs.rmSync(destination, { recursive: true, force: true });
            await buildQualificationWorld(destination);
            const manifest = await verifyQualificationWorld(destination);
            const expected = plan.productIdentities.qualification_fixture;
            if (!expected || expected.id !== manifest.fixtureId || expected.digest !== manifest.productDigest) throw new Error('Qualification fixture identity does not match protected plan.');
            const trustPath = path.join(trustDir, 'qualification_fixture.json');
            fs.writeFileSync(trustPath, `${JSON.stringify(qualificationTrustDescriptor(manifest))}\n`);
            products.qualification_fixture = { root: destination, trustPath: path.resolve(trustPath) };
          }
          if (capabilities.includes('bounded_real_world')) {
            const registry = JSON.parse(fs.readFileSync('./protected-control/tools/verification/protected-hosted-product-identities.json', 'utf8'));
            const expected = plan.productIdentities.bounded_real_world;
            if (!expected || expected.id !== registry.bounded_real_world?.id || expected.digest !== registry.bounded_real_world?.digest) throw new Error('bounded_real_world protected plan identity does not match protected registry');
            const { buildBoundedRealWorld, verifyBoundedRealWorld, boundedRealTrustDescriptor } = await import('./protected-control/tools/verification/bounded-real-world.mjs');
            const destination = path.join(process.env.RUNNER_TEMP, `atlas-bounded-real-${process.env.GITHUB_RUN_ID}-${process.env.ATLAS_E2E_SHARD.replace('/', '-')}`);
            fs.rmSync(destination, { recursive: true, force: true });
            const built = await buildBoundedRealWorld(destination, { sourceRoot: './protected-control' });
            const verified = await verifyBoundedRealWorld(destination);
            if (built.productDigest !== expected.digest || verified.productDigest !== expected.digest) throw new Error('bounded_real_world product identity does not match protected plan');
            const trustPath = path.join(trustDir, 'bounded_real_world.json');
            fs.writeFileSync(trustPath, `${JSON.stringify(boundedRealTrustDescriptor(verified))}\n`);
            products.bounded_real_world = { root: destination, trustPath: path.resolve(trustPath) };
          }
          fs.writeFileSync(outputPath, `${JSON.stringify(products, null, 2)}\n`);
          NODE

      - name: Build separate protected-body and candidate execution contexts
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="$(cat artifacts/controller/candidate-dir.txt)"
          protected_context="$RUNNER_TEMP/protected-execution-context-$GITHUB_RUN_ID-${{ matrix.shard }}"
          candidate_context="$RUNNER_TEMP/candidate-additions-execution-context-$GITHUB_RUN_ID-${{ matrix.shard }}"
          rm -rf "$protected_context" "$candidate_context"
          mkdir -p "$protected_context" "$candidate_context"
          rsync -a --delete --exclude='.git' "$candidate_dir/" "$protected_context/"
          for path in web src; do test -d "$protected_context/$path"; test ! -L "$protected_context/$path"; done
          rm -rf "$protected_context/e2e"
          cp -a protected-control/e2e "$protected_context/e2e"
          rm -rf "$protected_context/e2e/node_modules"
          rm -f "$protected_context/.dockerignore" "$protected_context/e2e/Dockerfile.dockerignore"
          mkdir -p "$protected_context/tools/verification"
          cp protected-control/tools/verification/stable-id.mjs "$protected_context/tools/verification/stable-id.mjs"
          rsync -a --delete --exclude='.git' "$candidate_dir/" "$candidate_context/"
          for path in e2e e2e/tests web src; do test -d "$candidate_context/$path"; test ! -L "$candidate_context/$path"; done
          rm -rf "$candidate_context/e2e/node_modules"
          rm -f "$candidate_context/.dockerignore" "$candidate_context/e2e/Dockerfile.dockerignore"
          cp protected-control/e2e/Dockerfile "$candidate_context/e2e/Dockerfile"
          cp protected-control/e2e/package.json protected-control/e2e/package-lock.json "$candidate_context/e2e/"
          cp protected-control/e2e/playwright.config.mjs protected-control/e2e/summary-reporter.mjs "$candidate_context/e2e/"
          mkdir -p "$candidate_context/tools/verification"
          cp protected-control/tools/verification/stable-id.mjs "$candidate_context/tools/verification/stable-id.mjs"
          printf '%s\n' "$protected_context" > artifacts/controller/protected-execution-context.txt
          printf '%s\n' "$candidate_context" > artifacts/controller/candidate-additions-execution-context.txt

      - name: Run each hosted data-capability partition against only its exact product
        shell: bash
        run: |
          set -euo pipefail
          protected_context="$(cat artifacts/controller/protected-execution-context.txt)"
          candidate_context="$(cat artifacts/controller/candidate-additions-execution-context.txt)"
          execution=artifacts/controller/protected-hosted-execution.json
          products=artifacts/controller/hosted-products.json
          shard_root="$PWD/artifacts/hosted-shard-${{ matrix.shard }}"
          source_manifest="$shard_root/source-manifest.json"
          mkdir -p "$shard_root/sources"
          printf '[]\n' > "$source_manifest"
          export ATLAS_CODE_REVISION="$CANDIDATE_HEAD_SHA"
          export ATLAS_PLAN_SEMANTIC_DIGEST="$(jq -r .planSemanticDigest artifacts/controller/protected-verification-plan.json)"
          export ATLAS_PLAN_INSTANCE_DIGEST="$(jq -r .planInstanceDigest artifacts/controller/protected-verification-plan.json)"
          export ATLAS_AUTHORITY_DIGEST="$(jq -r .authorityDigest artifacts/controller/protected-verification-plan.json)"
          export ATLAS_ENVIRONMENT_DIGEST="$(jq -r .environmentDigest artifacts/controller/protected-verification-plan.json)"
          export ATLAS_E2E_SHARD='1/1'
          compose_down() { docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml down -v --remove-orphans >/dev/null 2>&1 || true; }
          trap compose_down EXIT
          append_source() {
            local placement="$1" dataCapability="$2" summaryPath="$3" tmp
            tmp="$(mktemp)"
            jq --arg placement "$placement" --arg dataCapability "$dataCapability" --arg summaryPath "$summaryPath" \
              '. + [{placement: $placement, dataCapability: $dataCapability, summaryPath: $summaryPath}]' "$source_manifest" > "$tmp"
            mv "$tmp" "$source_manifest"
          }
          mapfile -t capabilities < <(jq -r '.hosted.partitions[] | select((.stableTestIds | length) > 0) | .dataCapability' "$execution" | sort -u)
          for dataCapability in "${capabilities[@]}"; do
            case "$dataCapability" in qualification_fixture|bounded_real_world) ;; *) exit 1 ;; esac
            product_root="$(jq -r --arg capability "$dataCapability" '.[$capability].root // empty' "$products")"
            trust_path="$(jq -r --arg capability "$dataCapability" '.[$capability].trustPath // empty' "$products")"
            test -d "$product_root"; test -s "$trust_path"
            protected_list="$PWD/artifacts/controller/test-lists/$dataCapability/protected.txt"
            candidate_list="$PWD/artifacts/controller/test-lists/$dataCapability/candidate-additions.txt"
            modification_list="$PWD/artifacts/controller/test-lists/$dataCapability/candidate-modifications.txt"
            test -f "$protected_list"; test -f "$candidate_list"; test -f "$modification_list"
            [[ -s "$protected_list" || -s "$candidate_list" || -s "$modification_list" ]]
            export COMPOSE_PROJECT_NAME="atlas-protected-${GITHUB_RUN_ID}-${{ matrix.shard }}-${dataCapability//_/-}"
            export ATLAS_QUALIFICATION_PUBLICATION_HOST="$product_root"
            export ATLAS_QUALIFICATION_TRUST_JSON="$(jq -c . "$trust_path")"
            export ATLAS_EXECUTION_CONTEXT="$protected_context" ATLAS_PROTECTED_TEST_LIST="$protected_list"
            export ATLAS_E2E_ARTIFACTS_HOST="$shard_root/sources/protected/$dataCapability"
            mkdir -p "$ATLAS_E2E_ARTIFACTS_HOST"
            compose_down
            docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml up -d --wait atlas-publication atlas-web
            if [[ -s "$protected_list" ]]; then
              export ATLAS_EXECUTION_CONTEXT="$protected_context" ATLAS_PROTECTED_TEST_LIST="$protected_list" ATLAS_E2E_ARTIFACTS_HOST="$shard_root/sources/protected/$dataCapability"
              mkdir -p "$ATLAS_E2E_ARTIFACTS_HOST"
              docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml build e2e
              docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml run --rm e2e
              append_source protected "$dataCapability" "$ATLAS_E2E_ARTIFACTS_HOST/summary.json"
            fi
            if [[ -s "$modification_list" ]]; then
              export ATLAS_EXECUTION_CONTEXT="$candidate_context" ATLAS_PROTECTED_TEST_LIST="$modification_list" ATLAS_E2E_ARTIFACTS_HOST="$shard_root/sources/candidate-modifications/$dataCapability"
              mkdir -p "$ATLAS_E2E_ARTIFACTS_HOST"
              docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml build e2e
              docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml run --rm e2e
              append_source candidate-modifications "$dataCapability" "$ATLAS_E2E_ARTIFACTS_HOST/summary.json"
            fi
            if [[ -s "$candidate_list" ]]; then
              export ATLAS_EXECUTION_CONTEXT="$candidate_context" ATLAS_PROTECTED_TEST_LIST="$candidate_list" ATLAS_E2E_ARTIFACTS_HOST="$shard_root/sources/candidate-additions/$dataCapability"
              mkdir -p "$ATLAS_E2E_ARTIFACTS_HOST"
              docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml build e2e
              docker compose -f protected-control/e2e/compose.protected-hosted-executor.yml -f protected-control/e2e/compose.github-hosted.yml run --rm e2e
              append_source candidate-additions "$dataCapability" "$ATLAS_E2E_ARTIFACTS_HOST/summary.json"
            fi
            compose_down
          done

      - name: Convert shard result into protected machine evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node protected-control/tools/verification/protected-hosted-shard-summary.mjs \
            --plan artifacts/controller/protected-verification-plan.json \
            --execution artifacts/controller/protected-hosted-execution.json \
            --source-manifest artifacts/hosted-shard-${{ matrix.shard }}/source-manifest.json \
            --shard-index ${{ matrix.index }} --shard-count 1 \
            > artifacts/hosted-shard-${{ matrix.shard }}/protected-shard-summary.json

      - name: Build dependency-bound hosted shard manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildEvidenceManifest } from './protected-control/tools/verification/evidence-manifest.mjs';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const plan = read('artifacts/controller/protected-verification-plan.json');
          const execution = read('artifacts/controller/protected-hosted-execution.json');
          const summary = read('artifacts/hosted-shard-${{ matrix.shard }}/protected-shard-summary.json');
          const environment = read('artifacts/environment/environment-evidence-manifest.json');
          const capabilities = [...new Set(execution.hosted.partitions.map(({ dataCapability }) => dataCapability))].sort();
          const products = Object.fromEntries(capabilities.map((capability) => [capability, plan.productIdentities[capability]]));
          const manifest = buildEvidenceManifest({
            evidenceId: 'HOSTED_FUNCTIONAL:SHARD_${{ matrix.shard }}', evidenceType: 'HOSTED_FUNCTIONAL',
            result: 'SUCCESS', disposition: 'EXECUTED', candidateHeadSha: plan.candidateHeadSha,
            planSemanticDigest: plan.planSemanticDigest, planInstanceDigest: plan.planInstanceDigest,
            authorityDigest: plan.authorityDigest, environmentDigest: plan.environmentDigest,
            productIdentities: products, stableTestIds: summary.executedStableTestIds,
            executionPolicyDigest: plan.executionPolicyDigest,
            runProvenance: {
              repository: process.env.GITHUB_REPOSITORY, runId: Number(process.env.GITHUB_RUN_ID),
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobName: 'hosted-shards',
              artifactName: `protected-hosted-shard-${process.env.CONTROLLER_RUN_ID}-${{ matrix.shard }}`,
            },
            dependencies: { evidenceDigests: [environment.evidenceDigest], paths: [], dataCapabilities: capabilities },
            availability: { expiresAt: new Date(Date.now() + 14 * 86400000).toISOString(), revoked: false },
          });
          fs.writeFileSync('artifacts/hosted-shard-${{ matrix.shard }}/protected-shard-evidence.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Publish protected shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-hosted-shard-${{ needs.preflight.outputs.controller_run_id }}-${{ matrix.shard }}
          path: |
            artifacts/hosted-shard-${{ matrix.shard }}/protected-shard-summary.json
            artifacts/hosted-shard-${{ matrix.shard }}/protected-shard-evidence.json
          if-no-files-found: error
          retention-days: 14

  fan-in:
    if: always() && needs.preflight.result == 'success' && needs.environment-qualification.result == 'success' && needs.hosted-shards.result == 'success' && needs.preflight.outputs.bootstrap_active == 'true' && needs.preflight.outputs.hosted_count != '0'
    needs: [preflight, environment-qualification, hosted-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.candidate_head_sha }}
      CONTROLLER_RUN_ID: ${{ needs.preflight.outputs.controller_run_id }}
      PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
      BUNDLE_NAME: ${{ needs.preflight.outputs.bundle_name }}
    steps:
      - name: Download protected plan and all dependency evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/controller artifacts/environment artifacts/shards
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BUNDLE_NAME" --dir artifacts/controller
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "protected-environment-qualification-$CONTROLLER_RUN_ID-$CANDIDATE_HEAD_SHA" --dir artifacts/environment
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'protected-hosted-shard-*' --dir artifacts/shards
          test "$(find artifacts/shards -name protected-shard-summary.json -type f | wc -l)" -eq 1
          test "$(find artifacts/shards -name protected-shard-evidence.json -type f | wc -l)" -eq 1

      - name: Check out exact protected controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.controller_source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: protected-control

      - name: Reject stale head before evidence acceptance
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > artifacts/controller/current-pr.json
          node protected-control/tools/verification/assert-current-pr-head.mjs \
            --payload artifacts/controller/current-pr.json --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" --expected-head-sha "$CANDIDATE_HEAD_SHA"

      - name: Require exact dependency-bound sibling fan-in
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { buildEvidenceManifest, validateEvidenceManifest, validateEvidenceStableIdUnion } from './protected-control/tools/verification/evidence-manifest.mjs';
          import { validateProtectedHostedFanIn } from './protected-control/tools/verification/protected-hosted-fan-in.mjs';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const plan = read('artifacts/controller/protected-verification-plan.json');
          const execution = read('artifacts/controller/protected-hosted-execution.json');
          const environment = validateEvidenceManifest(read('artifacts/environment/environment-evidence-manifest.json'));
          const summaryFiles = [];
          const evidenceFiles = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name === 'protected-shard-summary.json') summaryFiles.push(full);
              else if (entry.name === 'protected-shard-evidence.json') evidenceFiles.push(full);
            }
          };
          walk('artifacts/shards');
          const summaries = summaryFiles.sort().map(read);
          const manifests = evidenceFiles.sort().map((file) => validateEvidenceManifest(read(file)));
          const result = validateProtectedHostedFanIn(plan, summaries, {
            currentHeadSha: process.env.CANDIDATE_HEAD_SHA,
            expectedStableTestIds: execution.hosted.stableTestIds,
            expectedStableTestIdsDigest: execution.hostedExpectedStableTestIdsDigest,
          });
          validateEvidenceStableIdUnion(execution.hosted.stableTestIds, manifests);
          for (const manifest of manifests) {
            if (manifest.result !== 'SUCCESS' || manifest.candidateHeadSha !== plan.candidateHeadSha
              || manifest.planSemanticDigest !== plan.planSemanticDigest || manifest.planInstanceDigest !== plan.planInstanceDigest
              || manifest.authorityDigest !== plan.authorityDigest || manifest.environmentDigest !== plan.environmentDigest
              || !manifest.dependencies.evidenceDigests.includes(environment.evidenceDigest)) throw new Error('Hosted evidence dependency identity mismatch.');
          }
          const capabilities = [...new Set(execution.hosted.partitions.map(({ dataCapability }) => dataCapability))].sort();
          const products = Object.fromEntries(capabilities.map((capability) => [capability, plan.productIdentities[capability]]));
          const fanInEvidence = buildEvidenceManifest({
            evidenceId: 'FANIN:HOSTED', evidenceType: 'FANIN', result: 'SUCCESS', disposition: 'EXECUTED',
            candidateHeadSha: plan.candidateHeadSha, planSemanticDigest: plan.planSemanticDigest,
            planInstanceDigest: plan.planInstanceDigest, authorityDigest: plan.authorityDigest,
            environmentDigest: plan.environmentDigest, productIdentities: products,
            stableTestIds: execution.hosted.stableTestIds, executionPolicyDigest: plan.executionPolicyDigest,
            runProvenance: {
              repository: process.env.GITHUB_REPOSITORY, runId: Number(process.env.GITHUB_RUN_ID),
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobName: 'fan-in',
              artifactName: `protected-hosted-fan-in-${process.env.CONTROLLER_RUN_ID}-${plan.candidateHeadSha}`,
            },
            dependencies: {
              evidenceDigests: [environment.evidenceDigest, ...manifests.map(({ evidenceDigest }) => evidenceDigest)].sort(),
              paths: [], dataCapabilities: capabilities,
            },
            availability: { expiresAt: new Date(Date.now() + 14 * 86400000).toISOString(), revoked: false },
          });
          fs.writeFileSync('artifacts/controller/protected-hosted-fan-in.json', `${JSON.stringify({
            ...result,
            controllerSourceSha: plan.controller.sourceSha,
            evidenceScope: 'hosted-placement',
            specialistStableTestIds: execution.specialist.stableTestIds,
            reviewGroupIds: execution.review.groupIds,
            evidenceManifest: fanInEvidence,
          }, null, 2)}\n`);
          NODE

      - name: Publish protected hosted fan-in evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-hosted-fan-in-${{ needs.preflight.outputs.controller_run_id }}-${{ needs.preflight.outputs.candidate_head_sha }}
          path: artifacts/controller/protected-hosted-fan-in.json
          if-no-files-found: error
          retention-days: 14
