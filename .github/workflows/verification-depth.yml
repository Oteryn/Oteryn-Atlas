name: Verification Nightly Depth

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-verification-nightly-depth
  cancel-in-progress: false

jobs:
  deterministic-depth:
    name: Deterministic contracts and controlled mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact scheduled main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact scheduled revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" = schedule ]]; then test "$GITHUB_REF" = 'refs/heads/main'; fi

      - name: Run deterministic verification depth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/verification-nightly
          files=(
            tests/animation-runtime.mjs
            tests/browser-semantic.mjs
            tests/deployment-policy.mjs
            tests/gui-contract.mjs
            tests/npc-markers.mjs
            tests/pixel-store.mjs
            tests/semantic-search.mjs
            tests/semantic-search-creatures.mjs
            tests/synology-live-workflow.mjs
            tests/fullworld-layers/*.test.mjs
            tests/fullworld-runtime/*.test.mjs
            tests/properties/*.test.mjs
            tests/verification/*.test.mjs
          )
          node --test "${files[@]}" 2>&1 | tee artifacts/verification-nightly/node-tests.log
          node --test --test-name-pattern='property oracle kills sign and scale mutants' \
            tests/properties/viewport-transform.test.mjs \
            2>&1 | tee artifacts/verification-nightly/controlled-mutants.log

      - name: Publish deterministic nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-verification-nightly-node-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verification-nightly/
          if-no-files-found: error
          retention-days: 14

  browser-depth:
    name: Read-only Docker browser depth
    runs-on:
      group: atlas-runners
      labels: oteryn-atlas
    timeout-minutes: 60
    concurrency:
      group: atlas-synology-live-acceptance
      cancel-in-progress: false
    env:
      ATLAS_CODE_REVISION: ${{ github.sha }}
      ATLAS_EXPECTED_REVISION: ${{ github.sha }}
      ATLAS_PUBLICATION_ORIGIN: http://192.168.1.2:8097
      ATLAS_E2E_WORKERS: '1'
      ATLAS_STRESS_LENGTH: '64'
    steps:
      - name: Verify immutable Atlas runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'Oteryn/Oteryn-Atlas'
          test "${RUNNER_SCOPE:-}" = organization
          test "${RUNNER_GROUP:-}" = atlas-runners
          test "${RUNNER_NAME:-}" = oteryn-synology-atlas
          test "${RUNNER_LABELS:-}" = oteryn-atlas
          test -S /var/run/docker.sock
          test ! -e /var/lib/oteryn-staging-state
          grep -F '"agentName": "oteryn-synology-atlas"' /runner/.runner
          grep -F '"poolName": "atlas-runners"' /runner/.runner
          grep -F '"gitHubUrl": "https://github.com/Oteryn"' /runner/.runner

      - name: Check out exact scheduled main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checkout and read-only publication origin
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ATLAS_CODE_REVISION"
          if [[ "$GITHUB_EVENT_NAME" = schedule ]]; then test "$GITHUB_REF" = 'refs/heads/main'; fi
          curl -fsS "$ATLAS_PUBLICATION_ORIGIN/fullworld/publication/publication.json" -o /tmp/atlas-nightly-publication.json
          test -s /tmp/atlas-nightly-publication.json

      - name: Record optional depth applicability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e/nightly
          skips=()
          has_any() {
            local category="$1"
            shift
            for spec in "$@"; do
              if [[ -f "e2e/$spec" ]]; then return 0; fi
            done
            skips+=("$category")
          }
          has_any performance tests/performance-desktop.spec.mjs
          has_any visual tests/visual-desktop.spec.mjs
          has_any accessibility tests/accessibility-desktop.spec.mjs tests/a11y-desktop.spec.mjs
          has_any race-fault tests/race-fault-desktop.spec.mjs tests/race-desktop.spec.mjs
          has_any soak-leak tests/soak-desktop.spec.mjs tests/soak-leak-desktop.spec.mjs

          {
            printf '{\n  "version": 1,\n  "atlasRevision": "%s",\n  "skips": [' "$ATLAS_CODE_REVISION"
            first=1
            for category in "${skips[@]}"; do
              if [[ "$first" -eq 0 ]]; then printf ','; fi
              printf '\n    {"category":"%s","status":"skip","reason":"No stable worker-delivered spec for this category exists at the exact scheduled revision."}' "$category"
              first=0
            done
            if (( ${#skips[@]} > 0 )); then printf '\n  '; fi
            printf ']\n}\n'
          } > artifacts/e2e/nightly/optional-depth-skips.json

      - name: Run bounded replayable browser depth
        shell: bash
        run: |
          set -Eeuo pipefail
          ATLAS_PUBLICATION_SCHEME="${ATLAS_PUBLICATION_ORIGIN%%://*}"
          authority="${ATLAS_PUBLICATION_ORIGIN#*://}"
          ATLAS_PUBLICATION_HOST="${authority%%:*}"
          if [[ "$authority" == *:* ]]; then
            port="${authority##*:}"
          elif [[ "$ATLAS_PUBLICATION_SCHEME" == https ]]; then
            port=443
          else
            port=80
          fi
          ATLAS_PUBLICATION_UPSTREAM="$ATLAS_PUBLICATION_HOST:$port"
          ATLAS_PUBLICATION_HOST_HEADER="$authority"
          export ATLAS_PUBLICATION_SCHEME ATLAS_PUBLICATION_HOST ATLAS_PUBLICATION_UPSTREAM ATLAS_PUBLICATION_HOST_HEADER

          project="oteryn-atlas-nightly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose=(docker compose -p "$project" -f e2e/compose.yml)
          cleanup() { "${compose[@]}" down --remove-orphans >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          "${compose[@]}" up -d atlas-web
          "${compose[@]}" build e2e

          run_case() {
            local label="$1"
            shift
            mkdir -p "artifacts/e2e/nightly/$label"
            ATLAS_E2E_ARTIFACTS_HOST="../artifacts/e2e/nightly/$label" \
              "${compose[@]}" run --rm "$@"
          }

          run_case required \
            -e ATLAS_E2E_DEPTH=required \
            e2e npm test

          run_case repeated-critical \
            -e ATLAS_E2E_DEPTH=required \
            e2e npx playwright test --config=playwright.config.mjs \
              tests/geometry-desktop.spec.mjs tests/render-probes-desktop.spec.mjs \
              --project=desktop-chromium --repeat-each=3

          for seed in 133 1096043585 2779096485 3735928559; do
            run_case "stress-$seed" \
              -e ATLAS_E2E_DEPTH=required \
              -e ATLAS_STRESS_SEED="$seed" \
              -e ATLAS_STRESS_LENGTH="$ATLAS_STRESS_LENGTH" \
              e2e npx playwright test --config=playwright.config.mjs \
                tests/stress-desktop.spec.mjs --project=desktop-chromium
          done

          run_case extra-profiles \
            -e ATLAS_E2E_DEPTH=nightly \
            e2e npx playwright test --config=playwright.config.mjs \
              --project=nightly-desktop-dpr2 --project=nightly-tablet

          run_optional() {
            local label="$1"
            shift
            local present=()
            for spec in "$@"; do
              if [[ -f "e2e/$spec" ]]; then present+=("$spec"); fi
            done
            if (( ${#present[@]} > 0 )); then
              run_case "optional-$label" \
                -e ATLAS_E2E_DEPTH=required \
                e2e npx playwright test --config=playwright.config.mjs \
                  "${present[@]}" --project=desktop-chromium
            fi
          }

          run_optional performance tests/performance-desktop.spec.mjs
          run_optional visual tests/visual-desktop.spec.mjs
          run_optional accessibility tests/accessibility-desktop.spec.mjs tests/a11y-desktop.spec.mjs
          run_optional race-fault tests/race-fault-desktop.spec.mjs tests/race-desktop.spec.mjs
          run_optional soak-leak tests/soak-desktop.spec.mjs tests/soak-leak-desktop.spec.mjs

      - name: Publish bounded nightly browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-verification-nightly-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/e2e/nightly/
          if-no-files-found: error
          retention-days: 14
