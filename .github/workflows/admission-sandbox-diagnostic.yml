name: Admission sandbox diagnostic (non-authoritative)
on:
  push:
    paths:
      - '.github/workflows/admission-sandbox-diagnostic.yml'
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact proposed authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c9224e4b56b591ebb622dda23b87eee6a138e7e7
          persist-credentials: false
          fetch-depth: 0
          path: proposed-authority
      - name: Check out exact shadow candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c879777a23776e30ec3889aee110dc36181b5f0c
          persist-credentials: false
          fetch-depth: 0
          path: shadow-candidate
      - name: Execute complete shadow qualification without publication
        shell: bash
        run: |
          set -euo pipefail
          cat > shadow-entry.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const sourcePath='./proposed-authority/tools/verification/run-protected-admission.mjs';
          let executionSource=fs.readFileSync(sourcePath,'utf8');
          const reviewGuard="if(!Array.isArray(plan.specialist)||!Array.isArray(plan.review)||plan.specialist.length||plan.review.length)throw new TypeError('independent specialist or review evidence required');";
          const diagnosticGuard="if(!Array.isArray(plan.specialist)||!Array.isArray(plan.review)||plan.specialist.length)throw new TypeError('specialist execution unsupported in diagnostic'); console.log('UNMET_INDEPENDENT_REVIEW',JSON.stringify(plan.review));";
          if(executionSource.split(reviewGuard).length!==2)throw Error('diagnostic guard anchor drift');
          executionSource=executionSource.replace(reviewGuard,diagnosticGuard);
          const diagnosticModule='./proposed-authority/tools/verification/incomplete-hosted-diagnostic.mjs';
          fs.writeFileSync(diagnosticModule,executionSource,{flag:'wx'});
          const {executeProtectedCandidateProof}=await import(diagnosticModule);
          import {validateProtectedExecutionCandidate} from './proposed-authority/tools/verification/protected-admission-policy.mjs';
          const protectedRoot=path.resolve('proposed-authority'),candidateRoot=path.resolve('shadow-candidate');
          const git=(root,...args)=>execFileSync('git',['-C',root,...args],{encoding:'utf8'}).trim();
          const headSha=git(candidateRoot,'rev-parse','HEAD'),baseSha=git(protectedRoot,'rev-parse','HEAD');
          const changedFiles=git(candidateRoot,'diff','--no-renames','--name-status',baseSha,headSha).split('\n').map(row=>{const [status,p]=row.split('\t');if(!['M','A','D'].includes(status))throw Error('unexpected status');return {path:p,status:{M:'modified',A:'added',D:'removed'}[status]};});
          const candidate={repository:process.env.GITHUB_REPOSITORY,prNumber:null,headSha,baseSha,treeSha:git(candidateRoot,'rev-parse','HEAD^{tree}'),changedFiles};
          console.log('SHADOW_ONLY_IDENTITY',candidate);
          const admission=validateProtectedExecutionCandidate({protectedRoot,candidateRoot,currentCandidate:candidate});
          console.log('SHADOW_ADMISSION',admission);
          const proof=await executeProtectedCandidateProof({protectedRoot,candidateRoot,outputRoot:path.join(process.env.RUNNER_TEMP,'shadow-full-proof'),candidate,admission});
          console.log('INCOMPLETE_HOSTED_DIAGNOSTIC_NOT_QUALIFICATION',JSON.stringify(proof));
          throw Error('Diagnostic is intentionally incomplete: independent visual review remains required. No accepted evidence.');
          NODE
          node shadow-entry.mjs
      - name: Retain shadow browser diagnostics only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shadow-browser-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/shadow-full-proof/browser-*
          if-no-files-found: warn
          retention-days: 3
