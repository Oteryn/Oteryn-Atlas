name: Protected sandbox diagnosis (non-authoritative)
on:
  push:
    paths:
      - '.github/workflows/admission-sandbox-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 563370409880d40b0b7e334b9a5d4fc86b08b459
          persist-credentials: false
          path: protected
      - name: Reproduce exact protected CLI regression sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diag-out"
          chmod 777 "$RUNNER_TEMP/diag-out"
          cat > "$RUNNER_TEMP/diag.mjs" <<'JS'
          import {spawnSync} from 'node:child_process';
          const r=spawnSync('node',['--test','/candidate/tests/verification/protected-admission-cli-census.test.mjs'],{stdio:'inherit',cwd:'/candidate',env:process.env});process.exit(r.status??1);
          JS
          docker run --rm --env TMPDIR=/out --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1536m --cpus 2 --user 1000:1000 --tmpfs /tmp:rw,nosuid,nodev,size=256m --mount "type=bind,src=$PWD/protected,dst=/candidate,readonly" --mount "type=bind,src=$RUNNER_TEMP/diag-out,dst=/out" --mount "type=bind,src=$RUNNER_TEMP/diag.mjs,dst=/run-proof.mjs,readonly" mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07 node /run-proof.mjs
