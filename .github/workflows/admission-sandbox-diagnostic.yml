name: Protected consumer replay (non-authoritative)
on:
  push:
    paths:
      - '.github/workflows/admission-sandbox-diagnostic.yml'
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out actual protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6f7df79b8dd965dc33a56c34f1f7f4376dce8fbb
          persist-credentials: false
          path: protected
      - name: Check out exact proposed consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8df58e829b4dae8a97aea474b2ff61c119981db2
          persist-credentials: false
          path: proposed
      - name: Replay actual current protected evidence and authenticated review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_CODE_REVISION: d44116f34491f50955292d1dce865ede968a627f
          ATLAS_PROTECTED_BASE_SHA: 6f7df79b8dd965dc33a56c34f1f7f4376dce8fbb
        run: |
          set -euo pipefail
          echo 'NON_AUTHORITATIVE_CONSUMER_REPLAY: no accepted protected publication, status, or merge.'
          ATLAS_PR_NUMBER=336 node proposed/tools/verification/consume-protected-admission.mjs --protected-root "$PWD/protected" --output "$RUNNER_TEMP/replay-pr.json"
          jq -e '.accepted == true' "$RUNNER_TEMP/replay-pr.json"
          echo 'MQ_MODE_REPLAY uses current candidate commit association; this is not a real merge-group canary.'
          env -u ATLAS_PR_NUMBER node proposed/tools/verification/consume-protected-admission.mjs --protected-root "$PWD/protected" --output "$RUNNER_TEMP/replay-mq-mode.json"
          jq -e '.accepted == true' "$RUNNER_TEMP/replay-mq-mode.json"
          echo 'Complete real API consumer replay passed; proposed code remains untrusted until protected integration.'
