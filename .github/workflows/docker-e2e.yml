name: Docker E2E Harness

on:
  pull_request:
    paths:
      - '.dockerignore'
      - 'e2e/**'
      - '.github/workflows/docker-e2e.yml'
      - '.github/workflows/synology-live-acceptance.yml'
      - 'AGENTS.md'
      - 'tests/deployment-policy.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-docker-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ATLAS_CODE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      # Non-authoritative static-overlay sentinel. This harness never executes
      # Playwright against publication routes; ordinary browser evidence must
      # still provide a validated immutable publication and readiness manifest.
      ATLAS_PUBLICATION_ORIGIN: http://127.0.0.1:9
      ATLAS_PUBLICATION_SCHEME: http
      ATLAS_PUBLICATION_UPSTREAM: 127.0.0.1:9
      ATLAS_PUBLICATION_HOST_HEADER: 127.0.0.1
      ATLAS_PUBLICATION_HOST: 127.0.0.1
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate Compose and current-code web overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ATLAS_CODE_REVISION"
          node --check e2e/tests/live-creature-preview.cjs
          node --test tests/deployment-policy.mjs
          docker compose -f e2e/compose.yml config >/tmp/atlas-e2e-compose.yml
          docker compose -f e2e/compose.yml up -d atlas-web
          trap 'docker compose -f e2e/compose.yml down --remove-orphans' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if docker compose -f e2e/compose.yml exec -T atlas-web wget -q -O /dev/null http://127.0.0.1:8080/web/fullworld.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker compose -f e2e/compose.yml ps -a || true
            docker compose -f e2e/compose.yml logs --no-color atlas-web || true
            exit 1
          fi
          docker compose -f e2e/compose.yml exec -T atlas-web \
            wget -S -O /dev/null http://127.0.0.1:8080/web/fullworld-app.mjs 2>/tmp/atlas-e2e-module-headers
          cat /tmp/atlas-e2e-module-headers
          grep -Eiq 'Content-Type: application/javascript' /tmp/atlas-e2e-module-headers
          grep -Fq "X-Oteryn-Atlas-Code-Revision: $ATLAS_CODE_REVISION" /tmp/atlas-e2e-module-headers

      - name: Build Playwright image and enumerate E2E tests
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t oteryn-atlas-e2e:ci -f e2e/Dockerfile .
          docker run --rm \
            -e ATLAS_ARTIFACTS_DIR=/tmp/artifacts \
            oteryn-atlas-e2e:ci \
            npx playwright test --config=playwright.config.mjs --list
