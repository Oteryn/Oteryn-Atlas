name: Issue 314 provenance rotation writer

on:
  push:
    branches:
      - fix/issue-314-clean-qualification-path-20260903

permissions:
  contents: write

jobs:
  rotate:
    if: github.event.before == 'ce56f022054b740b938048f0d909db97bafe0969' && github.ref == 'refs/heads/fix/issue-314-clean-qualification-path-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact writer event
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Rotate exact CI provenance pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ce56f022054b740b938048f0d909db97bafe0969"
          python - <<'PY'
          import hashlib
          from pathlib import Path

          old_ci = '27d0a6bc250a5378064f714b57569a092a2c1579'
          new_ci = '6d1ca9d28fc1f73d284fa140d2917694b4c0a3fe'
          old_map = 'f5e2c3c04a749ded7a94f721e6fa299b3ce2bf2d'

          map_path = Path('docs/migration/legacy-atlas-extraction-provenance.json')
          map_text = map_path.read_text(encoding='utf-8')
          count = map_text.count(old_ci)
          if count != 13:
              raise SystemExit(f'expected exactly 13 legacy CI provenance references, got {count}')
          if new_ci in map_text:
              raise SystemExit('new CI blob already present before exact rotation')
          map_text = map_text.replace(old_ci, new_ci)
          map_path.write_text(map_text, encoding='utf-8')

          map_bytes = map_text.encode('utf-8')
          new_map = hashlib.sha1(f'blob {len(map_bytes)}\0'.encode('ascii') + map_bytes).hexdigest()

          audit_path = Path('.github/workflows/merge-authority-audit.yml')
          audit = audit_path.read_text(encoding='utf-8')
          if audit.count(f'EXPECTED_PR_CI_BLOB: "{old_ci}"') != 1:
              raise SystemExit('protected audit does not contain the exact old CI pin once')
          if audit.count(f'EXPECTED_PROVENANCE_MAP_BLOB: "{old_map}"') != 1:
              raise SystemExit('protected audit does not contain the exact old provenance-map pin once')
          audit = audit.replace(f'EXPECTED_PR_CI_BLOB: "{old_ci}"', f'EXPECTED_PR_CI_BLOB: "{new_ci}"')
          audit = audit.replace(f'EXPECTED_PROVENANCE_MAP_BLOB: "{old_map}"', f'EXPECTED_PROVENANCE_MAP_BLOB: "{new_map}"')
          audit_path.write_text(audit, encoding='utf-8')

          print(f'rotated_provenance_rows={count}')
          print(f'new_provenance_map_blob={new_map}')
          PY

          node --test tests/verification/merge-queue-gate-contract.test.mjs
          python tools/governance/verify_extraction_provenance.py
          git diff --check
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | grep -c '^ M ')" = 2
          printf '%s\n' "$changed" | grep -F ' M .github/workflows/merge-authority-audit.yml'
          printf '%s\n' "$changed" | grep -F ' M docs/migration/legacy-atlas-extraction-provenance.json'

      - name: Commit exact provenance rotation to the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/merge-authority-audit.yml docs/migration/legacy-atlas-extraction-provenance.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 2
          git diff --cached --name-only | grep -Fx '.github/workflows/merge-authority-audit.yml'
          git diff --cached --name-only | grep -Fx 'docs/migration/legacy-atlas-extraction-provenance.json'
          git commit -m "fix(governance): rotate Atlas CI provenance pins"
          git push origin HEAD:fix/issue-314-clean-qualification-path-20260903
