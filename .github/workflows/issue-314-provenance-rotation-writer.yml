name: Issue 314 provenance rotation writer

on:
  push:
    branches:
      - fix/issue-314-clean-qualification-path-20260903

permissions:
  contents: write

jobs:
  rotate:
    if: github.event.before == '50ba173aaaf8259a64333813e9a4dc7e7c47e646' && github.ref == 'refs/heads/fix/issue-314-clean-qualification-path-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact writer event
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Materialize exact rotated audit blob without updating a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "50ba173aaaf8259a64333813e9a4dc7e7c47e646"
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          old_ci = '27d0a6bc250a5378064f714b57569a092a2c1579'
          new_ci = '6d1ca9d28fc1f73d284fa140d2917694b4c0a3fe'
          old_map = 'f5e2c3c04a749ded7a94f721e6fa299b3ce2bf2d'
          new_map = '763c797cf23f18a157b2c8ca51f0b7b279ae5ac5'

          audit_path = Path('.github/workflows/merge-authority-audit.yml')
          audit = audit_path.read_text(encoding='utf-8')
          if audit.count(f'EXPECTED_PR_CI_BLOB: "{old_ci}"') != 1:
              raise SystemExit('protected audit does not contain the exact old CI pin once')
          if audit.count(f'EXPECTED_PROVENANCE_MAP_BLOB: "{old_map}"') != 1:
              raise SystemExit('protected audit does not contain the exact old provenance-map pin once')
          audit = audit.replace(f'EXPECTED_PR_CI_BLOB: "{old_ci}"', f'EXPECTED_PR_CI_BLOB: "{new_ci}"')
          audit = audit.replace(f'EXPECTED_PROVENANCE_MAP_BLOB: "{old_map}"', f'EXPECTED_PROVENANCE_MAP_BLOB: "{new_map}"')
          audit_path.write_text(audit, encoding='utf-8')

          raw = audit.encode('utf-8')
          expected_blob = hashlib.sha1(f'blob {len(raw)}\0'.encode('ascii') + raw).hexdigest()
          payload = json.dumps({'content': base64.b64encode(raw).decode('ascii'), 'encoding': 'base64'}).encode('utf-8')
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs",
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Oteryn-Atlas-issue-314-audit-blob-writer',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          if result.get('sha') != expected_blob:
              raise SystemExit(f"Git blob identity mismatch: {result.get('sha')} != {expected_blob}")
          print(f'ROTATED_AUDIT_BLOB={expected_blob}')
          PY

          node --test tests/verification/merge-queue-gate-contract.test.mjs
          git diff --check
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | grep -c '^ M ')" = 1
          printf '%s\n' "$changed" | grep -F ' M .github/workflows/merge-authority-audit.yml'
