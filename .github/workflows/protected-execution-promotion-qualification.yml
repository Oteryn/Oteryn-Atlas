          import { test, expect } from '@playwright/test';
          import { DESKTOP_ENTRY, gotoAtlas, qualificationResult } from './runtime.mjs';

          test('protected qualification navigation resolves the verified fixture entry before Atlas navigation', async ({ page }) => {
