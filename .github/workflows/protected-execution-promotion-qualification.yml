            const expected = navigable[0].position;

            await gotoAtlas(page, DESKTOP_ENTRY);
            const current = new URL(page.url());
            expect(Number(current.searchParams.get('x'))).toBe(expected.x);
            expect(Number(current.searchParams.get('y'))).toBe(expected.y);
            expect(Number(current.searchParams.get('floor'))).toBe(expected.floor);
            expect(current.searchParams.get('zoom')).toBe('2');
            expect(current.searchParams.get('mode')).toBe('map');

            const { status, result } = await qualificationResult(page);
            expect(status, result.error || 'qualification status').toBe('PASS');
            expect(result.status).toBe('PASS');
            expect(result.error).toBeNull();
            expect(result.capabilities?.blockedOrUnknownEnabled).toBe(false);
            await expect(page.locator('#runtime-badge')).toContainText('VERIFIED FULL-WORLD');
            await expect(page.locator('#diag-backend')).toContainText(/webgl2/i);
          });
          SPEC

          export COMPOSE_PROJECT_NAME="atlas-modification-filter-${GITHUB_RUN_ID}"
          export ATLAS_CODE_REVISION="$ATLAS_CODE_REVISION"
          export ATLAS_VERIFICATION_PLAN_SHA256="sha256:$(printf '%s' "$ATLAS_CODE_REVISION" | sha256sum | awk '{print $1}')"
          export ATLAS_E2E_SHARD='1/1'
          export ATLAS_E2E_WORKERS='1'
          export ATLAS_QUALIFICATION_PUBLICATION_HOST="$source_root"
          export ATLAS_QUALIFICATION_TRUST_JSON="$(jq -c . "$trust_path")"
          export ATLAS_EXECUTION_CONTEXT="$execution_context"
          export ATLAS_E2E_ARTIFACTS_HOST="$artifacts"
          export ATLAS_PROTECTED_TEST_LIST="$test_list"

          compose_down() {
            docker compose \
              -f trusted-base/e2e/compose.protected-hosted-executor.yml \
              -f trusted-base/e2e/compose.github-hosted.yml \
              down -v --remove-orphans >/dev/null 2>&1 || true
          }
          trap compose_down EXIT
          compose_down
          docker compose \
            -f trusted-base/e2e/compose.protected-hosted-executor.yml \
            -f trusted-base/e2e/compose.github-hosted.yml \
            up -d --wait atlas-publication atlas-web
          docker compose \
            -f trusted-base/e2e/compose.protected-hosted-executor.yml \
            -f trusted-base/e2e/compose.github-hosted.yml \
            build e2e
          docker compose \
            -f trusted-base/e2e/compose.protected-hosted-executor.yml \
            -f trusted-base/e2e/compose.github-hosted.yml \
            run --rm e2e \
            bash -lc 'exec ./node_modules/.bin/playwright test tests/protected-navigation-bootstrap-desktop.spec.mjs --config=playwright.config.mjs --project=desktop-chromium --workers=1 --retries=0'

      - name: Fence exact head and publish planned-census compatibility status
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/atlas-modification-filter-after.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER" > "$payload"
          node trusted-base/tools/verification/assert-current-pr-head.mjs \
            --payload "$payload" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$ATLAS_PR_NUMBER" \
            --expected-head-sha "$ATLAS_CODE_REVISION"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$ATLAS_CODE_REVISION" \
            -f state='success' \
            -f context='atlas-local-e2e' \
            -f description='Protected GitHub-hosted qualification-navigation Chromium proof' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
