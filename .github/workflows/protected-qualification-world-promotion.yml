name: Protected qualification world promotion

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: atlas-protected-qualification-world-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  targeted-compatibility:
    name: Publish targeted qualification-world compatibility evidence
    if: >-
      github.event.label.name == 'atlas-legacy-transition-qualification' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/issue-179-protected-qualification-world-promotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      ATLAS_PR_NUMBER: ${{ github.event.pull_request.number }}
      ATLAS_CODE_REVISION: ${{ github.event.pull_request.head.sha }}
      ATLAS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ATLAS_CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
      ATLAS_CANDIDATE_IMAGE: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      ATLAS_EXPECTED_QUALIFICATION_DIGEST: sha256:f53f1dcb8961c42e82191644b7628cfb4f30641344c8876f4178d37a94dd4cd5
    steps:
      - name: Require exact five-file promotion delta
        shell: bash
        run: |
          set -euo pipefail
          rows="$(mktemp)"
          expected="$(mktemp)"
          trap 'rm -f "$rows" "$expected"' EXIT
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' | sort > "$rows"
          test "$(wc -l < "$rows" | tr -d '[:space:]')" = "$ATLAS_CHANGED_FILE_COUNT"
          printf '%s\n' \
            '.github/workflows/protected-qualification-world-promotion.yml' \
            'tests/verification/protected-qualification-world-promotion-workflow-contract.test.mjs' \
            'tests/verification/qualification-world.test.mjs' \
            'tools/verification/qualification-fixture-definition.mjs' \
            'tools/verification/qualification-world.mjs' \
            > "$expected"
          diff -u "$expected" "$rows"

      - name: Check out exact protected base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: trusted-base

      - name: Check out exact candidate head as sandbox data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate

      - name: Fence current PR head before hosted proof
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/atlas-qualification-world-promotion-before.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER" > "$payload"
          node trusted-base/tools/verification/assert-current-pr-head.mjs \
            --payload "$payload" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$ATLAS_PR_NUMBER" \
            --expected-head-sha "$ATLAS_CODE_REVISION"
          test "$(git -C candidate rev-parse HEAD)" = "$ATLAS_CODE_REVISION"
          test "$(git -C trusted-base rev-parse HEAD)" = "$ATLAS_BASE_SHA"

      - name: Prove immutable qualification world without browser execution
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 180s docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 2048m \
            --cpus 2 \
            --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount "type=bind,src=$PWD/candidate,dst=/candidate,readonly" \
            -e ATLAS_EXPECTED_QUALIFICATION_DIGEST \
            "$ATLAS_CANDIDATE_IMAGE" \
            bash -lc 'cd /candidate && node --test tests/verification/qualification-world.test.mjs && node --input-type=module -e "import fs from \"node:fs\"; import { buildQualificationWorld, verifyQualificationWorld } from \"./tools/verification/qualification-world.mjs\"; const root=\"/tmp/atlas-qualification-promotion\"; fs.rmSync(root,{recursive:true,force:true}); const built=await buildQualificationWorld(root); const verified=await verifyQualificationWorld(root); if (built.fixtureId !== \"atlas-qualification-world-v2\" || built.productDigest !== process.env.ATLAS_EXPECTED_QUALIFICATION_DIGEST || verified.productDigest !== process.env.ATLAS_EXPECTED_QUALIFICATION_DIGEST) throw new Error(\"qualification fixture identity mismatch\"); fs.rmSync(root,{recursive:true,force:true});"'

      - name: Fence exact head and publish one-time compatibility status
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/atlas-qualification-world-promotion-after.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER" > "$payload"
          node trusted-base/tools/verification/assert-current-pr-head.mjs \
            --payload "$payload" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$ATLAS_PR_NUMBER" \
            --expected-head-sha "$ATLAS_CODE_REVISION"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$ATLAS_CODE_REVISION" \
            -f state='success' \
            -f context='atlas-local-e2e' \
            -f description='Targeted qualification-world bootstrap; no browser E2E executed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
