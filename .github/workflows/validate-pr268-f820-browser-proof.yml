name: Validate exact PR268 break-glass candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-pr268-f820-browser-proof
  cancel-in-progress: true

env:
  ATLAS_CODE_REVISION: f8209a61dee08194f17dde33e0623adfd3e7ed3b
  ATLAS_PROTECTED_BASE_SHA: e31015d0880e9f81a4b96f990658490af45e8fa6
  ATLAS_PR_NUMBER: '268'
  ATLAS_EXPECTED_PRODUCT_DIGEST: sha256:c36ed503f8ada27a673ba96780b70cb361fa2fe2ce08240e372dbff664a2866a
  ATLAS_CANDIDATE_IMAGE: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07

jobs:
  exact-candidate-proof:
    name: PR268 exact candidate 68-test proof
    if: github.head_ref == 'validation/pr268-f820-browser-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact protected base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ATLAS_PROTECTED_BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted-base

      - name: Check out exact PR268 candidate as inert data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ATLAS_CODE_REVISION }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Fence live PR268 and exact 28-file delta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/pr268-live.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER" > "$payload"
          node trusted-base/tools/verification/assert-current-pr-head.mjs \
            --payload "$payload" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$ATLAS_PR_NUMBER" \
            --expected-head-sha "$ATLAS_CODE_REVISION"
          test "$(git -C trusted-base rev-parse HEAD)" = "$ATLAS_PROTECTED_BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$ATLAS_CODE_REVISION"
          test "$(jq -r '.base.sha' "$payload")" = "$ATLAS_PROTECTED_BASE_SHA"
          test "$(jq -r '.changed_files' "$payload")" = 28
          rows="$RUNNER_TEMP/pr268-files.txt"
          expected="$RUNNER_TEMP/pr268-expected-files.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER/files?per_page=100" --jq '.[].filename' | sort > "$rows"
          node --input-type=module - "$expected" <<'NODE'
          import fs from 'node:fs';
          import { resolveProtectedPromotionQualification } from './trusted-base/tools/verification/protected-hosted-execution.mjs';
          const q = resolveProtectedPromotionQualification('fix/issue-179-qualification-functional-fixture');
          fs.writeFileSync(process.argv[2], `${[...q.changedFiles].sort().join('\n')}\n`, 'utf8');
          NODE
          diff -u "$expected" "$rows"

      - name: Prove exact protected and candidate stable-ID census
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix trusted-base/e2e --ignore-scripts --no-audit --no-fund
          protected_list="$RUNNER_TEMP/protected-list.txt"
          candidate_list="$RUNNER_TEMP/candidate-list.txt"
          protected_ids="$RUNNER_TEMP/protected-ids.json"
          candidate_ids="$RUNNER_TEMP/candidate-ids.json"
          qualification_list="$RUNNER_TEMP/qualification-list.txt"
          (
            cd trusted-base
            ATLAS_ARTIFACTS_DIR="$RUNNER_TEMP/protected-list-artifacts" \
              npm exec --prefix e2e -- playwright test --config=e2e/playwright.config.mjs --list
          ) > "$protected_list"
          test ! -e candidate/e2e/node_modules
          ln -s /protected-e2e-node-modules/node_modules candidate/e2e/node_modules
          timeout --signal=KILL 120s docker run --rm \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 192 --memory 1536m --cpus 2 --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount "type=bind,src=$PWD/candidate,dst=/candidate,readonly" \
            --mount "type=bind,src=$PWD/trusted-base/e2e/node_modules,dst=/protected-e2e-node-modules/node_modules,readonly" \
            "$ATLAS_CANDIDATE_IMAGE" \
            bash -lc 'cd /candidate && CI=1 ATLAS_ARTIFACTS_DIR=/tmp/artifacts e2e/node_modules/.bin/playwright test --config=e2e/playwright.config.mjs --list' \
            > "$candidate_list"
          node trusted-base/tools/verification/parse-playwright-test-list.mjs "$protected_list" > "$protected_ids"
          node trusted-base/tools/verification/parse-playwright-test-list.mjs "$candidate_list" > "$candidate_ids"
          diff -u "$protected_ids" "$candidate_ids"
          CANDIDATE_LIST="$candidate_list" QUALIFICATION_LIST="$qualification_list" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('./trusted-base/tools/verification/verification-catalog.json', 'utf8'));
          const specs = new Set(catalog.groups?.['e2e.full']?.specs ?? []);
          if (!specs.size) throw new TypeError('protected e2e.full qualification catalog is empty');
          const rows = fs.readFileSync(process.env.CANDIDATE_LIST, 'utf8').split(/\r?\n/);
          const selected = [];
          for (const line of rows) {
            const match = line.match(/^\s*\[([^\]]+)\]\s+›\s+([^:]+):\d+:\d+\s+›\s+(.+)$/);
            if (!match) continue;
            const spec = `e2e/tests/${match[2]}`;
            if (specs.has(spec)) selected.push(line.trim());
          }
          if (selected.length !== 68) throw new TypeError(`expected 68 protected e2e.full tests, got ${selected.length}`);
          fs.writeFileSync(process.env.QUALIFICATION_LIST, `${selected.join('\n')}\n`, 'utf8');
          NODE
          printf '%s\n' "$qualification_list" > "$RUNNER_TEMP/qualification-list-path.txt"

      - name: Rebuild candidate qualification product and run deterministic suite
        shell: bash
        run: |
          set -euo pipefail
          source_parent="$RUNNER_TEMP/qualification-world"
          source_root="$source_parent/product"
          trust_dir="$RUNNER_TEMP/qualification-trust"
          trust_path="$trust_dir/qualification_fixture.json"
          rm -rf "$source_parent" "$trust_dir"
          mkdir -p "$source_parent" "$trust_dir"
          chmod 0777 "$source_parent" "$trust_dir"
          proof="$RUNNER_TEMP/build-candidate-product.mjs"
          cat > "$proof" <<'NODE'
          import fs from 'node:fs';
          import { resolveFullWorldTrust } from '/trusted/src/browser/fullworld-trust.mjs';
          import { buildQualificationWorld, qualificationTrustDescriptor, verifyQualificationWorld } from '/candidate/tools/verification/qualification-world.mjs';
          const built = await buildQualificationWorld('/out/product');
          const verified = await verifyQualificationWorld('/out/product');
          if (built.productDigest !== verified.productDigest) throw new TypeError('candidate qualification rebuild is nondeterministic');
          if (built.productDigest !== process.env.ATLAS_EXPECTED_PRODUCT_DIGEST) throw new TypeError(`candidate product digest moved: ${built.productDigest}`);
          const descriptor = qualificationTrustDescriptor(verified);
          const trust = resolveFullWorldTrust({ __OTERYN_ATLAS_QUALIFICATION_TRUST__: descriptor });
          if (trust.qualificationFixtureId !== verified.fixtureId || trust.qualificationProductDigest !== built.productDigest) {
            throw new TypeError('protected trust policy rejected candidate-built qualification identity');
          }
          fs.writeFileSync('/out/qualification_fixture.json', `${JSON.stringify(descriptor)}\n`, 'utf8');
          NODE
          timeout --signal=KILL 180s docker run --rm \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 192 --memory 1024m --cpus 2 --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --env "ATLAS_EXPECTED_PRODUCT_DIGEST=$ATLAS_EXPECTED_PRODUCT_DIGEST" \
            --mount "type=bind,src=$PWD/trusted-base,dst=/trusted,readonly" \
            --mount "type=bind,src=$PWD/candidate,dst=/candidate,readonly" \
            --mount "type=bind,src=$proof,dst=/proof.mjs,readonly" \
            --mount "type=bind,src=$source_parent,dst=/out" \
            "$ATLAS_CANDIDATE_IMAGE" node /proof.mjs
          mv "$source_parent/qualification_fixture.json" "$trust_path"
          test -s "$trust_path"
          timeout --signal=KILL 240s docker run --rm \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 1536m --cpus 2 --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount "type=bind,src=$PWD/candidate,dst=/candidate,readonly" \
            --mount "type=bind,src=$PWD/trusted-base/e2e/node_modules,dst=/protected-e2e-node-modules/node_modules,readonly" \
            "$ATLAS_CANDIDATE_IMAGE" \
            bash -lc 'set -euo pipefail; cd /candidate; mkdir -p /tmp/atlas-python-bin /tmp/atlas-python-pycache; ln -s /usr/bin/python3 /tmp/atlas-python-bin/python; export PATH="/tmp/atlas-python-bin:$PATH" PYTHONPYCACHEPREFIX=/tmp/atlas-python-pycache; node --test tests/verification/*.test.mjs'
          printf '%s\n' "$source_root" > "$RUNNER_TEMP/source-root-path.txt"
          printf '%s\n' "$trust_path" > "$RUNNER_TEMP/trust-path.txt"

      - name: Prove complete candidate qualification safety net in Chromium
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(cat "$RUNNER_TEMP/source-root-path.txt")"
          trust_path="$(cat "$RUNNER_TEMP/trust-path.txt")"
          qualification_list="$(cat "$RUNNER_TEMP/qualification-list-path.txt")"
          execution_context="$RUNNER_TEMP/execution-context"
          artifacts="$RUNNER_TEMP/browser-artifacts"
          identity_dir="$RUNNER_TEMP/identities"
          rm -rf "$execution_context" "$artifacts" "$identity_dir"
          mkdir -p "$execution_context" "$artifacts" "$identity_dir"
          rsync -a --delete --exclude='.git' candidate/ "$execution_context/"
          for path in e2e e2e/tests e2e/support web src; do test -d "$execution_context/$path"; test ! -L "$execution_context/$path"; done
          rm -rf "$execution_context/e2e/node_modules"
          rm -f "$execution_context/.dockerignore" "$execution_context/e2e/Dockerfile.dockerignore"
          cp trusted-base/e2e/Dockerfile "$execution_context/e2e/Dockerfile"
          cp trusted-base/e2e/package.json trusted-base/e2e/package-lock.json "$execution_context/e2e/"
          cp trusted-base/e2e/playwright.config.mjs trusted-base/e2e/summary-reporter.mjs "$execution_context/e2e/"
          mkdir -p "$execution_context/tools/verification"
          cp trusted-base/tools/verification/stable-id.mjs "$execution_context/tools/verification/stable-id.mjs"
          IDENTITY_DIR="$identity_dir" QUALIFICATION_LIST="$qualification_list" TRUST_PATH="$trust_path" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { bytesDigest, canonicalDigest } from './trusted-base/tools/verification/anti-loop-common.mjs';
          import { buildProtectedExecutionEnvironmentIdentity } from './trusted-base/tools/verification/protected-execution-environment.mjs';
          import { buildVerificationAuthorityIdentity } from './trusted-base/tools/verification/verification-authority.mjs';
          const readJson = (target) => JSON.parse(fs.readFileSync(target, 'utf8'));
          const authorityIdentity = await buildVerificationAuthorityIdentity({
            manifest: readJson('trusted-base/tools/verification/verification-authority-manifest.json'),
            readFile: async (relative) => fs.readFileSync(path.join('trusted-base', relative)),
          });
          const environmentIdentity = buildProtectedExecutionEnvironmentIdentity(readJson('trusted-base/tools/verification/protected-execution-environment.json'));
          const trust = readJson(process.env.TRUST_PATH);
          if (trust.productDigest !== process.env.ATLAS_EXPECTED_PRODUCT_DIGEST) throw new TypeError('browser proof trust digest mismatch');
          const semanticCore = {
            schemaVersion: 1,
            identityId: 'atlas-pr268-break-glass-validation-semantic-v1',
            repository: process.env.GITHUB_REPOSITORY,
            candidateHeadSha: process.env.ATLAS_CODE_REVISION,
            authorityDigest: authorityIdentity.authorityDigest,
            environmentDigest: environmentIdentity.environmentDigest,
            dataCapability: 'qualification_fixture',
            productDigest: trust.productDigest,
            protectedTestListDigest: bytesDigest(fs.readFileSync(process.env.QUALIFICATION_LIST)),
            execution: { shard: '1/1', workers: 1, retries: 0 },
          };
          const semanticIdentity = { ...semanticCore, planSemanticDigest: canonicalDigest(semanticCore) };
          const instanceCore = {
            schemaVersion: 1,
            identityId: 'atlas-pr268-break-glass-validation-instance-v1',
            repository: process.env.GITHUB_REPOSITORY,
            protectedBaseSha: process.env.ATLAS_PROTECTED_BASE_SHA,
            candidateHeadSha: process.env.ATLAS_CODE_REVISION,
            planSemanticDigest: semanticIdentity.planSemanticDigest,
            runId: String(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
          };
          const instanceIdentity = { ...instanceCore, planInstanceDigest: canonicalDigest(instanceCore) };
          fs.writeFileSync(path.join(process.env.IDENTITY_DIR, 'verification-authority-identity.json'), `${JSON.stringify(authorityIdentity, null, 2)}\n`);
          fs.writeFileSync(path.join(process.env.IDENTITY_DIR, 'protected-execution-environment-identity.json'), `${JSON.stringify(environmentIdentity, null, 2)}\n`);
          fs.writeFileSync(path.join(process.env.IDENTITY_DIR, 'semantic.json'), `${JSON.stringify(semanticIdentity, null, 2)}\n`);
          fs.writeFileSync(path.join(process.env.IDENTITY_DIR, 'instance.json'), `${JSON.stringify(instanceIdentity, null, 2)}\n`);
          NODE
          export COMPOSE_PROJECT_NAME="atlas-pr268-validation-${GITHUB_RUN_ID}"
          export ATLAS_VERIFICATION_PLAN_SHA256="sha256:$(printf '%s' "$ATLAS_CODE_REVISION" | sha256sum | awk '{print $1}')"
          export ATLAS_PLAN_SEMANTIC_DIGEST="$(jq -er '.planSemanticDigest' "$identity_dir/semantic.json")"
          export ATLAS_PLAN_INSTANCE_DIGEST="$(jq -er '.planInstanceDigest' "$identity_dir/instance.json")"
          export ATLAS_AUTHORITY_DIGEST="$(jq -er '.authorityDigest' "$identity_dir/verification-authority-identity.json")"
          export ATLAS_ENVIRONMENT_DIGEST="$(jq -er '.environmentDigest' "$identity_dir/protected-execution-environment-identity.json")"
          export ATLAS_E2E_SHARD='1/1'
          export ATLAS_E2E_WORKERS='1'
          export ATLAS_QUALIFICATION_PUBLICATION_HOST="$source_root"
          export ATLAS_QUALIFICATION_TRUST_JSON="$(jq -c . "$trust_path")"
          export ATLAS_EXECUTION_CONTEXT="$execution_context"
          export ATLAS_E2E_ARTIFACTS_HOST="$artifacts"
          export ATLAS_PROTECTED_TEST_LIST="$qualification_list"
          compose() { docker compose -f trusted-base/e2e/compose.protected-hosted-executor.yml -f trusted-base/e2e/compose.github-hosted.yml "$@"; }
          cleanup() { compose down -v --remove-orphans >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          cleanup
          compose config -q
          compose up -d --wait atlas-publication atlas-web
          compose build e2e
          compose run --rm e2e bash -lc 'exec ./node_modules/.bin/playwright test --config=playwright.config.mjs --test-list=/run/atlas-protected-test-list.txt --workers=1 --retries=0'

      - name: Fence live PR268 after proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/pr268-live-after.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER" > "$payload"
          node trusted-base/tools/verification/assert-current-pr-head.mjs \
            --payload "$payload" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$ATLAS_PR_NUMBER" \
            --expected-head-sha "$ATLAS_CODE_REVISION"
          test "$(jq -r '.base.sha' "$payload")" = "$ATLAS_PROTECTED_BASE_SHA"
