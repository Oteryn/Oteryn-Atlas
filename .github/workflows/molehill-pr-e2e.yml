name: Molehill specialist qualification

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose exact head requires specialist proof
        required: true
        type: string
      head_sha:
        description: Exact 40-character PR head SHA to bind the specialist evidence
        required: true
        type: string
      reason_code:
        description: Closed reason for using the specialist runner instead of GitHub-hosted verification
        required: true
        type: choice
        options:
          - user-facing-visual-review
          - windows-browser-differential
          - gpu-driver-render-truth
          - lan-publication-smoke
          - hardware-driver-reproduction
          - measured-specialist-benchmark
      required_capability:
        description: Capability that cannot be proved equivalently on the GitHub-hosted default plane
        required: true
        type: choice
        options:
          - restricted-visual
          - native-windows
          - native-gpu
          - lan-smoke
          - hardware-repro
          - specialist-benchmark

permissions:
  contents: read

concurrency:
  group: atlas-molehill-specialist-${{ inputs.pr_number }}-${{ inputs.required_capability }}
  cancel-in-progress: false

jobs:
  trust-admission:
    name: Specialist trust admission
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.trust.outputs.admitted }}
      head_sha: ${{ steps.trust.outputs.head_sha }}
      base_sha: ${{ steps.trust.outputs.base_sha }}
      head_ref: ${{ steps.trust.outputs.head_ref }}
      policy_sha: ${{ steps.trust.outputs.policy_sha }}
      resource_class: ${{ steps.trust.outputs.resource_class }}
      reason: ${{ steps.trust.outputs.reason }}
    steps:
      - name: Check out current protected-main policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Evaluate exact-head specialist exception
        id: trust
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_HEAD_SHA: ${{ inputs.head_sha }}
          REASON_CODE: ${{ inputs.reason_code }}
          REQUIRED_CAPABILITY: ${{ inputs.required_capability }}
          EVENT_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Oteryn/Oteryn-Atlas'
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$REQUESTED_HEAD_SHA" =~ ^[a-fA-F0-9]{40}$ ]]

          policy_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          test "$(git rev-parse HEAD)" = "$policy_sha"

          pr_json="$(mktemp)"
          trap 'rm -f "$pr_json"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$pr_json"
          current_head_sha="$(jq -r .head.sha "$pr_json")"
          head_repo="$(jq -r .head.repo.full_name "$pr_json")"
          head_ref="$(jq -r .head.ref "$pr_json")"
          base_ref="$(jq -r .base.ref "$pr_json")"
          base_sha="$(jq -r .base.sha "$pr_json")"
          author="$(jq -r .user.login "$pr_json")"
          author_association="$(jq -r .author_association "$pr_json")"

          case "$REQUIRED_CAPABILITY" in
            restricted-visual) resource_class=browser-full ;;
            native-windows) resource_class=browser-targeted ;;
            native-gpu) resource_class=native-gpu ;;
            lan-smoke) resource_class=browser-targeted ;;
            hardware-repro) resource_class=render-geometry ;;
            specialist-benchmark) resource_class=performance ;;
            *) echo 'Unsupported specialist capability.' >&2; exit 1 ;;
          esac

          export current_head_sha head_repo head_ref base_ref base_sha author author_association resource_class policy_sha
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { decideTrustAdmission } from './tools/verification/trust-admission.mjs';
          const result = decideTrustAdmission({
            repository: process.env.GITHUB_REPOSITORY,
            eventName: process.env.GITHUB_EVENT_NAME,
            baseRef: process.env.base_ref,
            headRepository: process.env.head_repo,
            headSha: process.env.REQUESTED_HEAD_SHA,
            currentHeadSha: process.env.current_head_sha,
            actor: process.env.EVENT_ACTOR,
            author: process.env.author,
            authorAssociation: process.env.author_association,
            resourceClass: process.env.resource_class,
            reasonCode: process.env.REASON_CODE,
            requiredCapability: process.env.REQUIRED_CAPABILITY,
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `admitted=${result.state === 'admitted'}\nhead_sha=${result.headSha ?? ''}\nbase_sha=${process.env.base_sha}\nhead_ref=${process.env.head_ref}\npolicy_sha=${process.env.policy_sha}\nresource_class=${process.env.resource_class}\nreason=${result.reason}\n`);
          if (result.state !== 'admitted') {
            console.error(`Specialist admission rejected: ${result.reason}`);
            process.exitCode = 1;
          }
          NODE

  unsupported-specialist-capability:
    name: Reject capability not implemented by Phase D
    needs: trust-admission
    if: needs.trust-admission.outputs.admitted == 'true' && inputs.required_capability != 'restricted-visual'
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed until the selected specialist lane exists
        shell: bash
        run: |
          echo "Specialist capability '${{ inputs.required_capability }}' is admitted by policy but is not implemented by the Phase D visual-evidence lane." >&2
          exit 1

  restricted-visual-e2e:
    name: Capture exact-head restricted visual evidence
    needs: trust-admission
    if: needs.trust-admission.outputs.admitted == 'true' && inputs.required_capability == 'restricted-visual'
    runs-on:
      group: atlas-runners
      labels: oteryn-atlas-pc
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      ATLAS_CODE_REVISION: ${{ needs.trust-admission.outputs.head_sha }}
      ATLAS_EXPECTED_REVISION: ${{ needs.trust-admission.outputs.head_sha }}
      ATLAS_BASE_SHA: ${{ needs.trust-admission.outputs.base_sha }}
      ATLAS_HEAD_REF: ${{ needs.trust-admission.outputs.head_ref }}
      ATLAS_POLICY_SHA: ${{ needs.trust-admission.outputs.policy_sha }}
      ATLAS_PR_NUMBER: ${{ inputs.pr_number }}
      ATLAS_SPECIALIST_REASON_CODE: ${{ inputs.reason_code }}
      ATLAS_REQUIRED_CAPABILITY: ${{ inputs.required_capability }}
      ATLAS_PUBLICATION_ORIGIN: http://192.168.1.2:8097
      ATLAS_E2E_WORKERS: '1'
      ATLAS_E2E_RESOURCE_CLASS: browser-full
      ATLAS_E2E_AUTHORITY_MODE: authoritative
      ATLAS_USER_VISUAL_EVIDENCE: '1'
      ATLAS_TRUSTED_EVIDENCE_ROOT: C:\Oteryn\evidence\atlas-specialist-e2e
    steps:
      - name: Verify Molehill runner identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'Oteryn/Oteryn-Atlas') { throw 'Unexpected repository.' }
          if ($env:RUNNER_NAME -notmatch '^oteryn-molehill-atlas(?:-[0-9]+)?$') { throw "Unexpected runner: $env:RUNNER_NAME" }
          if ($env:RUNNER_OS -ne 'Windows') { throw "Unexpected runner OS: $env:RUNNER_OS" }
          docker version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Docker is unavailable.' }

      - name: Check out exact trusted-main policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust-admission.outputs.policy_sha }}
          persist-credentials: false
          path: trusted-base

      - name: Check out exact trusted candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust-admission.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate

      - name: Reject a superseded candidate before specialist execution
        shell: powershell
        working-directory: candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $remote = ((git ls-remote --heads origin "refs/heads/$env:ATLAS_HEAD_REF") -split '\s+')[0]
          if ($remote -ne $env:ATLAS_CODE_REVISION) { throw "superseded-head remote=$remote expected=$env:ATLAS_CODE_REVISION" }
          if ((git rev-parse HEAD).Trim() -ne $env:ATLAS_CODE_REVISION) { throw 'Candidate checkout mismatch.' }
          if ((git -C ../trusted-base rev-parse HEAD).Trim() -ne $env:ATLAS_POLICY_SHA) { throw 'Trusted policy checkout mismatch.' }

      - name: Build exact trusted-main lower-bound plan
        shell: powershell
        working-directory: candidate
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/verification | Out-Null
          npm ci --prefix e2e
          $env:ATLAS_ARTIFACTS_DIR = "$PWD/artifacts/verification/playwright-list"
          $playwrightList = 'artifacts\\verification\\playwright-test-list.txt'
          cmd.exe /d /s /c "npm exec --prefix e2e -- playwright test --config=e2e/playwright.config.mjs --list > `"$playwrightList`""
          if ($LASTEXITCODE -ne 0) { throw "Playwright list enumeration failed with exit code $LASTEXITCODE." }
          node ../trusted-base/tools/verification/parse-playwright-test-list.mjs `
            artifacts/verification/playwright-test-list.txt > artifacts/verification/stable-test-ids.json
          $mergeBase = (git merge-base $env:ATLAS_CODE_REVISION $env:ATLAS_BASE_SHA).Trim()
          $env:ATLAS_MERGE_BASE = $mergeBase
          node --input-type=module - artifacts/verification/changed-files.json <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const output = execFileSync('git', ['diff', '--name-status', '-z', '--find-renames', process.env.ATLAS_MERGE_BASE, process.env.ATLAS_CODE_REVISION]);
          const fields = output.toString('utf8').split('\0');
          const changes = [];
          for (let i = 0; i < fields.length && fields[i];) {
            const status = fields[i++];
            if (/^[RC]/.test(status)) {
              const previousPath = fields[i++];
              const path = fields[i++];
              changes.push({ path, previousPath });
            } else {
              changes.push({ path: fields[i++] });
            }
          }
          fs.writeFileSync(process.argv[2], `${JSON.stringify(changes)}\n`);
          NODE
          node ../trusted-base/tools/verification/build-verification-plan.mjs `
            --changed-files artifacts/verification/changed-files.json `
            --trusted-impact ../trusted-base/tools/verification/impact-manifest.json `
            --candidate-impact tools/verification/impact-manifest.json `
            --trusted-catalog ../trusted-base/tools/verification/verification-catalog.json `
            --candidate-catalog tools/verification/verification-catalog.json `
            --repository Oteryn/Oteryn-Atlas `
            --head-sha $env:ATLAS_CODE_REVISION `
            --integration-base-sha $env:ATLAS_BASE_SHA `
            --merge-base-sha $mergeBase `
            --stable-test-ids artifacts/verification/stable-test-ids.json `
            > artifacts/verification/pr-verification-plan.json

      - name: Capture exact-head restricted visual evidence
        shell: powershell
        working-directory: candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:ATLAS_TRUSTED_EVIDENCE_ROOT (Join-Path $env:ATLAS_CODE_REVISION "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
          New-Item -ItemType Directory -Force $evidenceRoot | Out-Null
          Copy-Item artifacts/verification/pr-verification-plan.json (Join-Path $evidenceRoot 'pr-verification-plan.json') -Force
          $runMetadata = [ordered]@{
            version = 2
            repository = $env:GITHUB_REPOSITORY
            prNumber = [int]$env:ATLAS_PR_NUMBER
            headSha = $env:ATLAS_CODE_REVISION
            baseSha = $env:ATLAS_BASE_SHA
            policySha = $env:ATLAS_POLICY_SHA
            headRef = $env:ATLAS_HEAD_REF
            reasonCode = $env:ATLAS_SPECIALIST_REASON_CODE
            requiredCapability = $env:ATLAS_REQUIRED_CAPABILITY
            workflowRunId = [long]$env:GITHUB_RUN_ID
            workflowRunAttempt = [int]$env:GITHUB_RUN_ATTEMPT
          }
          $runMetadata | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $evidenceRoot 'run-metadata.json')
          $env:ATLAS_VERIFICATION_PLAN_PATH = "$PWD/artifacts/verification/pr-verification-plan.json"
          $env:ATLAS_E2E_PROJECT = "atlas-specialist-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:ATLAS_E2E_ARTIFACTS_HOST = Join-Path $evidenceRoot 'run'
          .\e2e\run.ps1
          exit $LASTEXITCODE

      - name: Prepare bounded machine metadata
        if: always()
        shell: powershell
        working-directory: candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:ATLAS_TRUSTED_EVIDENCE_ROOT (Join-Path $env:ATLAS_CODE_REVISION "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
          $runRoot = Join-Path $evidenceRoot 'run'
          $safeRoot = Join-Path $PWD 'artifacts/github-evidence'
          New-Item -ItemType Directory -Force $safeRoot | Out-Null
          $copies = @(
            @{ Source = (Join-Path $runRoot 'summary.json'); Name = 'summary.json' },
            @{ Source = (Join-Path $runRoot 'resource-admission.json'); Name = 'resource-admission.json' },
            @{ Source = (Join-Path $runRoot 'slot-lease.json'); Name = 'slot-lease.json' },
            @{ Source = (Join-Path $evidenceRoot 'pr-verification-plan.json'); Name = 'pr-verification-plan.json' },
            @{ Source = (Join-Path $evidenceRoot 'run-metadata.json'); Name = 'run-metadata.json' }
          )
          foreach ($copy in $copies) {
            if (Test-Path -LiteralPath $copy.Source) { Copy-Item -LiteralPath $copy.Source -Destination (Join-Path $safeRoot $copy.Name) -Force }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $safeRoot 'pr-verification-plan.json'))) { throw 'Bounded plan evidence is missing.' }
          Write-Output "restricted-full-frame-evidence=$evidenceRoot"

      - name: Publish bounded specialist metadata only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-molehill-specialist-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/artifacts/github-evidence/summary.json
            candidate/artifacts/github-evidence/resource-admission.json
            candidate/artifacts/github-evidence/slot-lease.json
            candidate/artifacts/github-evidence/pr-verification-plan.json
            candidate/artifacts/github-evidence/run-metadata.json
          if-no-files-found: warn
          retention-days: 7
