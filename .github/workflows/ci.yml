name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s AGENTS.md
          test ! -e __dummy__
          test -s web/proof/semantic/manifest.json
          test -s web/proof/pixels/manifest.json
          test -s web/proof/pixels/pack.rgba
          test -s SECURITY.md
          test -s .github/CODEOWNERS
          test -s docs/migration/legacy-atlas-extraction-provenance.json
          test -s tools/governance/verify_extraction_provenance.py
          if find . -type f \( -name '*.otbm' -o -name '*.otb' -o -name '*.spr' -o -name '*.dat' \) -print -quit | grep -q .; then
            echo 'Forbidden raw legacy/proprietary runtime input committed to repository.' >&2
            exit 1
          fi
          if grep -R --line-number --include='*.ts' --include='*.js' --include='*.mjs' --include='*.svelte' -E '(\.otbm|Legacy IR|world\.otbm)' src web 2>/dev/null; then
            echo 'Browser source must not reference legacy world formats.' >&2
            exit 1
          fi

      - name: Verify main-only deployment policy
        run: node --test tests/deployment-policy.mjs

      - name: Verify selective-extraction provenance
        run: python tools/governance/verify_extraction_provenance.py

  semantic-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Compile semantic and pixel-metadata tooling
        run: |
          python -m py_compile \
            tools/dyn-atlas-semantic/compiler.py \
            tools/dyn-atlas-semantic/verify.py \
            tools/dyn-atlas-semantic/self_test.py \
            tools/dyn-atlas-semantic/benchmark.py \
            tools/dyn-atlas-pixels/measure_metadata.py \
            tools/dyn-atlas-pixels/publish_store.py

      - name: Verify pinned exact-source evidence identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'sha256:d38a98acaf019b07a05c0bee922505fe4c9852b38e65644e488e92df9031da2e' docs/agents/tasks/archive/DYN-ATLAS-001-semantic-thais-z7-proof.md
          grep -q '9318268404' docs/agents/tasks/archive/DYN-ATLAS-001-semantic-thais-z7-proof.md
          grep -q 'ec05e39be62d6826d27be19ff9c33c6cba7d1c835f79d02b8ad303b073c1ef40' docs/agents/tasks/archive/DYN-ATLAS-001-semantic-thais-z7-proof.md

      - name: Run deterministic compiler synthetic and negative tests
        run: python tools/dyn-atlas-semantic/self_test.py

      - name: Validate consolidated metadata-only pixel dedupe evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/evidence/DYN-ATLAS-001-15-32-pixel-dedupe-metrics.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['version'] == 1
          assert data['source']['assetZipSha256'] == '1a6bad8b7598cd874f534cd4aae2d249fb3d9b4458b3ccfa75754f91bb27870f'
          assert data['source']['gameSemanticArtifact'] == 'sha256:d38a98acaf019b07a05c0bee922505fe4c9852b38e65644e488e92df9031da2e'
          assert data['source']['semanticSpriteSourceIds'] == 990
          assert data['source']['spriteSheetsTouched'] == 136
          assert data['pixelIdentity']['domain'] == 'OTERYN-DYN-ATLAS-PIXEL-RGBA-V0'
          assert data['dedupe']['uniquePixelBlobs'] == 987
          assert data['dedupe']['duplicateSpriteReferencesByContent'] == 3
          assert data['dedupe']['rawRgbaBytesBeforeContentDedupe'] == 7741440
          assert data['dedupe']['rawRgbaBytesAfterContentDedupe'] == 7725056
          assert data['dedupe']['rawRgbaBytesSaved'] == 16384
          assert data['measurement']['pixelBytesPublished'] is False
          PY

  browser-semantic:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run browser semantic consumer tests
        run: node --test tests/browser-semantic.mjs tests/pixel-store.mjs tests/gui-contract.mjs tests/animation-runtime.mjs

      - name: Validate static browser entry
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/app.mjs
          test -s web/style.css
          grep -q 'type="module"' web/index.html

  browser-webgl-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run real Chrome WebGL2 parity and GUI smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/tests/browser-proof.html >/dev/null && break; sleep 1; done
          rm -rf /tmp/chrome-browser-proof /tmp/chrome-app-proof /tmp/chrome-shot-proof
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --force-device-scale-factor=1 --window-size=800,600 --virtual-time-budget=30000 --user-data-dir=/tmp/chrome-browser-proof --dump-dom http://127.0.0.1:8765/tests/browser-proof.html > /tmp/browser-proof.html
          grep -q 'data-status="PASS"' /tmp/browser-proof.html
          test "$(grep -c '"maxAbs": 0' /tmp/browser-proof.html)" -eq 5
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --force-device-scale-factor=1 --window-size=1920,1080 --virtual-time-budget=30000 --user-data-dir=/tmp/chrome-app-proof --dump-dom 'http://127.0.0.1:8765/web/index.html?x=32377&y=32238&floor=-7&zoom=2' > /tmp/app-dom.html
          grep -q 'VERIFIED' /tmp/app-dom.html
          grep -q 'WEBGL2' /tmp/app-dom.html
          grep -q '>30 / 30<' /tmp/app-dom.html
          grep -q '<strong id="diag-draws">1</strong>' /tmp/app-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --hide-scrollbars --force-device-scale-factor=1 --window-size=1920,1080 --virtual-time-budget=30000 --user-data-dir=/tmp/chrome-shot-proof --screenshot=/tmp/gui.png 'http://127.0.0.1:8765/web/index.html?x=32377&y=32238&floor=-7&zoom=2'
          python - <<'PY'
          import struct
          from pathlib import Path
          data = Path('/tmp/gui.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', data[16:24]) == (1920, 1080)
          PY

  project:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run project checks when package exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if [ -f pnpm-lock.yaml ]; then
              corepack enable
              pnpm install --frozen-lockfile
              pnpm run check
              pnpm run test
              pnpm run build
            elif [ -f package-lock.json ]; then
              npm ci
              npm run check
              npm test
              npm run build
            else
              echo 'package.json exists without a supported lockfile' >&2
              exit 1
            fi
          fi

  verification-node:
    name: Deterministic verification contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ATLAS_CODE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact Atlas candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run deterministic Atlas verification suite
        shell: bash
        run: |
          set -uo pipefail
          test "$(git rev-parse HEAD)" = "$ATLAS_CODE_REVISION"
          mkdir -p artifacts/verification
          files=(
            tests/animation-runtime.mjs
            tests/browser-semantic.mjs
            tests/deployment-policy.mjs
            tests/gui-contract.mjs
            tests/npc-markers.mjs
            tests/pixel-store.mjs
            tests/semantic-search.mjs
            tests/semantic-search-creatures.mjs
            tests/synology-live-workflow.mjs
            tests/fullworld-layers/*.test.mjs
            tests/fullworld-runtime/*.test.mjs
            tests/properties/*.test.mjs
            tests/verification/*.test.mjs
          )
          set +e
          node --test "${files[@]}" 2>&1 | tee artifacts/verification/node-tests.log
          rc="${PIPESTATUS[0]}"
          set -e
          python - "$rc" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          rc = int(sys.argv[1])
          evidence = {
              'version': 1,
              'status': 'pass' if rc == 0 else 'fail',
              'atlasRevision': os.environ['ATLAS_CODE_REVISION'],
              'suite': 'deterministic-node',
              'exitCode': rc,
              'log': 'node-tests.log',
          }
          Path('artifacts/verification/node-summary.json').write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          PY
          exit "$rc"

      - name: Publish deterministic verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-verification-node-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verification/
          if-no-files-found: error
          retention-days: 14

  verification-browser:
    name: Full Docker Playwright qualification
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: atlas-runners
      labels: oteryn-atlas
    timeout-minutes: 30
    concurrency:
      group: atlas-synology-live-acceptance
      cancel-in-progress: false
    env:
      ATLAS_CODE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      ATLAS_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      ATLAS_PUBLICATION_ORIGIN: http://192.168.1.2:8097
      ATLAS_E2E_WORKERS: '1'
      ATLAS_E2E_PROJECT: atlas-required-${{ github.run_id }}-${{ github.run_attempt }}
      ATLAS_E2E_ARTIFACTS_HOST: ../artifacts/e2e/required
    steps:
      - name: Verify immutable Atlas runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'Oteryn/Oteryn-Atlas'
          test "${RUNNER_SCOPE:-}" = organization
          test "${RUNNER_GROUP:-}" = atlas-runners
          test "${RUNNER_NAME:-}" = oteryn-synology-atlas
          test "${RUNNER_LABELS:-}" = oteryn-atlas
          test -S /var/run/docker.sock
          test ! -e /var/lib/oteryn-staging-state
          grep -F '"agentName": "oteryn-synology-atlas"' /runner/.runner
          grep -F '"poolName": "atlas-runners"' /runner/.runner
          grep -F '"gitHubUrl": "https://github.com/Oteryn"' /runner/.runner

      - name: Check out exact Atlas candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run exact-head read-only Docker Playwright suite
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ATLAS_CODE_REVISION"
          mkdir -p artifacts/e2e/required
          ./e2e/run.sh

      - name: Publish bounded Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-verification-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/e2e/required/
          if-no-files-found: error
          retention-days: 14

  atlas-gate:
    name: atlas-gate
    if: ${{ always() }}
    needs:
      - repository-contract
      - semantic-proof
      - browser-semantic
      - browser-webgl-proof
      - project
      - verification-node
      - verification-browser
    runs-on: ubuntu-24.04
    steps:
      - name: Require all Atlas CI components
        shell: bash
        env:
          REPOSITORY_CONTRACT: ${{ needs.repository-contract.result }}
          SEMANTIC_PROOF: ${{ needs.semantic-proof.result }}
          BROWSER_SEMANTIC: ${{ needs.browser-semantic.result }}
          BROWSER_WEBGL_PROOF: ${{ needs.browser-webgl-proof.result }}
          PROJECT: ${{ needs.project.result }}
          VERIFICATION_NODE: ${{ needs.verification-node.result }}
          VERIFICATION_BROWSER: ${{ needs.verification-browser.result }}
        run: |
          set -euo pipefail
          for result in "$REPOSITORY_CONTRACT" "$SEMANTIC_PROOF" "$BROWSER_SEMANTIC" "$BROWSER_WEBGL_PROOF" "$PROJECT" "$VERIFICATION_NODE" "$VERIFICATION_BROWSER"; do
            test "$result" = success
          done
