name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s AGENTS.md
          test ! -e __dummy__
          test -s web/proof/semantic/manifest.json
          test -s web/proof/pixels/manifest.json
          test -s web/proof/pixels/pack.rgba
          test -s SECURITY.md
          test -s .github/CODEOWNERS
          test -s docs/migration/legacy-atlas-extraction-provenance.json
          test -s tools/governance/verify_extraction_provenance.py
          if find . -type f \( -name '*.otbm' -o -name '*.otb' -o -name '*.spr' -o -name '*.dat' \) -print -quit | grep -q .; then
            echo 'Forbidden raw legacy/proprietary runtime input committed to repository.' >&2
            exit 1
          fi
          if grep -R --line-number --include='*.ts' --include='*.js' --include='*.mjs' --include='*.svelte' -E '(\.otbm|Legacy IR|world\.otbm)' src web 2>/dev/null; then
            echo 'Browser source must not reference legacy world formats.' >&2
            exit 1
          fi

      - name: Verify main-only deployment policy
        run: node --test tests/deployment-policy.mjs

      - name: Verify selective-extraction provenance
        run: python tools/governance/verify_extraction_provenance.py

  semantic-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Compile semantic and pixel-metadata tooling
        run: |
          python -m py_compile \
            tools/dyn-atlas-semantic/compiler.py \
            tools/dyn-atlas-semantic/verify.py \
            tools/dyn-atlas-semantic/self_test.py \
            tools/dyn-atlas-semantic/benchmark.py \
            tools/dyn-atlas-pixels/measure_metadata.py \
            tools/dyn-atlas-pixels/publish_store.py

      - name: Verify pinned exact-source evidence identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'sha256:d38a98acaf019b07a05c0bee922505fe4c9852b38e65644e488e92df9031da2e' docs/agents/tasks/archive/DYN-ATLAS-001-semantic-thais-z7-proof.md
          grep -q '9318268404' docs/agents/tasks/archive/DYN-ATLAS-001-semantic-thais-z7-proof.md
          grep -q 'ec05e39be62d6826d27be19ff9c33c6cba7d1c835f79d02b8ad303b073c1ef40' docs/agents/tasks/archive/DYN-ATLAS-001-semantic-thais-z7-proof.md

      - name: Run deterministic compiler synthetic and negative tests
        run: python tools/dyn-atlas-semantic/self_test.py

      - name: Validate consolidated metadata-only pixel dedupe evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/evidence/DYN-ATLAS-001-15-32-pixel-dedupe-metrics.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['version'] == 1
          assert data['source']['assetZipSha256'] == '1a6bad8b7598cd874f534cd4aae2d249fb3d9b4458b3ccfa75754f91bb27870f'
          assert data['source']['gameSemanticArtifact'] == 'sha256:d38a98acaf019b07a05c0bee922505fe4c9852b38e65644e488e92df9031da2e'
          assert data['source']['semanticSpriteSourceIds'] == 990
          assert data['source']['spriteSheetsTouched'] == 136
          assert data['pixelIdentity']['domain'] == 'OTERYN-DYN-ATLAS-PIXEL-RGBA-V0'
          assert data['dedupe']['uniquePixelBlobs'] == 987
          assert data['dedupe']['duplicateSpriteReferencesByContent'] == 3
          assert data['dedupe']['rawRgbaBytesBeforeContentDedupe'] == 7741440
          assert data['dedupe']['rawRgbaBytesAfterContentDedupe'] == 7725056
          assert data['dedupe']['rawRgbaBytesSaved'] == 16384
          assert data['measurement']['pixelBytesPublished'] is False
          PY

  browser-semantic:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run browser semantic consumer tests
        run: node --test tests/browser-semantic.mjs tests/pixel-store.mjs tests/gui-contract.mjs tests/animation-runtime.mjs

      - name: Validate static browser entry
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/app.mjs
          test -s web/style.css
          grep -q 'type="module"' web/index.html

  browser-webgl-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run real Chrome WebGL2 parity and GUI smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/tests/browser-proof.html >/dev/null && break; sleep 1; done
          rm -rf /tmp/chrome-browser-proof /tmp/chrome-app-proof /tmp/chrome-shot-proof
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --force-device-scale-factor=1 --window-size=800,600 --virtual-time-budget=30000 --user-data-dir=/tmp/chrome-browser-proof --dump-dom http://127.0.0.1:8765/tests/browser-proof.html > /tmp/browser-proof.html
          grep -q 'data-status="PASS"' /tmp/browser-proof.html
          test "$(grep -c '"maxAbs": 0' /tmp/browser-proof.html)" -eq 5
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --force-device-scale-factor=1 --window-size=1920,1080 --virtual-time-budget=30000 --user-data-dir=/tmp/chrome-app-proof --dump-dom 'http://127.0.0.1:8765/web/index.html?x=32377&y=32238&floor=-7&zoom=2' > /tmp/app-dom.html
          grep -q 'VERIFIED' /tmp/app-dom.html
          grep -q 'WEBGL2' /tmp/app-dom.html
          grep -q '>30 / 30<' /tmp/app-dom.html
          grep -q '<strong id="diag-draws">1</strong>' /tmp/app-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --hide-scrollbars --force-device-scale-factor=1 --window-size=1920,1080 --virtual-time-budget=30000 --user-data-dir=/tmp/chrome-shot-proof --screenshot=/tmp/gui.png 'http://127.0.0.1:8765/web/index.html?x=32377&y=32238&floor=-7&zoom=2'
          python - <<'PY'
          import struct
          from pathlib import Path
          data = Path('/tmp/gui.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', data[16:24]) == (1920, 1080)
          PY

  project:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run project checks when package exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if [ -f pnpm-lock.yaml ]; then
              corepack enable
              pnpm install --frozen-lockfile
              pnpm run check
              pnpm run test
              pnpm run build
            elif [ -f package-lock.json ]; then
              npm ci
              npm run check
              npm test
              npm run build
            else
              echo 'package.json exists without a supported lockfile' >&2
              exit 1
            fi
          fi

  verification-node:
    name: Deterministic verification contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ATLAS_CODE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact Atlas candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run deterministic Atlas verification suite
        shell: bash
        run: |
          set -uo pipefail
          test "$(git rev-parse HEAD)" = "$ATLAS_CODE_REVISION"
          mkdir -p artifacts/verification
          files=(
            tests/animation-runtime.mjs
            tests/browser-semantic.mjs
            tests/deployment-policy.mjs
            tests/creature-presentation-geometry.mjs
            tests/creature-interaction.mjs
            tests/creature-interaction-target.mjs
            tests/map-activation.mjs
            tests/creature-map-activation-contract.mjs
            tests/creature-interaction-runtime-contract.mjs
            tests/creature-gameplay-profiles.mjs
            tests/creature-inspector-state.mjs
            tests/creature-gameplay-model.mjs
            tests/creature-gameplay-runtime-contract.mjs
            tests/gui-contract.mjs
            tests/npc-markers.mjs
            tests/pixel-store.mjs
            tests/semantic-search.mjs
            tests/semantic-search-creatures.mjs
            tests/synology-live-workflow.mjs
            tests/fullworld-layers/*.test.mjs
            tests/fullworld-runtime/*.test.mjs
            tests/properties/*.test.mjs
            tests/verification/*.test.mjs
          )
          set +e
          node --test "${files[@]}" 2>&1 | tee artifacts/verification/node-tests.log
          rc="${PIPESTATUS[0]}"
          set -e
          python - "$rc" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          rc = int(sys.argv[1])
          evidence = {
              'version': 1,
              'status': 'pass' if rc == 0 else 'fail',
              'atlasRevision': os.environ['ATLAS_CODE_REVISION'],
              'suite': 'deterministic-node',
              'exitCode': rc,
              'log': 'node-tests.log',
          }
          Path('artifacts/verification/node-summary.json').write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          PY
          exit "$rc"

      - name: Publish deterministic verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-verification-node-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verification/
          if-no-files-found: error
          retention-days: 14

  change-classification:
    name: Classify PR verification risk
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      requires_e2e: ${{ steps.classify.outputs.requires_e2e }}
      shadow_plan_digest: ${{ steps.classify.outputs.shadow_plan_digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      ATLAS_CODE_REVISION: ${{ github.event.pull_request.head.sha }}
      ATLAS_INTEGRATION_BASE_REF: ${{ github.event.pull_request.base.ref }}
      ATLAS_PR_NUMBER: ${{ github.event.pull_request.number }}
      ATLAS_CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
    steps:
      - name: Check out exact Atlas candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify exact PR changed paths
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ATLAS_CODE_REVISION"
          rows="$(mktemp)"
          paths="$(mktemp)"
          changes="$(mktemp)"
          git_changes="$(mktemp)"
          trusted_impact="$(mktemp)"
          trusted_catalog="$(mktemp)"
          trap 'rm -f "$rows" "$paths" "$changes" "$git_changes" "$trusted_impact" "$trusted_catalog"' EXIT
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER/files?per_page=100" \
            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' > "$rows"
          actual_count="$(wc -l < "$rows" | tr -d '[:space:]')"
          test "$actual_count" = "$ATLAS_CHANGED_FILE_COUNT"
          while IFS=$'\t' read -r filename previous_filename; do
            test -n "$filename"
            printf '%s\n' "$filename" >> "$paths"
            [[ -n "$previous_filename" ]] && printf '%s\n' "$previous_filename" >> "$paths"
          done < "$rows"
          git fetch --no-tags origin "$ATLAS_INTEGRATION_BASE_REF"
          integration_base_sha="$(git rev-parse "origin/$ATLAS_INTEGRATION_BASE_REF")"
          merge_base_sha="$(git merge-base "$ATLAS_CODE_REVISION" "$integration_base_sha")"
          test -n "$merge_base_sha"
          git diff --name-status -z --find-renames "$merge_base_sha" "$ATLAS_CODE_REVISION" > "$git_changes"
          if git cat-file -e "$integration_base_sha:tools/verification/impact-manifest.json" 2>/dev/null && \
             git cat-file -e "$integration_base_sha:tools/verification/verification-catalog.json" 2>/dev/null; then
            git show "$integration_base_sha:tools/verification/impact-manifest.json" > "$trusted_impact"
            git show "$integration_base_sha:tools/verification/verification-catalog.json" > "$trusted_catalog"
          else
            printf '%s\n' '{"schemaVersion":1,"entries":[]}' > "$trusted_impact"
            printf '%s\n' '{"schemaVersion":1,"groups":{"deterministic.core":{"specs":["tests/verification/*.test.mjs"],"projects":[],"resourceClass":"cpu-light","evidence":"machine-summary"},"e2e.full":{"specs":["e2e/tests/*.spec.mjs"],"projects":["desktop-chromium","mobile-chromium"],"resourceClass":"browser-full","evidence":"restricted-visual-review"}}}' > "$trusted_catalog"
          fi
          node --input-type=module - "$rows" "$git_changes" "$changes" <<'NODE'
          import fs from 'node:fs';
          const [rowsPath, gitChangesPath, changesPath] = process.argv.slice(2);
          const rows = fs.readFileSync(rowsPath, 'utf8').split(/\r?\n/).filter(Boolean);
          const changes = rows.map((row) => {
            const fields = row.split('\t');
            if (fields.length !== 2 || !fields[0]) throw new Error('Malformed GitHub changed-file evidence.');
            return fields[1] ? { path: fields[0], previousPath: fields[1] } : { path: fields[0] };
          });
          const fields = fs.readFileSync(gitChangesPath, 'utf8').split('\0');
          fields.pop();
          const gitChanges = [];
          while (fields.length) {
            const status = fields.shift();
            if (!status) throw new Error('Malformed merge-base diff evidence.');
            if (status.startsWith('R')) {
              const previousPath = fields.shift();
              const path = fields.shift();
              if (!previousPath || !path) throw new Error('Malformed renamed path evidence.');
              gitChanges.push({ path, previousPath });
            } else {
              const path = fields.shift();
              if (!path) throw new Error('Malformed changed path evidence.');
              gitChanges.push({ path });
            }
          }
          const canonical = (items) => JSON.stringify(items
            .map((item) => ({ path: item.path, previousPath: item.previousPath ?? null }))
            .sort((left, right) => `${left.path}\0${left.previousPath}`.localeCompare(`${right.path}\0${right.previousPath}`)));
          if (canonical(changes) !== canonical(gitChanges)) throw new Error('GitHub changed-file evidence does not match exact merge-base diff.');
          fs.writeFileSync(changesPath, `${JSON.stringify(changes)}\n`);
          NODE
          mkdir -p artifacts/verification
          npm ci --prefix e2e
          ATLAS_ARTIFACTS_DIR="$PWD/artifacts/verification/playwright-list" npm exec --prefix e2e -- playwright test --config=e2e/playwright.config.mjs --list > artifacts/verification/playwright-test-list.txt
          node tools/verification/parse-playwright-test-list.mjs artifacts/verification/playwright-test-list.txt > artifacts/verification/stable-test-ids.json
          node tools/verification/build-verification-plan.mjs \
            --changed-files "$changes" \
            --trusted-impact "$trusted_impact" \
            --candidate-impact tools/verification/impact-manifest.json \
            --trusted-catalog "$trusted_catalog" \
            --candidate-catalog tools/verification/verification-catalog.json \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$ATLAS_CODE_REVISION" \
            --integration-base-sha "$integration_base_sha" \
            --merge-base-sha "$merge_base_sha" \
            --stable-test-ids artifacts/verification/stable-test-ids.json \
            > artifacts/verification/shadow-verification-plan.json
          node --input-type=module - artifacts/verification/shadow-verification-plan.json "$GITHUB_OUTPUT" <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const [planPath, outputPath] = process.argv.slice(2);
          const raw = fs.readFileSync(planPath, 'utf8');
          const plan = JSON.parse(raw);
          if (!plan.shadowOnly || plan.retryPolicy?.retries !== 0) throw new Error('Shadow plan contract is invalid.');
          const digest = `sha256:${crypto.createHash('sha256').update(raw).digest('hex')}`;
          fs.appendFileSync(outputPath, `shadow_plan_digest=${digest}\n`);
          NODE
          node tools/verification/classify-pr-changes.mjs < "$paths" | tee -a "$GITHUB_OUTPUT"

      - name: Publish shadow verification plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-shadow-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verification/shadow-verification-plan.json
          if-no-files-found: error
          retention-days: 14

  verification-browser:
    name: Protected Hosted Playwright evidence
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.change-classification.outputs.requires_e2e == 'true'
    needs:
      - verification-node
      - change-classification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      ATLAS_CODE_REVISION: ${{ github.event.pull_request.head.sha }}
      ATLAS_PROTECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ATLAS_PR_NUMBER: ${{ github.event.pull_request.number }}
      ATLAS_LEGACY_CUTOVER_BASE_SHA: e31015d0880e9f81a4b96f990658490af45e8fa6
      ATLAS_LEGACY_CUTOVER_HEAD_REF: feat/issue-179-legacy-transition-qualifier
    steps:
      - name: Check out exact Atlas candidate gate authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact protected hosted fan-in and lifecycle state bytes
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Oteryn/Oteryn-Atlas
          test "$(git rev-parse HEAD)" = "$ATLAS_CODE_REVISION"
          if [[ "$ATLAS_PROTECTED_BASE_SHA" == "$ATLAS_LEGACY_CUTOVER_BASE_SHA" ]]; then
            work=artifacts/protected-hosted-fan-in
            mkdir -p "$work"
            live_pr="$work/live-pr.json"
            changed_files="$work/legacy-cutover-changed-files.txt"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER" > "$live_pr"
            test "$(jq -r '.head.ref' "$live_pr")" = "$ATLAS_LEGACY_CUTOVER_HEAD_REF"
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER/files?per_page=100" \
              --jq '.[].filename' | sort > "$changed_files"
            runs="$work/legacy-transition-runs.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/legacy-molehill-transition-qualification.yml/runs?event=pull_request&branch=$ATLAS_LEGACY_CUTOVER_HEAD_REF&per_page=100" > "$runs"
            mapfile -t legacy_run_ids < <(node --input-type=module - "$runs" <<'NODE'
          import fs from 'node:fs';
          const runs = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).workflow_runs ?? [];
          const ids = runs
            .filter((run) => run.status === 'completed'
              && run.path === '.github/workflows/legacy-molehill-transition-qualification.yml'
              && run.event === 'pull_request'
              && run.head_branch === process.env.ATLAS_LEGACY_CUTOVER_HEAD_REF
              && run.head_sha === process.env.ATLAS_CODE_REVISION
              && run.repository?.full_name === process.env.GITHUB_REPOSITORY
              && Number(run.run_attempt) === 1)
            .map((run) => Number(run.id))
            .filter((id) => Number.isSafeInteger(id) && id > 0)
            .sort((left, right) => right - left);
          for (const id of ids) process.stdout.write(`${id}\n`);
          NODE
            )
            selected_legacy_run=''
            for legacy_run_id in "${legacy_run_ids[@]}"; do
              run_json="$work/legacy-transition-run-$legacy_run_id.json"
              jobs_json="$work/legacy-transition-jobs-$legacy_run_id.json"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$legacy_run_id" > "$run_json"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$legacy_run_id/jobs?per_page=100" > "$jobs_json"
              if node --input-type=module - "$run_json" "$jobs_json" "$live_pr" "$changed_files" "$work/protected-hosted-gate-validation.json" <<'NODE'
          import fs from 'node:fs';
          import { validateLegacyTransitionBootstrapGate } from './tools/verification/protected-hosted-gate.mjs';
          const [runPath, jobsPath, livePrPath, changedFilesPath, outputPath] = process.argv.slice(2);
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const changedFiles = fs.readFileSync(changedFilesPath, 'utf8').split(/\r?\n/).filter(Boolean);
          const result = validateLegacyTransitionBootstrapGate({
            producerRun: read(runPath),
            producerJobs: read(jobsPath),
            livePr: read(livePrPath),
            changedFiles,
            expectedRepository: process.env.GITHUB_REPOSITORY,
            expectedPrNumber: Number(process.env.ATLAS_PR_NUMBER),
            expectedCandidateHeadSha: process.env.ATLAS_CODE_REVISION,
            expectedProtectedBaseSha: process.env.ATLAS_PROTECTED_BASE_SHA,
          });
          fs.writeFileSync(outputPath, `${JSON.stringify(result, null, 2)}\n`);
          NODE
              then
                selected_legacy_run="$legacy_run_id"
                break
              fi
            done
            [[ "$selected_legacy_run" =~ ^[1-9][0-9]*$ ]]
            printf 'producer_run_id=%s\nartifact_name=%s\n' \
              "$selected_legacy_run" 'legacy-transition-heavy-proof' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected_name="protected-hosted-fan-in-$ATLAS_PROTECTED_BASE_SHA-$ATLAS_CODE_REVISION"
          work=artifacts/protected-hosted-fan-in
          mkdir -p "$work"
          live_pr="$work/live-pr.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER" > "$live_pr"

          accept_generic_repair() {
            promotion_status="$work/protected-product-qualification-status.json"
            gh api "repos/$GITHUB_REPOSITORY/commits/$ATLAS_CODE_REVISION/statuses?per_page=100" \
              --jq '[.[] | select(.context == "atlas-protected-product-qualification" and .state == "success")][0] // empty' > "$promotion_status" || return 1
            [[ -s "$promotion_status" ]] || return 1
            promotion_run_id="$(node --input-type=module - "$promotion_status" "$GITHUB_REPOSITORY" <<'NODE'
          import fs from 'node:fs';
          const [statusPath, repository] = process.argv.slice(2);
          const status = JSON.parse(fs.readFileSync(statusPath, 'utf8'));
          const escaped = repository.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const match = String(status.target_url ?? '').match(new RegExp(`^https://github\\.com/${escaped}/actions/runs/([1-9][0-9]*)$`));
          if (match) process.stdout.write(match[1]);
          NODE
            )"
            [[ "$promotion_run_id" =~ ^[1-9][0-9]*$ ]] || return 1
            promotion_run="$work/protected-product-qualification-run.json"
            promotion_jobs="$work/protected-product-qualification-jobs.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$promotion_run_id" > "$promotion_run" || return 1
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$promotion_run_id/jobs?per_page=100" > "$promotion_jobs" || return 1
            if node --input-type=module - \
              "$promotion_status" "$promotion_run" "$promotion_jobs" "$live_pr" \
              "$work/protected-hosted-gate-validation.json" <<'NODE'
          import fs from 'node:fs';
          import { validateProtectedProductQualificationGate } from './tools/verification/protected-hosted-gate.mjs';
          const [statusPath, runPath, jobsPath, livePrPath, outputPath] = process.argv.slice(2);
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const result = validateProtectedProductQualificationGate({
            status: read(statusPath),
            producerRun: read(runPath),
            producerJobs: read(jobsPath),
            livePr: read(livePrPath),
            expectedRepository: process.env.GITHUB_REPOSITORY,
            expectedPrNumber: Number(process.env.ATLAS_PR_NUMBER),
            expectedCandidateHeadSha: process.env.ATLAS_CODE_REVISION,
            expectedProtectedBaseSha: process.env.ATLAS_PROTECTED_BASE_SHA,
          });
          fs.writeFileSync(outputPath, `${JSON.stringify(result, null, 2)}\n`);
          NODE
            then
              printf 'producer_run_id=%s\nartifact_name=%s\n' \
                "$promotion_run_id" 'protected-product-qualification' >> "$GITHUB_OUTPUT"
              return 0
            fi
            return 1
          }

          selected_artifact_id=''
          selected_run_id=''
          selected_run_json=''
          for attempt in {1..169}; do
            if accept_generic_repair; then
              exit 0
            fi
            payload="$RUNNER_TEMP/protected-hosted-artifacts.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$expected_name&per_page=100" > "$payload"
            mapfile -t candidates < <(node --input-type=module - "$payload" "$expected_name" <<'NODE'
          import fs from 'node:fs';
          const [payloadPath, expectedName] = process.argv.slice(2);
          const artifacts = (JSON.parse(fs.readFileSync(payloadPath, 'utf8')).artifacts ?? [])
            .filter((artifact) => artifact.expired === false
              && artifact.name === expectedName
              && Number.isSafeInteger(artifact.id)
              && Number.isSafeInteger(artifact.workflow_run?.id))
            .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
          for (const artifact of artifacts) process.stdout.write(`${artifact.id}\t${artifact.workflow_run.id}\n`);
          NODE
            )
            for candidate in "${candidates[@]}"; do
              IFS=$'\t' read -r artifact_id producer_run_id <<< "$candidate"
              run_json="$RUNNER_TEMP/protected-hosted-run-$producer_run_id.json"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$producer_run_id" > "$run_json"
              if node --input-type=module - "$run_json" <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (run.status !== 'completed' || run.conclusion !== 'success'
            || run.path !== '.github/workflows/protected-hosted-executor.yml'
            || run.event !== 'workflow_run'
            || run.repository?.full_name !== process.env.GITHUB_REPOSITORY) process.exit(1);
          NODE
              then
                selected_artifact_id="$artifact_id"
                selected_run_id="$producer_run_id"
                selected_run_json="$run_json"
                break 2
              fi
            done
            (( attempt < 169 )) && sleep 20
          done
          [[ "$selected_artifact_id" =~ ^[0-9]+$ && "$selected_run_id" =~ ^[0-9]+$ ]]
          cp "$selected_run_json" "$work/producer-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$selected_artifact_id/zip" > "$work/artifact.zip"
          unzip -q "$work/artifact.zip" -d "$work/unpacked"
          mapfile -t fan_in_files < <(find "$work/unpacked" -type f -name protected-hosted-fan-in.json -print)
          mapfile -t state_files < <(find "$work/unpacked" -type f -name protected-verification-state.json -print)
          test "${#fan_in_files[@]}" -eq 1
          test "${#state_files[@]}" -eq 1

          node --input-type=module - \
            "${fan_in_files[0]}" "${state_files[0]}" "$live_pr" "$work/producer-run.json" \
            "$expected_name" "$work/protected-hosted-gate-validation.json" <<'NODE'
          import fs from 'node:fs';
          import { validateProtectedHostedGate } from './tools/verification/protected-hosted-gate.mjs';
          const [payloadPath, statePath, livePrPath, runPath, artifactName, outputPath] = process.argv.slice(2);
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const result = validateProtectedHostedGate({
            payload: read(payloadPath),
            state: read(statePath),
            livePr: read(livePrPath),
            producerRun: read(runPath),
            expectedRepository: process.env.GITHUB_REPOSITORY,
            expectedPrNumber: Number(process.env.ATLAS_PR_NUMBER),
            expectedCandidateHeadSha: process.env.ATLAS_CODE_REVISION,
            expectedProtectedBaseSha: process.env.ATLAS_PROTECTED_BASE_SHA,
            expectedArtifactName: artifactName,
            now: new Date().toISOString(),
          });
          fs.writeFileSync(outputPath, `${JSON.stringify(result, null, 2)}\n`);
          NODE
          printf 'producer_run_id=%s\nartifact_id=%s\nartifact_name=%s\n' \
            "$selected_run_id" "$selected_artifact_id" "$expected_name" >> "$GITHUB_OUTPUT"

      - name: Publish independently validated current-head hosted gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-hosted-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/protected-hosted-fan-in/protected-hosted-gate-validation.json
          if-no-files-found: error
          retention-days: 14

  atlas-gate:
    name: atlas-gate
    if: ${{ always() }}
    needs:
      - repository-contract
      - semantic-proof
      - browser-semantic
      - browser-webgl-proof
      - project
      - verification-node
      - change-classification
      - verification-browser
    runs-on: ubuntu-24.04
    steps:
      - name: Require all Atlas CI components
        shell: bash
        env:
          REPOSITORY_CONTRACT: ${{ needs.repository-contract.result }}
          SEMANTIC_PROOF: ${{ needs.semantic-proof.result }}
          BROWSER_SEMANTIC: ${{ needs.browser-semantic.result }}
          BROWSER_WEBGL_PROOF: ${{ needs.browser-webgl-proof.result }}
          PROJECT: ${{ needs.project.result }}
          VERIFICATION_NODE: ${{ needs.verification-node.result }}
          CHANGE_CLASSIFICATION: ${{ needs.change-classification.result }}
          DOCS_ONLY: ${{ needs.change-classification.outputs.docs_only }}
          REQUIRES_E2E: ${{ needs.change-classification.outputs.requires_e2e }}
          VERIFICATION_BROWSER: ${{ needs.verification-browser.result }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          for result in "$REPOSITORY_CONTRACT" "$SEMANTIC_PROOF" "$BROWSER_SEMANTIC" "$BROWSER_WEBGL_PROOF" "$PROJECT" "$VERIFICATION_NODE"; do
            test "$result" = success
          done
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            test "$CHANGE_CLASSIFICATION" = success
            case "$REQUIRES_E2E:$DOCS_ONLY" in
              false:true) test "$VERIFICATION_BROWSER" = skipped ;;
              true:false) test "$VERIFICATION_BROWSER" = success ;;
              *)
                echo "Invalid PR verification classification: requires_e2e=$REQUIRES_E2E docs_only=$DOCS_ONLY" >&2
                exit 1
                ;;
            esac
          else
            test "$CHANGE_CLASSIFICATION" = skipped
            test "$VERIFICATION_BROWSER" = skipped
          fi
