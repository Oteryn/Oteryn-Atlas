name: Protected hosted compose promotion

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: atlas-protected-hosted-compose-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  targeted-compatibility:
    name: Publish targeted protected hosted compose compatibility evidence
    if: >-
      github.event.label.name == 'atlas-legacy-transition-qualification' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/issue-179-protected-hosted-compose-promotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      ATLAS_PR_NUMBER: ${{ github.event.pull_request.number }}
      ATLAS_CODE_REVISION: ${{ github.event.pull_request.head.sha }}
      ATLAS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ATLAS_CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
    steps:
      - name: Require exact six-file compose promotion delta
        shell: bash
        run: |
          set -euo pipefail
          rows="$(mktemp)"
          expected="$(mktemp)"
          trap 'rm -f "$rows" "$expected"' EXIT
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' | sort > "$rows"
          test "$(wc -l < "$rows" | tr -d '[:space:]')" = "$ATLAS_CHANGED_FILE_COUNT"
          printf '%s\n' \
            '.github/workflows/protected-hosted-compose-promotion.yml' \
            'e2e/compose.github-hosted.yml' \
            'e2e/compose.protected-hosted-executor.yml' \
            'e2e/nginx/qualification-publication.conf' \
            'tests/verification/protected-hosted-compose-promotion-workflow-contract.test.mjs' \
            'tests/verification/protected-hosted-compose-promotion.test.mjs' \
            > "$expected"
          diff -u "$expected" "$rows"

      - name: Check out exact protected base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: trusted-base

      - name: Check out exact candidate head as inert config data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate

      - name: Fence current PR head before hosted browser proof
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/atlas-hosted-compose-promotion-before.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER" > "$payload"
          node trusted-base/tools/verification/assert-current-pr-head.mjs \
            --payload "$payload" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$ATLAS_PR_NUMBER" \
            --expected-head-sha "$ATLAS_CODE_REVISION"
          test "$(git -C candidate rev-parse HEAD)" = "$ATLAS_CODE_REVISION"
          test "$(git -C trusted-base rev-parse HEAD)" = "$ATLAS_BASE_SHA"

      - name: Prove protected trust bootstrap with one zero-retry browser test
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            candidate/tests/verification/protected-hosted-compose-promotion.test.mjs \
            candidate/tests/verification/protected-hosted-compose-promotion-workflow-contract.test.mjs

          source_root="$RUNNER_TEMP/atlas-compose-publication"
          artifacts_root="$RUNNER_TEMP/atlas-compose-artifacts"
          trust_path="$RUNNER_TEMP/atlas-compose-trust.json"
          test_list="$RUNNER_TEMP/atlas-protected-test-list.txt"
          rm -rf "$source_root" "$artifacts_root"
          mkdir -p "$artifacts_root"
          : > "$test_list"

          SOURCE_ROOT="$source_root" TRUST_PATH="$trust_path" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildQualificationWorld, qualificationTrustDescriptor, verifyQualificationWorld } from './trusted-base/tools/verification/qualification-world.mjs';

          await buildQualificationWorld(process.env.SOURCE_ROOT);
          const manifest = await verifyQualificationWorld(process.env.SOURCE_ROOT);
          fs.writeFileSync(process.env.TRUST_PATH, `${JSON.stringify(qualificationTrustDescriptor(manifest))}\n`);
          NODE

          export ATLAS_VERIFICATION_PLAN_SHA256="sha256:$(printf '1%.0s' {1..64})"
          export ATLAS_E2E_SHARD='1/1'
          export ATLAS_QUALIFICATION_PUBLICATION_HOST="$source_root"
          export ATLAS_QUALIFICATION_TRUST_JSON="$(cat "$trust_path")"
          export ATLAS_EXECUTION_CONTEXT="$PWD/trusted-base"
          export ATLAS_E2E_ARTIFACTS_HOST="$artifacts_root"
          export ATLAS_PROTECTED_TEST_LIST="$test_list"
          export COMPOSE_PROJECT_NAME="atlas-compose-promotion-$GITHUB_RUN_ID"

          compose() {
            docker compose \
              -f candidate/e2e/compose.protected-hosted-executor.yml \
              -f candidate/e2e/compose.github-hosted.yml \
              "$@"
          }
          cleanup() {
            compose down -v --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          compose config -q
          if ! compose up -d --wait atlas-publication atlas-web; then
            compose ps -a || true
            compose logs --no-color atlas-publication-ready atlas-publication atlas-web-ready atlas-web || true
            exit 1
          fi

          publication_id="$(compose ps -q atlas-publication)"
          web_id="$(compose ps -q atlas-web)"
          test -n "$publication_id"
          test -n "$web_id"
          docker exec "$web_id" grep -Fq '__OTERYN_ATLAS_QUALIFICATION_TRUST__' /usr/share/nginx/html/web/fullworld.html
          if grep -Fq '__OTERYN_ATLAS_QUALIFICATION_TRUST__' trusted-base/web/fullworld.html; then
            echo 'protected bootstrap must not mutate the trusted source checkout' >&2
            exit 1
          fi
          if docker exec "$publication_id" wget -q -O /dev/null http://127.0.0.1:8081/fullworld/atlas-publication-readiness.json; then
            echo 'readiness manifest must not be exposed through the ordinary FullWorld namespace' >&2
            exit 1
          fi

          compose run --rm e2e \
            ./node_modules/.bin/playwright test \
            --config=playwright.config.mjs \
            tests/accessibility-desktop.spec.mjs \
            --project=desktop-chromium \
            --grep='desktop critical controls expose truthful accessible names and disabled states' \
            --workers=1 \
            --retries=0

      - name: Fence exact head and publish one-time compatibility status
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/atlas-hosted-compose-promotion-after.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER" > "$payload"
          node trusted-base/tools/verification/assert-current-pr-head.mjs \
            --payload "$payload" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$ATLAS_PR_NUMBER" \
            --expected-head-sha "$ATLAS_CODE_REVISION"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$ATLAS_CODE_REVISION" \
            -f state='success' \
            -f context='atlas-local-e2e' \
            -f description='Protected hosted trust bootstrap; 1 Chromium test, retries=0' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"