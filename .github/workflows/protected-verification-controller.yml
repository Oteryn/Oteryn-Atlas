name: Protected Verification Controller
# Host recovery remains outside the protected controller; specialist transition admission must recover before any candidate checkout.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: atlas-protected-controller-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  protected-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      ATLAS_PR_NUMBER: ${{ github.event.pull_request.number }}
      ATLAS_PROTECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ATLAS_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ATLAS_CANDIDATE_IMAGE: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    steps:
      - name: Check out protected controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact changed-file evidence without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ATLAS_PROTECTED_BASE_SHA"
          mkdir -p artifacts/protected-controller
          rows="$(mktemp)"
          trap 'rm -f "$rows"' EXIT
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER/files?per_page=100" \
            --jq '.[] | [
              .filename,
              (if .status == "renamed" then .previous_filename else "" end)
            ] | @tsv' > "$rows"
          jq -R -s '
            split("\n")
            | map(select(length > 0) | split("\t"))
            | map({path: .[0]} + (if .[1] != "" then {previousPath: .[1]} else {} end))
          ' "$rows" > artifacts/protected-controller/changed-files.json
          test "$(jq length artifacts/protected-controller/changed-files.json)" = "${{ github.event.pull_request.changed_files }}"

      - name: Fetch exact candidate head as data
        shell: bash
        run: |
          set -euo pipefail
          candidate_ref="refs/pull/$ATLAS_PR_NUMBER/head"
          git fetch --no-tags origin "+$candidate_ref:$candidate_ref"
          test "$(git rev-parse "$candidate_ref")" = "$ATLAS_CANDIDATE_HEAD_SHA"
          candidate_tree="$(mktemp -d)"
          printf '%s\n' "$candidate_tree" > "$RUNNER_TEMP/atlas-candidate-tree-path"
          git worktree add --detach "$candidate_tree" "$candidate_ref"
          test "$(git -C "$candidate_tree" rev-parse HEAD)" = "$ATLAS_CANDIDATE_HEAD_SHA"
          git -C "$candidate_tree" diff --check "$ATLAS_CANDIDATE_HEAD_SHA^" "$ATLAS_CANDIDATE_HEAD_SHA" || \
            git diff --check "$(git merge-base "$ATLAS_PROTECTED_BASE_SHA" "$ATLAS_CANDIDATE_HEAD_SHA")" "$ATLAS_CANDIDATE_HEAD_SHA"

      - name: Prepare protected Playwright dependency mount
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix e2e --ignore-scripts
          test -x e2e/node_modules/.bin/playwright
          test -d e2e/node_modules/playwright

      - name: Collect protected and sandboxed candidate stable-ID censuses
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(cat "$RUNNER_TEMP/atlas-candidate-tree-path")"
          protected_raw="$RUNNER_TEMP/atlas-protected-census.txt"
          candidate_raw="$RUNNER_TEMP/atlas-candidate-census.txt"
          candidate_out="$RUNNER_TEMP/atlas-candidate-census"
          mkdir -p "$candidate_out"

          (
            cd e2e
            ATLAS_E2E_EXTERNAL_SERVER=1 \
            ATLAS_SKIP_WORLD_PUBLISH=1 \
            ATLAS_SKIP_VISUAL=1 \
            ATLAS_E2E_DEPTH=required \
            ATLAS_E2E_WORKERS=1 \
              npx playwright test --list
          ) > "$protected_raw"
          node tools/verification/parse-playwright-test-list.mjs \
            --input "$protected_raw" \
            > artifacts/protected-controller/protected-census.json

          test ! -e "$candidate_tree/e2e/node_modules"
          ln -s /protected-e2e-node-modules/node_modules "$candidate_tree/e2e/node_modules"
          timeout --signal=KILL 150s docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 192 \
            --memory 768m \
            --cpus 2 \
            --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,size=96m \
            --env ATLAS_E2E_EXTERNAL_SERVER=1 \
            --env ATLAS_SKIP_WORLD_PUBLISH=1 \
            --env ATLAS_SKIP_VISUAL=1 \
            --env ATLAS_E2E_DEPTH=required \
            --env ATLAS_E2E_WORKERS=1 \
            --mount "type=bind,src=$candidate_tree,dst=/candidate,readonly" \
            --mount "type=bind,src=$PWD/e2e/node_modules,dst=/protected-e2e-node-modules/node_modules,readonly" \
            --mount "type=bind,src=$candidate_out,dst=/out" \
            "$ATLAS_CANDIDATE_IMAGE" \
            bash -lc 'cd /candidate/e2e && npx playwright test --list > /out/list.txt'
          cp "$candidate_out/list.txt" "$candidate_raw"
          node tools/verification/parse-playwright-test-list.mjs \
            --input "$candidate_raw" \
            > "$RUNNER_TEMP/candidate-census-body.json"
          jq -n \
            --arg candidateHeadSha "$ATLAS_CANDIDATE_HEAD_SHA" \
            --slurpfile census "$RUNNER_TEMP/candidate-census-body.json" \
            '{
              schemaVersion: 1,
              status: "success",
              candidateHeadSha: $candidateHeadSha,
              sandboxPolicyId: "atlas-candidate-census-sandbox-v1",
              census: $census[0]
            }' > artifacts/protected-controller/candidate-census.json

      - name: Snapshot candidate policy files as inert data
        shell: bash
        run: |
          set -euo pipefail
          git show "$ATLAS_CANDIDATE_HEAD_SHA:tools/verification/impact-manifest.json" > artifacts/protected-controller/candidate-impact.json
          git show "$ATLAS_CANDIDATE_HEAD_SHA:tools/verification/verification-catalog.json" > artifacts/protected-controller/candidate-catalog.json
          git show "$ATLAS_PROTECTED_BASE_SHA:tools/verification/impact-manifest.json" > artifacts/protected-controller/trusted-impact.json
          git show "$ATLAS_PROTECTED_BASE_SHA:tools/verification/verification-catalog.json" > artifacts/protected-controller/trusted-catalog.json
          cp tools/verification/protected-hosted-product-identities.json artifacts/protected-controller/product-identities.json

      - name: Restore protected base after candidate data snapshot
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force "$ATLAS_PROTECTED_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$ATLAS_PROTECTED_BASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Build authoritative protected v3 plan
        shell: bash
        run: |
          set -euo pipefail
          merge_base_sha="$(git merge-base "$ATLAS_PROTECTED_BASE_SHA" "$ATLAS_CANDIDATE_HEAD_SHA")"
          node --input-type=module - "$GITHUB_REPOSITORY" "$ATLAS_PR_NUMBER" "$ATLAS_PROTECTED_BASE_SHA" "$ATLAS_CANDIDATE_HEAD_SHA" "$merge_base_sha" <<'NODE'
          import fs from 'node:fs';
          import { buildProtectedExecutionEnvironmentIdentity } from './tools/verification/protected-execution-environment.mjs';
          import { buildProtectedHostedPlan } from './tools/verification/protected-hosted-plan.mjs';
          import { buildVerificationAuthorityIdentity } from './tools/verification/verification-authority.mjs';
          const [repository, prNumber, protectedBaseSha, candidateHeadSha, mergeBaseSha] = process.argv.slice(2);
          const read = (name) => JSON.parse(fs.readFileSync(`artifacts/protected-controller/${name}`, 'utf8'));
          const authorityManifest = JSON.parse(fs.readFileSync('tools/verification/verification-authority-manifest.json', 'utf8'));
          const authorityIdentity = await buildVerificationAuthorityIdentity({
            manifest: authorityManifest,
            readFile: async (path) => fs.promises.readFile(path),
          });
          const environmentConfig = JSON.parse(fs.readFileSync('tools/verification/protected-execution-environment.json', 'utf8'));
          const environmentIdentity = buildProtectedExecutionEnvironmentIdentity(environmentConfig);
          fs.writeFileSync(
            'artifacts/protected-controller/verification-authority-identity.json',
            `${JSON.stringify(authorityIdentity, null, 2)}\n`,
            'utf8',
          );
          fs.writeFileSync(
            'artifacts/protected-controller/protected-execution-environment-identity.json',
            `${JSON.stringify(environmentIdentity, null, 2)}\n`,
            'utf8',
          );
          const plan = buildProtectedHostedPlan({
            repository,
            prNumber: Number(prNumber),
            protectedBaseSha,
            candidateHeadSha,
            mergeBaseSha,
            changedFiles: read('changed-files.json'),
            trustedImpactManifest: read('trusted-impact.json'),
            candidateImpactManifest: read('candidate-impact.json'),
            trustedVerificationCatalog: read('trusted-catalog.json'),
            candidateVerificationCatalog: read('candidate-catalog.json'),
            protectedCensus: read('protected-census.json'),
            candidateCensus: read('candidate-census.json'),
            productIdentities: read('product-identities.json'),
            authorityIdentity,
            environmentIdentity,
          });
          fs.writeFileSync('artifacts/protected-controller/verification-plan.json', `${JSON.stringify(plan, null, 2)}\n`, 'utf8');
          NODE

      - name: Fence current PR head before plan publication
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/atlas-controller-head.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER" > "$payload"
          node tools/verification/assert-current-pr-head.mjs \
            --payload "$payload" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$ATLAS_PR_NUMBER" \
            --expected-head-sha "$ATLAS_CANDIDATE_HEAD_SHA"

      - name: Publish protected plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: protected-verification-plan-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/protected-controller/verification-plan.json
            artifacts/protected-controller/verification-authority-identity.json
            artifacts/protected-controller/protected-execution-environment-identity.json
            artifacts/protected-controller/changed-files.json
            artifacts/protected-controller/protected-census.json
            artifacts/protected-controller/candidate-census.json
          if-no-files-found: error
          retention-days: 14
