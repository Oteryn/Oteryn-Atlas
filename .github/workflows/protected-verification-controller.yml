name: Protected Verification Controller

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: atlas-protected-controller-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  protected-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      ATLAS_PR_NUMBER: ${{ github.event.pull_request.number }}
      ATLAS_PROTECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ATLAS_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ATLAS_CANDIDATE_IMAGE: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    steps:
      - name: Check out protected controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact changed-file evidence without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ATLAS_PROTECTED_BASE_SHA"
          mkdir -p artifacts/protected-controller
          rows="$(mktemp)"
          git_changes="$(mktemp)"
          trap 'rm -f "$rows" "$git_changes"' EXIT

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER/files?per_page=100" \
            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' > "$rows"
          test -s "$rows"

          git fetch --no-tags origin "refs/pull/$ATLAS_PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$ATLAS_CANDIDATE_HEAD_SHA"
          merge_base_sha="$(git merge-base "$ATLAS_PROTECTED_BASE_SHA" "$ATLAS_CANDIDATE_HEAD_SHA")"
          test -n "$merge_base_sha"
          git diff --check "$merge_base_sha" "$ATLAS_CANDIDATE_HEAD_SHA"
          git diff --name-status -z --find-renames "$merge_base_sha" "$ATLAS_CANDIDATE_HEAD_SHA" > "$git_changes"

          node --input-type=module - "$rows" "$git_changes" artifacts/protected-controller/changed-files.json <<'NODE'
          import fs from 'node:fs';
          const [rowsPath, gitPath, outputPath] = process.argv.slice(2);
          const rows = fs.readFileSync(rowsPath, 'utf8').split(/\r?\n/).filter(Boolean);
          const api = rows.map((row) => {
            const fields = row.split('\t');
            if (fields.length !== 2 || !fields[0]) throw new Error('Malformed GitHub changed-file evidence.');
            return fields[1] ? { path: fields[0], previousPath: fields[1] } : { path: fields[0] };
          });
          const fields = fs.readFileSync(gitPath, 'utf8').split('\0');
          if (fields.at(-1) === '') fields.pop();
          const git = [];
          while (fields.length) {
            const status = fields.shift();
            if (!status) throw new Error('Malformed protected merge-base diff evidence.');
            if (status.startsWith('R')) {
              const previousPath = fields.shift();
              const path = fields.shift();
              if (!previousPath || !path) throw new Error('Malformed protected rename evidence.');
              git.push({ path, previousPath });
            } else {
              const path = fields.shift();
              if (!path) throw new Error('Malformed protected changed path evidence.');
              git.push({ path });
            }
          }
          const canonical = (items) => JSON.stringify(items.map((item) => ({ path: item.path, previousPath: item.previousPath ?? null }))
            .sort((a, b) => `${a.path}\0${a.previousPath}`.localeCompare(`${b.path}\0${b.previousPath}`)));
          if (canonical(api) !== canonical(git)) throw new Error('GitHub changed-file evidence does not match protected merge-base diff.');
          fs.writeFileSync(outputPath, `${JSON.stringify(api)}\n`);
          NODE
          printf '%s\n' "$merge_base_sha" > artifacts/protected-controller/merge-base.txt

      - name: Snapshot protected and candidate policy as inert data
        shell: bash
        run: |
          set -euo pipefail
          git show "$ATLAS_PROTECTED_BASE_SHA:tools/verification/impact-manifest.json" > artifacts/protected-controller/trusted-impact.json
          git show "$ATLAS_PROTECTED_BASE_SHA:tools/verification/verification-catalog.json" > artifacts/protected-controller/trusted-catalog.json
          git show "$ATLAS_CANDIDATE_HEAD_SHA:tools/verification/impact-manifest.json" > artifacts/protected-controller/candidate-impact.json
          git show "$ATLAS_CANDIDATE_HEAD_SHA:tools/verification/verification-catalog.json" > artifacts/protected-controller/candidate-catalog.json
          git show "$ATLAS_PROTECTED_BASE_SHA:tools/verification/protected-hosted-product-identities.json" > artifacts/protected-controller/product-identities.json

      - name: Enumerate exact protected-base Playwright census
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix e2e --ignore-scripts --no-audit --no-fund
          ATLAS_ARTIFACTS_DIR="$PWD/artifacts/protected-controller/playwright-list" \
            npm exec --prefix e2e -- playwright test --config=e2e/playwright.config.mjs --list \
            > artifacts/protected-controller/protected-playwright-test-list.txt
          node tools/verification/parse-playwright-test-list.mjs \
            artifacts/protected-controller/protected-playwright-test-list.txt \
            > artifacts/protected-controller/protected-stable-test-ids.json

      - name: Enumerate candidate census only inside protected no-network sandbox
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/atlas-candidate-census-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() { git worktree remove --force "$candidate_dir" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          git worktree add --detach "$candidate_dir" "$ATLAS_CANDIDATE_HEAD_SHA"
          test ! -L "$candidate_dir/e2e"
          test -d "$candidate_dir/e2e"
          if git ls-tree -r --name-only "$ATLAS_CANDIDATE_HEAD_SHA" -- e2e/node_modules | grep -q .; then
            echo 'Candidate must not supply e2e/node_modules.' >&2
            exit 1
          fi
          test ! -e "$candidate_dir/e2e/node_modules"
          ln -s /protected-e2e-node-modules/node_modules "$candidate_dir/e2e/node_modules"
          timeout --signal=KILL 120s docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 192 \
            --memory 1536m \
            --cpus 2 \
            --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount "type=bind,src=$candidate_dir,dst=/candidate,readonly" \
            --mount "type=bind,src=$PWD/e2e/node_modules,dst=/protected-e2e-node-modules/node_modules,readonly" \
            "$ATLAS_CANDIDATE_IMAGE" \
            bash -lc 'cd /candidate && CI=1 /candidate/e2e/node_modules/.bin/playwright test --config=/candidate/e2e/playwright.config.mjs --list' \
            > artifacts/protected-controller/candidate-playwright-test-list.txt
          node tools/verification/parse-playwright-test-list.mjs \
            artifacts/protected-controller/candidate-playwright-test-list.txt \
            > artifacts/protected-controller/candidate-stable-test-ids.json

      - name: Build authoritative protected v2 plan
        shell: bash
        run: |
          set -euo pipefail
          merge_base_sha="$(tr -d '\r\n' < artifacts/protected-controller/merge-base.txt)"
          node --input-type=module - "$merge_base_sha" <<'NODE'
          import fs from 'node:fs';
          import { buildProtectedHostedPlan } from './tools/verification/protected-hosted-plan.mjs';
          import { stableIdAlgorithm } from './tools/verification/stable-id.mjs';
          const [mergeBaseSha] = process.argv.slice(2);
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const census = (stableTestIds) => ({ schemaVersion: 1, stableIdAlgorithm, stableTestIds });
          const candidateHeadSha = process.env.ATLAS_CANDIDATE_HEAD_SHA;
          const plan = buildProtectedHostedPlan({
            repository: process.env.GITHUB_REPOSITORY,
            prNumber: Number(process.env.ATLAS_PR_NUMBER),
            protectedBaseSha: process.env.ATLAS_PROTECTED_BASE_SHA,
            candidateHeadSha,
            mergeBaseSha,
            changedFiles: read('artifacts/protected-controller/changed-files.json'),
            trustedImpactManifest: read('artifacts/protected-controller/trusted-impact.json'),
            candidateImpactManifest: read('artifacts/protected-controller/candidate-impact.json'),
            trustedVerificationCatalog: read('artifacts/protected-controller/trusted-catalog.json'),
            candidateVerificationCatalog: read('artifacts/protected-controller/candidate-catalog.json'),
            protectedCensus: census(read('artifacts/protected-controller/protected-stable-test-ids.json')),
            candidateCensus: {
              schemaVersion: 1,
              status: 'success',
              candidateHeadSha,
              sandboxPolicyId: 'atlas-candidate-census-sandbox-v1',
              census: census(read('artifacts/protected-controller/candidate-stable-test-ids.json')),
            },
            productIdentities: read('artifacts/protected-controller/product-identities.json'),
          });
          fs.writeFileSync('artifacts/protected-controller/protected-verification-plan.json', `${JSON.stringify(plan, null, 2)}\n`);
          NODE

      - name: Reject superseded head before plan publication
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER" > artifacts/protected-controller/current-pr.json
          node tools/verification/assert-current-pr-head.mjs \
            --payload artifacts/protected-controller/current-pr.json \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$ATLAS_PR_NUMBER" \
            --expected-head-sha "$ATLAS_CANDIDATE_HEAD_SHA"

      - name: Publish protected verification plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-verification-plan-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/protected-controller/protected-verification-plan.json
            artifacts/protected-controller/protected-stable-test-ids.json
            artifacts/protected-controller/candidate-stable-test-ids.json
            artifacts/protected-controller/changed-files.json
            artifacts/protected-controller/merge-base.txt
            artifacts/protected-controller/product-identities.json
          if-no-files-found: error
          retention-days: 14
