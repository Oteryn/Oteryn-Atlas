name: Extraction Provenance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  provenance-gate:
    name: provenance-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact Atlas candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned legacy Atlas source as inert Git data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blakinio/Otheryn
          ref: e417c5e7c22986bf4acef0495eb47f7b72c97cce
          path: legacy-source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Compile provenance verifier
        run: python -m py_compile tools/governance/verify_extraction_provenance.py tools/governance/test_verify_extraction_provenance.py

      - name: Run negative source-provenance tests
        run: python tools/governance/test_verify_extraction_provenance.py

      - name: Verify exact source and target provenance
        run: python tools/governance/verify_extraction_provenance.py --source-root legacy-source
