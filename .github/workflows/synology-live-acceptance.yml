name: Synology Live Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-synology-live-acceptance
  cancel-in-progress: false

jobs:
  live-atlas:
    name: Verify, deploy and smoke Atlas on Synology
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: atlas-runners
      labels: oteryn-atlas
    timeout-minutes: 45
    env:
      ATLAS_REV: ${{ github.sha }}
      PREVIEW_CONTAINER: oteryn-atlas-fullworld-preview
      PREVIEW_URL: http://192.168.1.2:8097
      CREATURE_SEMANTIC_DIGEST: sha256:7dc951874c95424279737eaaf51cf2d50940162ef4799daea39a187a581ef0e8
      PUBLICATION_ROOT: sha256:9d0d2f3bb16a5a90f9b51a21366e4ed42963f5cb12366c404a20d9502ec4857f
      SEMANTIC_ROOT: sha256:27d7a83a7d9f498ea614b440ab4216cae5e6d11ea0527482410e40948cade5a9
      PIXEL_ROOT: sha256:8b8228fcc4574903e547cb7d65b96f3d45e5a9e67045091c1bceb6e54d3690ad
      OVERVIEW_ROOT: sha256:17683912d6758796d80a5b1647e2d0031f6849e51c40ae5264da6cfce3f9d6db
      RUNTIME_ROOT: sha256:fa30ae5fc47f0ca8a6d482ed87b5db2cd74f32f7f523df16187ca719b8e04f08
      PIXEL_BUCKET_ROOT: sha256:99cf23b01a0d652ff670a994a2b80cbef8d17036f514522d47f1aa98352d3116
      MINIMAP_ROOT: sha256:23f4d2c3901673fb38980e2600828145a6d0626c0e44d1d9f5ca23bfbce02268

    steps:
      - name: Verify Atlas organization runner boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_SCOPE:-}" = organization
          test "${RUNNER_GROUP:-}" = atlas-runners
          test "${RUNNER_NAME:-}" = oteryn-synology-atlas
          test "${RUNNER_LABELS:-}" = oteryn-atlas
          test -S /var/run/docker.sock
          test ! -e /var/lib/oteryn-staging-state
          grep -F '"agentName": "oteryn-synology-atlas"' /runner/.runner
          grep -F '"poolName": "atlas-runners"' /runner/.runner
          grep -F '"gitHubUrl": "https://github.com/Oteryn"' /runner/.runner
          grep -F '"workFolder": "/work"' /runner/.runner
          echo 'atlas-runner-identity=PASS'

      - name: Check out exact Atlas workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify main-only deployment authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_SHA" = "$ATLAS_REV"
          test "$(git rev-parse HEAD)" = "$ATLAS_REV"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$ATLAS_REV"
          test -z "$(git status --porcelain)"
          echo 'main-only deployment authority=PASS'

      - name: Acquire and verify exact immutable release artifact
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          roots=(/volume*/OTS)
          test "${#roots[@]}" -eq 1
          store="${roots[0]}/oteryn-atlas/releases/$ATLAS_REV"
          manifest="$store/manifest.json"
          deadline=$((SECONDS + 2700))
          while [[ ! -s "$manifest" && "$SECONDS" -lt "$deadline" ]]; do sleep 5; done
          test -s "$manifest"
          manifest_rev="$(node -e 'const m=require(process.argv[1]);process.stdout.write(m.atlasRevision)' "$manifest")"
          artifact_sha="$(node -e 'const m=require(process.argv[1]);process.stdout.write(m.artifactSha256)' "$manifest")"
          artifact_bytes="$(node -e 'const m=require(process.argv[1]);process.stdout.write(String(m.artifactBytes))' "$manifest")"
          source_tree_sha="$(node -e 'const m=require(process.argv[1]);process.stdout.write(m.sourceTreeSha256)' "$manifest")"
          test "$manifest_rev" = "$ATLAS_REV"
          [[ "$artifact_sha" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$source_tree_sha" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$artifact_bytes" =~ ^[1-9][0-9]*$ ]]
          digest_name="${artifact_sha#sha256:}"
          artifact="$store/$digest_name.tar"
          test -s "$artifact"
          test "$(stat -c %s "$artifact")" = "$artifact_bytes"
          test "sha256:$(sha256sum "$artifact" | awk '{print $1}')" = "$artifact_sha"
          rm -rf -- release-payload creature-index-a animation-runtime-a e2e-targets.json first-chunk.txt first-bucket.txt
          mkdir release-payload
          tar -xf "$artifact" -C release-payload
          test -s release-payload/repo/web/fullworld.html
          test -s release-payload/evidence/creature-index/index.json
          test -s release-payload/evidence/animation-runtime/manifest.json
          test -s release-payload/evidence/animation-runtime/programs.json
          test -s release-payload/evidence/e2e-targets.json
          actual_tree="$(node --input-type=module - "$source_tree_sha" <<'NODE'
          import { sourceTreeDigest } from './tools/verification/release-artifact-manifest.mjs';
          process.stdout.write(sourceTreeDigest('release-payload/repo'));
          NODE
          )"
          test "$actual_tree" = "$source_tree_sha"
          cp -a release-payload/evidence/creature-index creature-index-a
          cp -a release-payload/evidence/animation-runtime animation-runtime-a
          cp release-payload/evidence/e2e-targets.json e2e-targets.json
          cp release-payload/evidence/first-chunk.txt first-chunk.txt
          cp release-payload/evidence/first-bucket.txt first-bucket.txt
          grep -F "$CREATURE_SEMANTIC_DIGEST" creature-index-a/index.json >/dev/null
          grep -F 'sha256:413de22b245288da68153e2c0e9d4efe4ee011421b56a09532c8119829079540' animation-runtime-a/manifest.json >/dev/null
          {
            echo "artifact=$artifact"
            echo "artifact_sha256=$artifact_sha"
            echo "source_tree_sha256=$source_tree_sha"
          } >> "$GITHUB_OUTPUT"
          echo "release-artifact-revision-digest-integrity=PASS $artifact_sha"

      - name: Stage exact merged main candidate
        id: stage
        shell: bash
        run: |
          set -Eeuo pipefail
          C="$PREVIEW_CONTAINER"
          IMAGE="$(docker inspect --format '{{.Config.Image}}' "$C")"
          OLD_REV="$(docker inspect --format '{{ index .Config.Labels "org.oteryn.revision" }}' "$C")"
          OLD_REPO_ROOT="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/srv/atlas/repo"}}{{.Source}}{{end}}{{end}}' "$C")"
          DATA_ROOT="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/srv/atlas/data"}}{{.Source}}{{end}}{{end}}' "$C")"
          MINIMAP_ROOT_PATH="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/srv/atlas/minimap-product"}}{{.Source}}{{end}}{{end}}' "$C")"
          OLD_NGINX="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/etc/nginx/conf.d/default.conf"}}{{.Source}}{{end}}{{end}}' "$C")"
          REVISION_ROOT="$(dirname "$(dirname "$OLD_REPO_ROOT")")"
          NEW_ROOT="$REVISION_ROOT/.staged-${ATLAS_REV}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$(git rev-parse HEAD)" = "$ATLAS_REV"
          test "$(docker inspect --format '{{.State.Running}}' "$C")" = true
          test "$(docker port "$C" 8080/tcp)" = '192.168.1.2:8097'
          test -n "$IMAGE"; test -n "$OLD_REV"; test -n "$DATA_ROOT"; test -n "$MINIMAP_ROOT_PATH"; test -n "$OLD_NGINX"
          {
            echo "image=$IMAGE"; echo "old_revision=$OLD_REV"; echo "data_root=$DATA_ROOT"; echo "minimap_root=$MINIMAP_ROOT_PATH"; echo "revision_root=$REVISION_ROOT"; echo "new_root=$NEW_ROOT"
          } >> "$GITHUB_OUTPUT"
          docker rm -f "${C}-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${C}-rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null 2>&1 || true
          STAGE_NAME="$(basename "$NEW_ROOT")"
          docker run --rm --user 0:0 --entrypoint sh -e STAGE_NAME="$STAGE_NAME" -v "$REVISION_ROOT:/revisions" "$IMAGE" -c 'rm -rf "/revisions/$STAGE_NAME"; mkdir -p "/revisions/$STAGE_NAME/repo"'
          tar -C release-payload/repo -cf - . | docker run --rm -i --user 0:0 --entrypoint sh -v "$NEW_ROOT/repo:/repo" "$IMAGE" -c 'tar -xf - -C /repo; test -s /repo/web/fullworld.html'
          docker run --rm --user 0:0 --entrypoint sh -v "$OLD_NGINX:/old:ro" -v "$NEW_ROOT:/new" -e OLD_REV="$OLD_REV" -e NEW_REV="$ATLAS_REV" "$IMAGE" -c 'sed "s/$OLD_REV/$NEW_REV/g" /old > /new/nginx.conf; test -s /new/nginx.conf'
          echo 'exact-release-artifact-candidate-staged=PASS'

      - name: Atomically publish and cut over qualified animated candidate
        id: product
        shell: bash
        run: |
          set -Eeuo pipefail
          C="$PREVIEW_CONTAINER"; IMAGE="${{ steps.stage.outputs.image }}"; OLD_REV="${{ steps.stage.outputs.old_revision }}"
          DATA_ROOT="${{ steps.stage.outputs.data_root }}"; MINIMAP_ROOT_PATH="${{ steps.stage.outputs.minimap_root }}"; NEW_ROOT="${{ steps.stage.outputs.new_root }}"
          REPO_ROOT="$NEW_ROOT/repo"; HELPER_IMAGE="$IMAGE"; CANDIDATE_CONTAINER="${C}-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; BACKUP_CONTAINER="${C}-rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$(docker inspect --format '{{.State.Running}}' "$C")" = true
          test "$(docker inspect --format '{{ index .Config.Labels "org.oteryn.revision" }}' "$C")" = "$OLD_REV"
          test "$(docker port "$C" 8080/tcp)" = '192.168.1.2:8097'
          docker run --rm --entrypoint sh -v "$NEW_ROOT:/candidate:ro" "$IMAGE" -c 'test -s /candidate/nginx.conf'
          CREATURE_TMP=".creatures-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; ANIMATION_TMP=".animation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm --user 0:0 --entrypoint sh -v "$REPO_ROOT:/repo" "$HELPER_IMAGE" -c 'mkdir -p /repo/data /repo/fullworld'
          tar -C creature-index-a -cf - . | docker run --rm -i --user 0:0 --entrypoint sh -e TMP="$CREATURE_TMP" -v "$REPO_ROOT:/repo" "$HELPER_IMAGE" -c 'set -eu; rm -rf "/repo/data/$TMP" /repo/data/creatures; mkdir "/repo/data/$TMP"; tar -xf - -C "/repo/data/$TMP"; test -s "/repo/data/$TMP/index.json"; mv "/repo/data/$TMP" /repo/data/creatures'
          tar -C animation-runtime-a -cf - . | docker run --rm -i --user 0:0 --entrypoint sh -e TMP="$ANIMATION_TMP" -v "$REPO_ROOT:/repo" "$HELPER_IMAGE" -c 'set -eu; rm -rf "/repo/fullworld/$TMP" /repo/fullworld/animation; mkdir "/repo/fullworld/$TMP"; tar -xf - -C "/repo/fullworld/$TMP"; test -s "/repo/fullworld/$TMP/manifest.json"; mv "/repo/fullworld/$TMP" /repo/fullworld/animation'
          echo "repo_root=$REPO_ROOT" >> "$GITHUB_OUTPUT"; echo "helper_image=$HELPER_IMAGE" >> "$GITHUB_OUTPUT"; echo "published=true" >> "$GITHUB_OUTPUT"; echo "animation_published=true" >> "$GITHUB_OUTPUT"; echo "parent_created=false" >> "$GITHUB_OUTPUT"
          docker rm -f "$CANDIDATE_CONTAINER" "$BACKUP_CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$CANDIDATE_CONTAINER" --restart no -p 192.168.1.2:18098:8080 --label org.oteryn.preview=fullworld-atlas --label org.oteryn.revision="$ATLAS_REV" -v "$NEW_ROOT/nginx.conf:/etc/nginx/conf.d/default.conf:ro" -v "$DATA_ROOT:/srv/atlas/data:ro" -v "$MINIMAP_ROOT_PATH:/srv/atlas/minimap-product:ro" -v "$REPO_ROOT:/srv/atlas/repo:ro" "$IMAGE" >/dev/null
          for _ in $(seq 1 30); do curl -fsS -D /tmp/candidate.headers http://192.168.1.2:18098/web/fullworld.html -o /tmp/candidate.html && break; sleep 1; done
          grep -qi "X-Oteryn-Atlas-Revision: $ATLAS_REV" /tmp/candidate.headers
          cmp web/fullworld.html /tmp/candidate.html
          curl -fsS http://192.168.1.2:18098/data/creatures/index.json -o /tmp/candidate-creatures.json
          curl -fsS http://192.168.1.2:18098/fullworld/animation/manifest.json -o /tmp/candidate-animation.json
          curl -fsS http://192.168.1.2:18098/fullworld/animation/programs.json -o /tmp/candidate-programs.json
          cmp creature-index-a/index.json /tmp/candidate-creatures.json
          cmp animation-runtime-a/manifest.json /tmp/candidate-animation.json
          cmp animation-runtime-a/programs.json /tmp/candidate-programs.json
          first_bucket="$(cat first-bucket.txt)"; curl -fsS "http://192.168.1.2:18098/fullworld/animation/$first_bucket" -o /tmp/candidate-animation-bucket.rgba; cmp "animation-runtime-a/$first_bucket" /tmp/candidate-animation-bucket.rgba
          first_chunk="$(cat first-chunk.txt)"; curl -fsS "http://192.168.1.2:18098/data/creatures/$first_chunk" -o /tmp/candidate-first-chunk.json; cmp "creature-index-a/$first_chunk" /tmp/candidate-first-chunk.json
          grep -F "$PUBLICATION_ROOT" <(curl -fsS http://192.168.1.2:18098/fullworld/publication/publication.json) >/dev/null
          grep -F "$SEMANTIC_ROOT" <(curl -fsS http://192.168.1.2:18098/fullworld/publication/semantic/world.json) >/dev/null
          grep -F "$PIXEL_ROOT" <(curl -fsS http://192.168.1.2:18098/fullworld/publication/pixels/manifest.json) >/dev/null
          grep -F "$OVERVIEW_ROOT" <(curl -fsS http://192.168.1.2:18098/fullworld/overview/world.json) >/dev/null
          grep -F "$RUNTIME_ROOT" <(curl -fsS http://192.168.1.2:18098/fullworld/runtime-index/world.json) >/dev/null
          grep -F "$PIXEL_BUCKET_ROOT" <(curl -fsS http://192.168.1.2:18098/fullworld/pixel-buckets/manifest.json) >/dev/null
          grep -F "$MINIMAP_ROOT" <(curl -fsS http://192.168.1.2:18098/fullworld/minimap/world.json) >/dev/null
          echo 'qualified-candidate-products=PASS'
          docker rm -f "$CANDIDATE_CONTAINER" >/dev/null
          echo "backup_container=$BACKUP_CONTAINER" >> "$GITHUB_OUTPUT"; echo "previous_revision=$OLD_REV" >> "$GITHUB_OUTPUT"
          docker stop "$C" >/dev/null; docker rename "$C" "$BACKUP_CONTAINER"
          rollback_live(){ rc=$?; set +e; docker rm -f "$C" >/dev/null 2>&1 || true; docker rename "$BACKUP_CONTAINER" "$C" >/dev/null 2>&1 || true; docker start "$C" >/dev/null 2>&1 || true; exit "$rc"; }; trap rollback_live ERR INT TERM
          docker run -d --name "$C" --restart unless-stopped -p 192.168.1.2:8097:8080 --label org.oteryn.preview=fullworld-atlas --label org.oteryn.revision="$ATLAS_REV" -v "$NEW_ROOT/nginx.conf:/etc/nginx/conf.d/default.conf:ro" -v "$DATA_ROOT:/srv/atlas/data:ro" -v "$MINIMAP_ROOT_PATH:/srv/atlas/minimap-product:ro" -v "$REPO_ROOT:/srv/atlas/repo:ro" "$IMAGE" >/dev/null
          for _ in $(seq 1 30); do curl -fsS -D /tmp/live-new.headers "$PREVIEW_URL/web/fullworld.html" -o /tmp/live-new.html && break; sleep 1; done
          grep -qi "X-Oteryn-Atlas-Revision: $ATLAS_REV" /tmp/live-new.headers
          cmp web/fullworld.html /tmp/live-new.html
          test "$(docker inspect --format '{{ index .Config.Labels "org.oteryn.revision" }}' "$C")" = "$ATLAS_REV"
          curl -fsS "$PREVIEW_URL/data/creatures/index.json" -o /tmp/live-creatures.json; cmp creature-index-a/index.json /tmp/live-creatures.json
          curl -fsS "$PREVIEW_URL/fullworld/animation/manifest.json" -o /tmp/live-animation.json; cmp animation-runtime-a/manifest.json /tmp/live-animation.json
          curl -fsS "$PREVIEW_URL/fullworld/animation/programs.json" -o /tmp/live-programs.json; cmp animation-runtime-a/programs.json /tmp/live-programs.json
          curl -fsS "$PREVIEW_URL/fullworld/animation/$first_bucket" -o /tmp/live-animation-bucket.rgba; cmp "animation-runtime-a/$first_bucket" /tmp/live-animation-bucket.rgba
          curl -fsS "$PREVIEW_URL/data/creatures/$first_chunk" -o /tmp/live-first-chunk.json; cmp "creature-index-a/$first_chunk" /tmp/live-first-chunk.json
          for pair in "$PUBLICATION_ROOT fullworld/publication/publication.json" "$SEMANTIC_ROOT fullworld/publication/semantic/world.json" "$PIXEL_ROOT fullworld/publication/pixels/manifest.json" "$OVERVIEW_ROOT fullworld/overview/world.json" "$RUNTIME_ROOT fullworld/runtime-index/world.json" "$PIXEL_BUCKET_ROOT fullworld/pixel-buckets/manifest.json" "$MINIMAP_ROOT fullworld/minimap/world.json"; do root="${pair%% *}"; url="${pair#* }"; curl -fsS "$PREVIEW_URL/$url" | grep -F "$root" >/dev/null; done
          trap - ERR INT TERM
          echo "changed=true" >> "$GITHUB_OUTPUT"; echo 'exact-main-deployment=PASS'; echo 'live-animated-products-and-roots=PASS'

      - name: Build bounded Chromium acceptance image
        id: browser
        shell: bash
        run: |
          set -Eeuo pipefail
          image="oteryn-atlas-live-e2e:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --pull -t "$image" -f e2e/Dockerfile .
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Run live desktop and mobile Chromium E2E
        id: e2e
        shell: bash
        env:
          BROWSER_IMAGE: ${{ steps.browser.outputs.image }}
        run: |
          set -Eeuo pipefail
          rm -rf -- e2e-evidence; mkdir -p e2e-evidence
          container="oteryn-atlas-live-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker create --name "$container" --network bridge --ipc host --shm-size 1g --entrypoint node -e "PREVIEW_URL=$PREVIEW_URL" -e "ATLAS_REV=$ATLAS_REV" -e "CREATURE_SEMANTIC_DIGEST=$CREATURE_SEMANTIC_DIGEST" "$BROWSER_IMAGE" tests/live-creature-preview.cjs >/dev/null
          docker cp e2e-targets.json "$container:/targets.json"
          set +e; docker start -a "$container" 2>&1 | tee e2e-evidence/browser.log; rc="${PIPESTATUS[0]}"; set -e
          docker cp "$container:/evidence/." e2e-evidence/ 2>/dev/null || true
          test "$rc" -eq 0
          grep -Fx 'desktop=PASS' e2e-evidence/browser.log; grep -Fx 'mobile=PASS' e2e-evidence/browser.log
          test -s e2e-evidence/result.json; grep -F '"status": "PASS"' e2e-evidence/result.json; grep -F "$ATLAS_REV" e2e-evidence/result.json; grep -F "$CREATURE_SEMANTIC_DIGEST" e2e-evidence/result.json
          echo 'live-e2e=PASS'

      - name: Publish bounded browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-synology-live-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup task-owned resources and rollback failed publication
        if: always()
        shell: bash
        env:
          BROWSER_IMAGE: ${{ steps.browser.outputs.image }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          DEPLOY_CHANGED: ${{ steps.product.outputs.changed }}
          BACKUP_CONTAINER: ${{ steps.product.outputs.backup_container }}
          PREVIOUS_REVISION: ${{ steps.product.outputs.previous_revision }}
          JOB_STATUS: ${{ job.status }}
          STAGED_ROOT: ${{ steps.stage.outputs.new_root }}
          STAGE_IMAGE: ${{ steps.stage.outputs.image }}
        run: |
          set -Eeuo pipefail
          container="oteryn-atlas-live-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; docker rm -f "$container" >/dev/null 2>&1 || true
          if [[ "$DEPLOY_CHANGED" = true ]]; then
            test -n "$BACKUP_CONTAINER"
            if [[ "$JOB_STATUS" = success ]]; then docker rm -f "$BACKUP_CONTAINER" >/dev/null; echo 'deployment-finalize=PASS';
            else
              docker rm -f "$PREVIEW_CONTAINER" >/dev/null 2>&1 || true; docker rename "$BACKUP_CONTAINER" "$PREVIEW_CONTAINER"; docker start "$PREVIEW_CONTAINER" >/dev/null
              test -n "$PREVIOUS_REVISION"; docker inspect --format '{{ index .Config.Labels "org.oteryn.revision" }}' "$PREVIEW_CONTAINER" | grep -Fx "$PREVIOUS_REVISION"
              curl -fsS -D /tmp/atlas-rollback.headers "$PREVIEW_URL/web/fullworld.html" -o /tmp/atlas-rollback.html; grep -qi "X-Oteryn-Atlas-Revision: $PREVIOUS_REVISION" /tmp/atlas-rollback.headers
              echo 'deployment-rollback=PASS'; echo 'deployment-rollback-revision=PASS'
            fi
          fi
          if [[ "$JOB_STATUS" != success && -n "$STAGED_ROOT" && -n "$STAGE_IMAGE" ]]; then revision_root="$(dirname "$STAGED_ROOT")"; stage_name="$(basename "$STAGED_ROOT")"; docker run --rm --user 0:0 --entrypoint sh -e STAGE_NAME="$stage_name" -v "$revision_root:/revisions" "$STAGE_IMAGE" -c 'rm -rf "/revisions/$STAGE_NAME"'; echo 'staged-root-cleanup=PASS'; fi
          if [[ -n "$BROWSER_IMAGE" ]]; then docker image rm -f "$BROWSER_IMAGE" >/dev/null 2>&1 || true; fi
          rm -rf -- release-payload creature-index-a animation-runtime-a e2e-targets.json first-chunk.txt first-bucket.txt e2e-evidence
          echo 'task-owned-cleanup=PASS'
