name: Synology Live Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-synology-live-acceptance
  cancel-in-progress: false

jobs:
  live-atlas:
    name: Publish and qualify Atlas on Synology
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: atlas-runners
      labels: oteryn-atlas
    timeout-minutes: 45
    env:
      ATLAS_REV: ${{ github.sha }}
      GAME_REV: 8f6a4fdea4487a61c4cdaf1889d421ecd2265a31
      LEGACY_REV: e417c5e7c22986bf4acef0495eb47f7b72c97cce
      PREVIEW_CONTAINER: oteryn-atlas-fullworld-preview
      PREVIEW_URL: http://192.168.1.2:8097
      PYTHON_IMAGE: docker.io/library/python@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a
      CREATURE_SEMANTIC_DIGEST: sha256:3ecb5570fa2d018089bb5301c73abc8073154329a1443498c84f38d8febd8f23
      PUBLICATION_ROOT: sha256:9d0d2f3bb16a5a90f9b51a21366e4ed42963f5cb12366c404a20d9502ec4857f
      SEMANTIC_ROOT: sha256:27d7a83a7d9f498ea614b440ab4216cae5e6d11ea0527482410e40948cade5a9
      PIXEL_ROOT: sha256:8b8228fcc4574903e547cb7d65b96f3d45e5a9e67045091c1bceb6e54d3690ad
      OVERVIEW_ROOT: sha256:17683912d6758796d80a5b1647e2d0031f6849e51c40ae5264da6cfce3f9d6db
      RUNTIME_ROOT: sha256:fa30ae5fc47f0ca8a6d482ed87b5db2cd74f32f7f523df16187ca719b8e04f08
      PIXEL_BUCKET_ROOT: sha256:99cf23b01a0d652ff670a994a2b80cbef8d17036f514522d47f1aa98352d3116
      MINIMAP_ROOT: sha256:23f4d2c3901673fb38980e2600828145a6d0626c0e44d1d9f5ca23bfbce02268

    steps:
      - name: Verify Atlas organization runner boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_SCOPE:-}" = organization
          test "${RUNNER_GROUP:-}" = atlas-runners
          test "${RUNNER_NAME:-}" = oteryn-synology-atlas
          test "${RUNNER_LABELS:-}" = oteryn-atlas
          test -S /var/run/docker.sock
          test ! -e /var/lib/oteryn-staging-state
          grep -F '"agentName": "oteryn-synology-atlas"' /runner/.runner
          grep -F '"poolName": "atlas-runners"' /runner/.runner
          grep -F '"gitHubUrl": "https://github.com/Oteryn"' /runner/.runner
          grep -F '"workFolder": "/work"' /runner/.runner
          echo 'atlas-runner-identity=PASS'
          docker version --format 'docker-client={{.Client.Version}} docker-server={{.Server.Version}}'

      - name: Check out exact Atlas workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify main-only deployment authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_SHA" = "$ATLAS_REV"
          test "$(git rev-parse HEAD)" = "$ATLAS_REV"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$ATLAS_REV"
          test -z "$(git status --porcelain)"
          echo 'main-only deployment authority=PASS'

      - name: Atomically deploy exact merged main
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          C="$PREVIEW_CONTAINER"
          CANDIDATE_CONTAINER="${C}-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BACKUP_CONTAINER="${C}-rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE="$(docker inspect --format '{{.Config.Image}}' "$C")"
          OLD_REV="$(docker inspect --format '{{ index .Config.Labels "org.oteryn.revision" }}' "$C")"
          OLD_REPO_ROOT="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/srv/atlas/repo"}}{{.Source}}{{end}}{{end}}' "$C")"
          DATA_ROOT="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/srv/atlas/data"}}{{.Source}}{{end}}{{end}}' "$C")"
          MINIMAP_ROOT_PATH="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/srv/atlas/minimap-product"}}{{.Source}}{{end}}{{end}}' "$C")"
          OLD_NGINX="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/etc/nginx/conf.d/default.conf"}}{{.Source}}{{end}}{{end}}' "$C")"
          REVISION_ROOT="$(dirname "$(dirname "$OLD_REPO_ROOT")")"
          NEW_ROOT="$REVISION_ROOT/$ATLAS_REV"
          test "$(git rev-parse HEAD)" = "$ATLAS_REV"
          test -n "$IMAGE"; test -n "$DATA_ROOT"; test -n "$MINIMAP_ROOT_PATH"; test -n "$OLD_NGINX"
          docker rm -f "$CANDIDATE_CONTAINER" "$BACKUP_CONTAINER" >/dev/null 2>&1 || true
          docker run --rm --user 0:0 --entrypoint sh -v "$REVISION_ROOT:/revisions" "$IMAGE" -c "rm -rf /revisions/$ATLAS_REV; mkdir -p /revisions/$ATLAS_REV/repo"
          tar --exclude=.git -cf - . | docker run --rm -i --user 0:0 --entrypoint sh -v "$NEW_ROOT/repo:/repo" "$IMAGE" -c 'tar -xf - -C /repo'
          docker run --rm --user 0:0 --entrypoint sh -v "$OLD_NGINX:/old:ro" -v "$NEW_ROOT:/new" -e OLD_REV="$OLD_REV" -e NEW_REV="$ATLAS_REV" "$IMAGE" -c 'sed "s/$OLD_REV/$NEW_REV/g" /old > /new/nginx.conf; test -s /new/nginx.conf'
          docker run -d --name "$CANDIDATE_CONTAINER" --restart no -p 192.168.1.2:18098:8080 --label org.oteryn.preview=fullworld-atlas --label org.oteryn.revision="$ATLAS_REV" -v "$NEW_ROOT/nginx.conf:/etc/nginx/conf.d/default.conf:ro" -v "$DATA_ROOT:/srv/atlas/data:ro" -v "$MINIMAP_ROOT_PATH:/srv/atlas/minimap-product:ro" -v "$NEW_ROOT/repo:/srv/atlas/repo:ro" "$IMAGE" >/dev/null
          for _ in $(seq 1 30); do curl -fsS -D /tmp/candidate.headers http://192.168.1.2:18098/web/fullworld.html -o /tmp/candidate.html && break; sleep 1; done
          grep -qi "X-Oteryn-Atlas-Revision: $ATLAS_REV" /tmp/candidate.headers
          cmp web/fullworld.html /tmp/candidate.html
          docker rm -f "$CANDIDATE_CONTAINER" >/dev/null
          docker stop "$C" >/dev/null
          docker rename "$C" "$BACKUP_CONTAINER"
          rollback_live() {
            rc=$?
            set +e
            docker rm -f "$C" >/dev/null 2>&1 || true
            docker rename "$BACKUP_CONTAINER" "$C" >/dev/null 2>&1 || true
            docker start "$C" >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap rollback_live ERR INT TERM
          if ! docker run -d --name "$C" --restart unless-stopped -p 192.168.1.2:8097:8080 --label org.oteryn.preview=fullworld-atlas --label org.oteryn.revision="$ATLAS_REV" -v "$NEW_ROOT/nginx.conf:/etc/nginx/conf.d/default.conf:ro" -v "$DATA_ROOT:/srv/atlas/data:ro" -v "$MINIMAP_ROOT_PATH:/srv/atlas/minimap-product:ro" -v "$NEW_ROOT/repo:/srv/atlas/repo:ro" "$IMAGE" >/dev/null; then
            docker rename "$BACKUP_CONTAINER" "$C"; docker start "$C" >/dev/null; exit 1
          fi
          for _ in $(seq 1 30); do curl -fsS -D /tmp/live-new.headers "$PREVIEW_URL/web/fullworld.html" -o /tmp/live-new.html && break; sleep 1; done
          grep -qi "X-Oteryn-Atlas-Revision: $ATLAS_REV" /tmp/live-new.headers
          cmp web/fullworld.html /tmp/live-new.html
          test "$(docker inspect --format '{{ index .Config.Labels "org.oteryn.revision" }}' "$C")" = "$ATLAS_REV"
          trap - ERR INT TERM
          echo "backup_container=$BACKUP_CONTAINER" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo 'exact-main-deployment=PASS'

      - name: Build exact animated Game and Atlas products
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- atlas-source game-source legacy-source asset-15.32.zip appearance-a appearance-b spatial-a spatial-b animated-creatures-a.json animated-creatures-b.json creature-index-a creature-index-b animation-runtime-a animation-runtime-b e2e-targets.json first-chunk.txt first-bucket.txt e2e-evidence
          fetch_exact() {
            local directory="$1" repository="$2" revision="$3"
            git init "$directory" >/dev/null
            git -C "$directory" remote add origin "$repository"
            git -C "$directory" fetch --depth=1 origin "$revision"
            git -C "$directory" checkout --detach --quiet FETCH_HEAD
            test "$(git -C "$directory" rev-parse HEAD)" = "$revision"
          }
          fetch_exact atlas-source https://github.com/Oteryn/Oteryn-Atlas.git "$ATLAS_REV"
          fetch_exact game-source https://github.com/Oteryn/Oteryn-Game.git "$GAME_REV"
          git init legacy-source >/dev/null
          git -C legacy-source remote add origin https://github.com/blakinio/Otheryn.git
          git -C legacy-source sparse-checkout init --cone
          git -C legacy-source fetch --depth=1 --filter=blob:none origin "$LEGACY_REV"
          git -C legacy-source checkout --detach --quiet FETCH_HEAD
          git -C legacy-source sparse-checkout set vendor/map-analysis/crystalserver/data-global/world vendor/map-analysis/crystalserver/data-global/npc vendor/map-analysis/crystalserver/data-global/monster
          test "$(git -C legacy-source rev-parse HEAD)" = "$LEGACY_REV"
          curl -fL --retry 5 --retry-delay 2 'https://drive.usercontent.google.com/download?id=1Dlo3bS4K1nS3mw4BhPZdlHT7lX5zRAvv&export=download&confirm=t' -o asset-15.32.zip
          test "$(sha256sum asset-15.32.zip | awk '{print $1}')" = '1a6bad8b7598cd874f534cd4aae2d249fb3d9b4458b3ccfa75754f91bb27870f'
          if find atlas-source -type f \( -name '*.otbm' -o -name '*.otb' -o -name '*.spr' -o -name '*.dat' \) -print -quit | grep -q .; then echo 'Forbidden raw runtime input in Atlas checkout' >&2; exit 1; fi
          rm -rf -- atlas-source/.git game-source/.git legacy-source/.git
          python_container="oteryn-atlas-python-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "$python_container" >/dev/null 2>&1 || true
          trap 'docker rm -f "$python_container" >/dev/null 2>&1 || true' EXIT
          docker create --name "$python_container" --network none --entrypoint python3 "$PYTHON_IMAGE" -c 'import time; time.sleep(2700)' >/dev/null
          docker cp atlas-source "$python_container:/atlas-source"
          docker cp game-source "$python_container:/game-source"
          docker cp legacy-source "$python_container:/legacy-source"
          docker cp asset-15.32.zip "$python_container:/asset-15.32.zip"
          docker start "$python_container" >/dev/null
          for suffix in a b; do
            docker exec "$python_container" python3 /game-source/tools/game-atlas-appearances/export.py /asset-15.32.zip "/appearance-$suffix"
            docker exec "$python_container" python3 /game-source/tools/game-atlas-appearances/verify.py "/appearance-$suffix"
            docker exec "$python_container" python3 /game-source/tools/game-atlas-outfit-spatial/export.py /asset-15.32.zip "/spatial-$suffix"
            docker exec "$python_container" python3 /game-source/tools/game-atlas-creatures/animated.py /legacy-source/vendor/map-analysis/crystalserver/data-global/world /legacy-source/vendor/map-analysis/crystalserver/data-global/npc /legacy-source/vendor/map-analysis/crystalserver/data-global/monster "/appearance-$suffix" "/spatial-$suffix" "/animated-creatures-$suffix.json"
            docker exec "$python_container" python3 /atlas-source/tools/build-creature-index.py "/animated-creatures-$suffix.json" "/creature-index-$suffix"
            docker exec "$python_container" python3 /atlas-source/tools/animation-runtime/build.py /asset-15.32.zip "/appearance-$suffix" "/animated-creatures-$suffix.json" "/animation-runtime-$suffix"
          done
          for path in appearance-a appearance-b spatial-a spatial-b creature-index-a creature-index-b animation-runtime-a animation-runtime-b; do mkdir -p "$path"; docker cp "$python_container:/$path/." "$path/"; done
          docker cp "$python_container:/animated-creatures-a.json" animated-creatures-a.json
          docker cp "$python_container:/animated-creatures-b.json" animated-creatures-b.json
          diff -qr appearance-a appearance-b
          diff -qr spatial-a spatial-b
          cmp animated-creatures-a.json animated-creatures-b.json
          diff -qr creature-index-a creature-index-b
          diff -qr animation-runtime-a animation-runtime-b
          docker exec -i "$python_container" sh -c 'cd / && python3 -' <<'PY'
          import json
          from pathlib import Path
          creatures=json.loads(Path('animated-creatures-a.json').read_text())
          index=json.loads(Path('creature-index-a/index.json').read_text())
          animation=json.loads(Path('animation-runtime-a/manifest.json').read_text())
          assert creatures['capability']=='animated-creatures-v1'
          assert creatures['semantic_digest']=='sha256:3ecb5570fa2d018089bb5301c73abc8073154329a1443498c84f38d8febd8f23'
          assert index['source']['capability']=='animated-creatures-v1'
          assert index['counts']=={'records':88633,'chunks':5746,'search_records':1945}
          assert animation['rootContentId']=='sha256:7d9125797c4d49526ea48af9e804bfec0f3df77d9f22c92255a985a098130ae6'
          assert animation['counts']['object_programs']==5190 and animation['counts']['creature_programs']==1377 and animation['counts']['buckets']==43
          search=json.loads(Path('creature-index-a/search.json').read_text())['records']
          by_id={r['record_id']:r for r in search}
          targets={}
          for kind,key in [('npc','npcs'),('monster','monster_spawns')]:
              source=next(r for r in creatures[key] if r.get('presentation_resolution_state')=='RESOLVED' and r.get('outfit_presentation') and r['outfit_presentation'].get('static_projection',{}).get('phase_count',1)>1)
              item=by_id[source['record_id']]
              targets[kind]={'kind':kind,'label':item['label'],'record_id':item['record_id'],'position':item['position']}
          Path('e2e-targets.json').write_text(json.dumps(targets,indent=2,sort_keys=True)+chr(10))
          Path('first-chunk.txt').write_text(index['chunks'][0]['path']+chr(10))
          Path('first-bucket.txt').write_text(animation['buckets'][0]['path']+chr(10))
          print(json.dumps({'animation_root':animation['rootContentId'],'creature_digest':creatures['semantic_digest'],'targets':targets},sort_keys=True))
          PY
          docker cp "$python_container:/e2e-targets.json" e2e-targets.json
          docker cp "$python_container:/first-chunk.txt" first-chunk.txt
          docker cp "$python_container:/first-bucket.txt" first-bucket.txt
          docker rm -f "$python_container" >/dev/null
          trap - EXIT
          rm -rf -- legacy-source asset-15.32.zip appearance-b spatial-b creature-index-b animation-runtime-b animated-creatures-b.json

      - name: Atomically publish animated products and verify live contract
        id: product
        shell: bash
        run: |
          set -Eeuo pipefail
          C="$PREVIEW_CONTAINER"; PUBLISHED=0; ANIMATION_PUBLISHED=0; PARENT_CREATED=0
          REPO_ROOT="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/srv/atlas/repo"}}{{.Source}}{{end}}{{end}}' "$C")"
          SHARED_DATA_ROOT="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/srv/atlas/data"}}{{.Source}}{{end}}{{end}}' "$C")"
          HELPER_IMAGE="$(docker inspect --format '{{.Image}}' "$C")"
          test "$(docker inspect --format '{{.State.Running}}' "$C")" = true
          test "$(docker inspect --format '{{ index .Config.Labels "org.oteryn.revision" }}' "$C")" = "$ATLAS_REV"
          test "$(docker port "$C" 8080/tcp)" = '192.168.1.2:8097'
          test -n "$REPO_ROOT"; test -n "$SHARED_DATA_ROOT"; test -n "$HELPER_IMAGE"
          CREATURE_TMP=".creatures-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ANIMATION_TMP=".animation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rollback_product() {
            rc=$?; set +e
            docker run --rm --user 0:0 --entrypoint sh -e CT="$CREATURE_TMP" -e AT="$ANIMATION_TMP" -e CP="$PUBLISHED" -e AP="$ANIMATION_PUBLISHED" -e PC="$PARENT_CREATED" -v "$REPO_ROOT:/repo" "$HELPER_IMAGE" -c '
              rm -rf "/repo/data/$CT" "/repo/fullworld/$AT"
              if test "$CP" = 1; then rm -rf /repo/data/creatures; fi
              if test "$AP" = 1; then rm -rf /repo/fullworld/animation; fi
              if test "$PC" = 1; then rmdir /repo/data 2>/dev/null || true; fi
            ' >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap rollback_product ERR INT TERM
          docker run --rm --user 0:0 --entrypoint sh -v "$REPO_ROOT:/repo" "$HELPER_IMAGE" -c 'mkdir -p /repo/data /repo/fullworld'
          tar -C creature-index-a -cf - . | docker run --rm -i --user 0:0 --entrypoint sh -e TMP="$CREATURE_TMP" -v "$REPO_ROOT:/repo" "$HELPER_IMAGE" -c '
            set -eu; rm -rf "/repo/data/$TMP" /repo/data/creatures; mkdir "/repo/data/$TMP"; tar -xf - -C "/repo/data/$TMP"; test -s "/repo/data/$TMP/index.json"; mv "/repo/data/$TMP" /repo/data/creatures'
          PUBLISHED=1
          tar -C animation-runtime-a -cf - . | docker run --rm -i --user 0:0 --entrypoint sh -e TMP="$ANIMATION_TMP" -v "$REPO_ROOT:/repo" "$HELPER_IMAGE" -c '
            set -eu; rm -rf "/repo/fullworld/$TMP" /repo/fullworld/animation; mkdir "/repo/fullworld/$TMP"; tar -xf - -C "/repo/fullworld/$TMP"; test -s "/repo/fullworld/$TMP/manifest.json"; test -s "/repo/fullworld/$TMP/programs.json"; mv "/repo/fullworld/$TMP" /repo/fullworld/animation'
          ANIMATION_PUBLISHED=1
          curl -fsS "$PREVIEW_URL/data/creatures/index.json" -o /tmp/live-creatures.json
          curl -fsS "$PREVIEW_URL/fullworld/animation/manifest.json" -o /tmp/live-animation.json
          curl -fsS "$PREVIEW_URL/fullworld/animation/programs.json" -o /tmp/live-programs.json
          cmp creature-index-a/index.json /tmp/live-creatures.json
          cmp animation-runtime-a/manifest.json /tmp/live-animation.json
          cmp animation-runtime-a/programs.json /tmp/live-programs.json
          first_bucket="$(cat first-bucket.txt)"
          curl -fsS "$PREVIEW_URL/fullworld/animation/$first_bucket" -o /tmp/live-animation-bucket.rgba
          cmp "animation-runtime-a/$first_bucket" /tmp/live-animation-bucket.rgba
          first_chunk="$(cat first-chunk.txt)"; curl -fsS "$PREVIEW_URL/data/creatures/$first_chunk" -o /tmp/live-first-chunk.json; cmp "creature-index-a/$first_chunk" /tmp/live-first-chunk.json
          grep -F "$PUBLICATION_ROOT" <(curl -fsS "$PREVIEW_URL/fullworld/publication/publication.json") >/dev/null
          grep -F "$SEMANTIC_ROOT" <(curl -fsS "$PREVIEW_URL/fullworld/publication/semantic/world.json") >/dev/null
          grep -F "$PIXEL_ROOT" <(curl -fsS "$PREVIEW_URL/fullworld/publication/pixels/manifest.json") >/dev/null
          grep -F "$OVERVIEW_ROOT" <(curl -fsS "$PREVIEW_URL/fullworld/overview/world.json") >/dev/null
          grep -F "$RUNTIME_ROOT" <(curl -fsS "$PREVIEW_URL/fullworld/runtime-index/world.json") >/dev/null
          grep -F "$PIXEL_BUCKET_ROOT" <(curl -fsS "$PREVIEW_URL/fullworld/pixel-buckets/manifest.json") >/dev/null
          grep -F "$MINIMAP_ROOT" <(curl -fsS "$PREVIEW_URL/fullworld/minimap/world.json") >/dev/null
          { echo "repo_root=$REPO_ROOT"; echo "helper_image=$HELPER_IMAGE"; echo "published=true"; echo "animation_published=true"; echo "parent_created=false"; } >> "$GITHUB_OUTPUT"
          trap - ERR INT TERM
          echo 'live-animated-products-and-roots=PASS'

      - name: Build bounded Chromium acceptance image
        id: browser
        shell: bash
        run: |
          set -Eeuo pipefail
          image="oteryn-atlas-live-e2e:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --pull -t "$image" -f e2e/Dockerfile .
          docker run --rm --ipc host --shm-size 1g --entrypoint node "$image" -e '
            const { chromium } = require("@playwright/test");
            (async () => {
              const browser = await chromium.launch({headless:true,args:["--no-sandbox","--disable-dev-shm-usage"]});
              console.log(`chromium-runtime=${browser.version()}`);
              await browser.close();
            })().catch((error) => { console.error(error); process.exit(1); });
          '
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Run live desktop and mobile Chromium E2E
        id: e2e
        shell: bash
        env:
          BROWSER_IMAGE: ${{ steps.browser.outputs.image }}
        run: |
          set -Eeuo pipefail
          rm -rf -- e2e-evidence
          mkdir -p e2e-evidence
          container="oteryn-atlas-live-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker create \
            --name "$container" \
            --network host \
            --ipc host \
            --shm-size 1g \
            --entrypoint node \
            -e "PREVIEW_URL=$PREVIEW_URL" \
            -e "ATLAS_REV=$ATLAS_REV" \
            -e "CREATURE_SEMANTIC_DIGEST=$CREATURE_SEMANTIC_DIGEST" \
            "$BROWSER_IMAGE" tests/live-creature-preview.cjs >/dev/null
          docker cp e2e-targets.json "$container:/targets.json"

          set +e
          docker start -a "$container" 2>&1 | tee e2e-evidence/browser.log
          rc="${PIPESTATUS[0]}"
          set -e
          docker cp "$container:/evidence/." e2e-evidence/ 2>/dev/null || true
          if [[ "$rc" -ne 0 ]]; then
            exit "$rc"
          fi

          grep -Fx 'desktop=PASS' e2e-evidence/browser.log
          grep -Fx 'mobile=PASS' e2e-evidence/browser.log
          test -s e2e-evidence/result.json
          grep -F '"status": "PASS"' e2e-evidence/result.json
          grep -F "$ATLAS_REV" e2e-evidence/result.json
          grep -F "$CREATURE_SEMANTIC_DIGEST" e2e-evidence/result.json
          echo 'live-e2e=PASS'

      - name: Publish bounded browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-synology-live-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup task-owned resources and rollback failed publication
        if: always()
        shell: bash
        env:
          BROWSER_IMAGE: ${{ steps.browser.outputs.image }}
          PRODUCT_PUBLISHED: ${{ steps.product.outputs.published }}
          ANIMATION_PUBLISHED: ${{ steps.product.outputs.animation_published }}
          PRODUCT_PARENT_CREATED: ${{ steps.product.outputs.parent_created }}
          PRODUCT_REPO_ROOT: ${{ steps.product.outputs.repo_root }}
          HELPER_IMAGE: ${{ steps.product.outputs.helper_image }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          DEPLOY_CHANGED: ${{ steps.deploy.outputs.changed }}
          BACKUP_CONTAINER: ${{ steps.deploy.outputs.backup_container }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          container="oteryn-atlas-live-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "$container" >/dev/null 2>&1 || true

          if [[ "$DEPLOY_CHANGED" = true ]]; then
            test -n "$BACKUP_CONTAINER"
            if [[ "$JOB_STATUS" = success ]]; then
              docker rm -f "$BACKUP_CONTAINER" >/dev/null
              echo 'deployment-finalize=PASS'
            else
              docker rm -f "$PREVIEW_CONTAINER" >/dev/null 2>&1 || true
              docker rename "$BACKUP_CONTAINER" "$PREVIEW_CONTAINER"
              docker start "$PREVIEW_CONTAINER" >/dev/null
              echo 'deployment-rollback=PASS'
            fi
          fi

          if [[ "$PRODUCT_PUBLISHED" = true && "$E2E_OUTCOME" != success ]]; then
            test -n "$PRODUCT_REPO_ROOT"
            test -n "$HELPER_IMAGE"
            docker run --rm --user 0:0 --entrypoint sh \
              -e PARENT_CREATED="$PRODUCT_PARENT_CREATED" -e ANIMATION_PUBLISHED="$ANIMATION_PUBLISHED" \
              -v "$PRODUCT_REPO_ROOT:/repo" "$HELPER_IMAGE" -c '
                test -s /repo/data/creatures/index.json
                rm -rf /repo/data/creatures
                if test "$ANIMATION_PUBLISHED" = true; then rm -rf /repo/fullworld/animation; fi
                if test "$PARENT_CREATED" = true; then rmdir /repo/data 2>/dev/null || true; fi
              '
            code="$(curl -sS -w '%{http_code}' "$PREVIEW_URL/data/creatures/index.json" -o /tmp/atlas-after-rollback.json || true)"
            test "$code" = 404
            echo 'animated-product-rollback=PASS'
          fi

          if [[ -n "$BROWSER_IMAGE" ]]; then
            docker image rm -f "$BROWSER_IMAGE" >/dev/null 2>&1 || true
          fi
          rm -rf -- atlas-source game-source legacy-source asset-15.32.zip appearance-a appearance-b spatial-a spatial-b animated-creatures-a.json animated-creatures-b.json creature-index-a creature-index-b animation-runtime-a animation-runtime-b e2e-targets.json first-chunk.txt first-bucket.txt e2e-evidence
          echo 'task-owned-cleanup=PASS'
