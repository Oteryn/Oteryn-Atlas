name: Issue 121 Exact-Head Driver

on:
  push:
    branches:
      - test/issue-121-cross-browser-acceptance

permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: read

jobs:
  qualify:
    name: Molehill exact-head browser qualification
    runs-on:
      group: atlas-runners
      labels: oteryn-atlas-pc
    timeout-minutes: 240
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      short_sha: ${{ steps.target.outputs.short }}
    steps:
      - name: Check out driver revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve self-removed final PR head
        id: target
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $target = $null
          for ($attempt = 0; $attempt -lt 90; $attempt += 1) {
            $pr = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/Oteryn/Oteryn-Atlas/pulls/141'
            if ($pr.state -ne 'open') { throw 'PR #141 is not open.' }
            if ($pr.head.ref -ne 'test/issue-121-cross-browser-acceptance') { throw 'Unexpected PR #141 head ref.' }
            if ($pr.head.sha -ne $env:GITHUB_SHA) { $target = [string]$pr.head.sha; break }
            Start-Sleep -Seconds 2
          }
          if (-not $target) { throw 'Transient driver was not removed from the PR head.' }
          git fetch origin $target
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch final PR head.' }
          git checkout --detach $target
          if ($LASTEXITCODE -ne 0) { throw 'Unable to checkout final PR head.' }
          if (@(git status --porcelain).Count -ne 0) { throw 'Final PR checkout is dirty.' }
          "sha=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "short=$($target.Substring(0,7))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "TARGET_SHA=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "issue121-target=$target"

      - name: Run exact-head Firefox and WebKit matrix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $short = $env:TARGET_SHA.Substring(0,7)
          $project = "atlas141-cross-$short"
          $env:ATLAS_CODE_REVISION = $env:TARGET_SHA
          $env:ATLAS_EXPECTED_REVISION = $env:TARGET_SHA
          $env:ATLAS_PUBLICATION_ORIGIN = 'http://192.168.1.2:8097'
          $env:ATLAS_E2E_WORKERS = '1'
          $env:ATLAS_E2E_DEPTH = 'cross-browser'
          $env:ATLAS_USER_VISUAL_EVIDENCE = '0'
          $env:ATLAS_E2E_ARTIFACTS_HOST = "../artifacts/e2e/$project"
          $artifactDir = Join-Path $root "artifacts\e2e\$project"
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          $lockPath = Join-Path ([IO.Path]::GetTempPath()) 'oteryn-atlas-heavy-e2e.lock'
          $deadline = [DateTime]::UtcNow.AddSeconds(10800)
          $lock = $null
          while (-not $lock) {
            try { $lock = [IO.File]::Open($lockPath, [IO.FileMode]::OpenOrCreate, [IO.FileAccess]::ReadWrite, [IO.FileShare]::None) }
            catch [IO.IOException] {
              if ([DateTime]::UtcNow -ge $deadline) { throw "Timed out waiting for Atlas heavy E2E lock: $lockPath" }
              Start-Sleep -Seconds 2
            }
          }
          $owner = [Text.Encoding]::UTF8.GetBytes("pid=$PID project=$project revision=$env:TARGET_SHA`n")
          $lock.SetLength(0); $lock.Write($owner, 0, $owner.Length); $lock.Flush()
          $forwarder = $null
          try {
            while (@(docker ps --format '{{.Names}}' | Where-Object { $_ -match 'e2e-1$' }).Count -gt 0) {
              if ([DateTime]::UtcNow -ge $deadline) { throw 'Timed out waiting for prior E2E container to exit.' }
              Start-Sleep -Seconds 3
            }
            $origin = [Uri]$env:ATLAS_PUBLICATION_ORIGIN
            $env:ATLAS_PUBLICATION_SCHEME = $origin.Scheme
            $env:ATLAS_PUBLICATION_HOST = $origin.Host
            $env:ATLAS_PUBLICATION_HOST_HEADER = $origin.Authority
            $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
            $listener.Start(); $forwardPort = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port; $listener.Stop()
            $python = (Get-Command python -ErrorAction Stop).Source
            $forwarder = Start-Process -FilePath $python -ArgumentList @(
              'e2e/local-publication-forwarder.py','--listen-host','0.0.0.0','--listen-port',"$forwardPort",
              '--upstream-host',$origin.Host,'--upstream-port','8097'
            ) -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $artifactDir 'publication-forwarder.log') -RedirectStandardError (Join-Path $artifactDir 'publication-forwarder.err.log')
            $ready = $false
            for ($attempt = 0; $attempt -lt 50; $attempt += 1) {
              if ($forwarder.HasExited) { break }
              $client = [System.Net.Sockets.TcpClient]::new()
              try { $connect = $client.ConnectAsync('127.0.0.1', $forwardPort); if ($connect.Wait(200) -and $client.Connected) { $ready = $true; break } }
              catch { } finally { $client.Dispose() }
              Start-Sleep -Milliseconds 100
            }
            if (-not $ready) { throw 'Publication forwarder failed to listen.' }
            $env:ATLAS_PUBLICATION_UPSTREAM = "host.docker.internal:$forwardPort"
            docker compose -p $project -f e2e\compose.yml up -d --build atlas-web
            if ($LASTEXITCODE -ne 0) { throw 'Cross-browser atlas-web build/start failed.' }
            docker compose -p $project -f e2e\compose.yml build e2e
            if ($LASTEXITCODE -ne 0) { throw 'Cross-browser E2E image build failed.' }
            docker compose -p $project -f e2e\compose.yml run --rm -e ATLAS_ARTIFACTS_DIR=/artifacts/browser-probe -e ATLAS_E2E_DEPTH=cross-browser e2e xvfb-run -a node support/browser-availability.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Pinned browser availability probe failed.' }
            docker compose -p $project -f e2e\compose.yml run --rm -e ATLAS_ARTIFACTS_DIR=/artifacts/cross-browser -e ATLAS_E2E_DEPTH=cross-browser e2e xvfb-run -a npx playwright test --config=playwright.config.mjs --project=firefox-desktop --project=firefox-mobile-like --project=webkit-desktop --project=webkit-mobile-like
            if ($LASTEXITCODE -ne 0) { throw 'Firefox/WebKit exact-head matrix failed.' }
          } finally {
            $old = $ErrorActionPreference; $ErrorActionPreference = 'Continue'
            docker compose -p $project -f e2e\compose.yml down -v --remove-orphans *> $null
            if ($forwarder -and -not $forwarder.HasExited) { Stop-Process -Id $forwarder.Id -Force }
            if ($lock) { $lock.Dispose(); $lock = $null }
            $ErrorActionPreference = $old
          }

      - name: Publish cross-browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue121-cross-${{ steps.target.outputs.short }}
          path: artifacts/e2e/atlas141-cross-${{ steps.target.outputs.short }}/
          if-no-files-found: error
          retention-days: 14

      - name: Run exact-head primary Chromium visual gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $short = $env:TARGET_SHA.Substring(0,7)
          $env:ATLAS_CODE_REVISION = $env:TARGET_SHA
          $env:ATLAS_EXPECTED_REVISION = $env:TARGET_SHA
          $env:ATLAS_PUBLICATION_ORIGIN = 'http://192.168.1.2:8097'
          $env:ATLAS_E2E_WORKERS = '1'
          $env:ATLAS_E2E_DEPTH = 'required'
          $env:ATLAS_USER_VISUAL_EVIDENCE = '1'
          $env:ATLAS_E2E_PROJECT = "atlas141-primary-$short"
          $env:ATLAS_E2E_ARTIFACTS_HOST = "../artifacts/e2e/$env:ATLAS_E2E_PROJECT"
          $env:ATLAS_E2E_LOCK_TIMEOUT_SECONDS = '10800'
          & .\e2e\run.ps1
          if ($LASTEXITCODE -ne 0) { throw "Primary Chromium gate failed with exit code $LASTEXITCODE." }

      - name: Publish primary browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue121-primary-${{ steps.target.outputs.short }}
          path: artifacts/e2e/atlas141-primary-${{ steps.target.outputs.short }}/
          if-no-files-found: error
          retention-days: 14

      - name: Fence final remote head
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $pr = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/Oteryn/Oteryn-Atlas/pulls/141'
          if ($pr.head.sha -ne $env:TARGET_SHA) { throw "PR #141 moved from tested SHA $env:TARGET_SHA to $($pr.head.sha)." }
          Write-Output "issue121-tested-head=$env:TARGET_SHA"

