name: Protected Verification Controller
# Host recovery remains outside the protected controller; specialist transition admission must recover before any candidate checkout.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open main-targeting PR to re-evaluate after protected base movement
        required: true
        type: number
      trigger:
        description: Auditable lifecycle trigger
        required: false
        default: base_advance
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: atlas-protected-controller-pr-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  protected-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      base_sha: ${{ steps.identity.outputs.base_sha }}
      candidate_head_sha: ${{ steps.identity.outputs.candidate_head_sha }}
      pr_number: ${{ steps.identity.outputs.pr_number }}
    env:
      GH_TOKEN: ${{ github.token }}
      ATLAS_CANDIDATE_IMAGE: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    steps:
      - name: Resolve exact PR lifecycle identity
        id: identity
        shell: bash
        env:
          ATLAS_REQUESTED_PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$ATLAS_REQUESTED_PR_NUMBER" =~ ^[0-9]+$ ]]
          mkdir -p artifacts/protected-controller
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_REQUESTED_PR_NUMBER" > artifacts/protected-controller/requested-pr.json
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > artifacts/protected-controller/protected-main.json
          node --input-type=module - artifacts/protected-controller/requested-pr.json artifacts/protected-controller/protected-main.json "$GITHUB_OUTPUT" "$GITHUB_ENV" <<'NODE'
          import fs from 'node:fs';
          const [payloadPath, protectedMainPath, outputPath, envPath] = process.argv.slice(2);
          const pr = JSON.parse(fs.readFileSync(payloadPath, 'utf8'));
          const protectedMain = JSON.parse(fs.readFileSync(protectedMainPath, 'utf8'));
          if (pr.state !== 'open' || pr.base?.ref !== 'main' || pr.base?.repo?.full_name !== process.env.GITHUB_REPOSITORY
            || pr.head?.repo?.full_name !== process.env.GITHUB_REPOSITORY) {
            throw new Error('Requested lifecycle PR is not an open same-repository main-targeting PR.');
          }
          if (protectedMain.name !== 'main' || !protectedMain.protected || !/^[a-f0-9]{40}$/.test(protectedMain.commit?.sha ?? '')) {
            throw new Error('Current protected main identity is malformed or unprotected.');
          }
          const values = { pr_number: String(pr.number), base_sha: protectedMain.commit.sha, candidate_head_sha: pr.head.sha };
          if (!Number.isSafeInteger(pr.number) || pr.number < 1
            || !/^[a-f0-9]{40}$/.test(values.base_sha)
            || !/^[a-f0-9]{40}$/.test(values.candidate_head_sha)) {
            throw new Error('Requested lifecycle PR identity is malformed.');
          }
          for (const [name, value] of Object.entries(values)) fs.appendFileSync(outputPath, `${name}=${value}\n`);
          fs.appendFileSync(envPath, `ATLAS_PR_NUMBER=${values.pr_number}\n`);
          fs.appendFileSync(envPath, `ATLAS_PROTECTED_BASE_SHA=${values.base_sha}\n`);
          fs.appendFileSync(envPath, `ATLAS_CANDIDATE_HEAD_SHA=${values.candidate_head_sha}\n`);
          NODE

      - name: Check out protected controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact changed-file evidence without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ATLAS_PROTECTED_BASE_SHA"
          mkdir -p artifacts/protected-controller
          rows="$(mktemp)"
          git_changes="$(mktemp)"
          trap 'rm -f "$rows" "$git_changes"' EXIT
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER/files?per_page=100" \
            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' > "$rows"
          test -s "$rows"
          git fetch --no-tags origin "refs/pull/$ATLAS_PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$ATLAS_CANDIDATE_HEAD_SHA"
          merge_base_sha="$(git merge-base "$ATLAS_PROTECTED_BASE_SHA" "$ATLAS_CANDIDATE_HEAD_SHA")"
          test -n "$merge_base_sha"
          git diff --check "$merge_base_sha" "$ATLAS_CANDIDATE_HEAD_SHA"
          git diff --name-status -z --find-renames "$merge_base_sha" "$ATLAS_CANDIDATE_HEAD_SHA" > "$git_changes"
          node --input-type=module - "$rows" "$git_changes" artifacts/protected-controller/changed-files.json <<'NODE'
          import fs from 'node:fs';
          const [rowsPath, gitPath, outputPath] = process.argv.slice(2);
          const rows = fs.readFileSync(rowsPath, 'utf8').split(/\r?\n/).filter(Boolean);
          const api = rows.map((row) => {
            const fields = row.split('\t');
            if (fields.length !== 2 || !fields[0]) throw new Error('Malformed GitHub changed-file evidence.');
            return fields[1] ? { path: fields[0], previousPath: fields[1] } : { path: fields[0] };
          });
          const fields = fs.readFileSync(gitPath, 'utf8').split('\0');
          if (fields.at(-1) === '') fields.pop();
          const git = [];
          while (fields.length) {
            const status = fields.shift();
            if (!status) throw new Error('Malformed protected merge-base diff evidence.');
            if (status.startsWith('R')) {
              const previousPath = fields.shift();
              const path = fields.shift();
              if (!previousPath || !path) throw new Error('Malformed protected rename evidence.');
              git.push({ path, previousPath });
            } else {
              const path = fields.shift();
              if (!path) throw new Error('Malformed protected changed path evidence.');
              git.push({ path });
            }
          }
          const canonical = (items) => JSON.stringify(items.map((item) => ({ path: item.path, previousPath: item.previousPath ?? null }))
            .sort((a, b) => `${a.path}\0${a.previousPath}`.localeCompare(`${b.path}\0${b.previousPath}`)));
          if (canonical(api) !== canonical(git)) throw new Error('GitHub changed-file evidence does not match protected merge-base diff.');
          fs.writeFileSync(outputPath, `${JSON.stringify(api)}\n`);
          NODE
          printf '%s\n' "$merge_base_sha" > artifacts/protected-controller/merge-base.txt

      - name: Snapshot protected and candidate policy as inert data
        shell: bash
        run: |
          set -euo pipefail
          git show "$ATLAS_PROTECTED_BASE_SHA:tools/verification/impact-manifest.json" > artifacts/protected-controller/trusted-impact.json
          git show "$ATLAS_PROTECTED_BASE_SHA:tools/verification/verification-catalog.json" > artifacts/protected-controller/trusted-catalog.json
          snapshot_candidate_policy() {
            local path="$1"
            local trusted="$2"
            local target="$3"
            if git cat-file -e "$ATLAS_CANDIDATE_HEAD_SHA:$path" 2>/dev/null; then
              git show "$ATLAS_CANDIDATE_HEAD_SHA:$path" > "$target"
              return
            fi
            node --input-type=module - artifacts/protected-controller/changed-files.json "$path" <<'NODE'
          import fs from 'node:fs';
          const [changedFilesPath, policyPath] = process.argv.slice(2);
          const changes = JSON.parse(fs.readFileSync(changedFilesPath, 'utf8'));
          if (!Array.isArray(changes)) throw new Error('Protected changed-file evidence is malformed.');
          if (changes.some((change) => change?.path === policyPath || change?.previousPath === policyPath)) {
            throw new Error(`Candidate changed or removed protected planning policy: ${policyPath}`);
          }
          NODE
            cp "$trusted" "$target"
          }
          snapshot_candidate_policy tools/verification/impact-manifest.json \
            artifacts/protected-controller/trusted-impact.json artifacts/protected-controller/candidate-impact.json
          snapshot_candidate_policy tools/verification/verification-catalog.json \
            artifacts/protected-controller/trusted-catalog.json artifacts/protected-controller/candidate-catalog.json
          git show "$ATLAS_PROTECTED_BASE_SHA:tools/verification/protected-hosted-product-identities.json" > artifacts/protected-controller/product-identities.json

      - name: Derive canonical protected authority and environment identities
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildProtectedExecutionEnvironmentIdentity } from './tools/verification/protected-execution-environment.mjs';
          import { buildVerificationAuthorityIdentity } from './tools/verification/verification-authority.mjs';
          const readJson = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const authorityIdentity = await buildVerificationAuthorityIdentity({
            manifest: readJson('tools/verification/verification-authority-manifest.json'),
            readFile: async (path) => fs.readFileSync(path),
          });
          const environmentIdentity = buildProtectedExecutionEnvironmentIdentity(
            readJson('tools/verification/protected-execution-environment.json'),
          );
          fs.writeFileSync('artifacts/protected-controller/verification-authority-identity.json', `${JSON.stringify(authorityIdentity, null, 2)}\n`);
          fs.writeFileSync('artifacts/protected-controller/protected-execution-environment-identity.json', `${JSON.stringify(environmentIdentity, null, 2)}\n`);
          NODE

      - name: Enumerate exact protected-base Playwright census
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix e2e --ignore-scripts --no-audit --no-fund
          ATLAS_ARTIFACTS_DIR="$PWD/artifacts/protected-controller/playwright-list" \
            npm exec --prefix e2e -- playwright test --config=e2e/playwright.config.mjs --list \
            > artifacts/protected-controller/protected-playwright-test-list.txt
          node tools/verification/parse-playwright-test-list.mjs artifacts/protected-controller/protected-playwright-test-list.txt \
            > artifacts/protected-controller/protected-stable-test-ids.json

      - name: Enumerate candidate census only inside protected no-network sandbox
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/atlas-candidate-census-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() { rm -rf "$candidate_dir"; }
          trap cleanup EXIT
          rm -rf "$candidate_dir"
          mkdir -p "$candidate_dir"
          if git ls-tree -r --name-only "$ATLAS_CANDIDATE_HEAD_SHA" -- e2e/node_modules | grep -q .; then
            echo 'Candidate must not supply e2e/node_modules.' >&2
            exit 1
          fi
          git archive "$ATLAS_CANDIDATE_HEAD_SHA" | tar -x -C "$candidate_dir"
          test ! -L "$candidate_dir/e2e"
          test -d "$candidate_dir/e2e"
          test ! -e "$candidate_dir/e2e/node_modules"
          ln -s /protected-e2e-node-modules/node_modules "$candidate_dir/e2e/node_modules"
          timeout --signal=KILL 120s docker run --rm \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 192 --memory 1536m --cpus 2 --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount "type=bind,src=$candidate_dir,dst=/candidate,readonly" \
            --mount "type=bind,src=$PWD/e2e/node_modules,dst=/protected-e2e-node-modules/node_modules,readonly" \
            "$ATLAS_CANDIDATE_IMAGE" \
            bash -lc 'cd /candidate && CI=1 ATLAS_ARTIFACTS_DIR=/tmp/artifacts /candidate/e2e/node_modules/.bin/playwright test --config=/candidate/e2e/playwright.config.mjs --list' \
            > artifacts/protected-controller/candidate-playwright-test-list.txt
          node tools/verification/parse-playwright-test-list.mjs artifacts/protected-controller/candidate-playwright-test-list.txt \
            > artifacts/protected-controller/candidate-stable-test-ids.json

      - name: Build authoritative protected v3 plan
        shell: bash
        run: |
          set -euo pipefail
          merge_base_sha="$(tr -d '\r\n' < artifacts/protected-controller/merge-base.txt)"
          node --input-type=module - "$merge_base_sha" <<'NODE'
          import fs from 'node:fs';
          import { buildProtectedHostedPlan } from './tools/verification/protected-hosted-plan.mjs';
          import { stableIdAlgorithm } from './tools/verification/stable-id.mjs';
          const [mergeBaseSha] = process.argv.slice(2);
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const census = (stableTestIds) => ({ schemaVersion: 1, stableIdAlgorithm, stableTestIds });
          const candidateHeadSha = process.env.ATLAS_CANDIDATE_HEAD_SHA;
          const authorityIdentity = read('artifacts/protected-controller/verification-authority-identity.json');
          const environmentIdentity = read('artifacts/protected-controller/protected-execution-environment-identity.json');
          const plan = buildProtectedHostedPlan({
            repository: process.env.GITHUB_REPOSITORY,
            prNumber: Number(process.env.ATLAS_PR_NUMBER),
            protectedBaseSha: process.env.ATLAS_PROTECTED_BASE_SHA,
            candidateHeadSha,
            mergeBaseSha,
            changedFiles: read('artifacts/protected-controller/changed-files.json'),
            trustedImpactManifest: read('artifacts/protected-controller/trusted-impact.json'),
            candidateImpactManifest: read('artifacts/protected-controller/candidate-impact.json'),
            trustedVerificationCatalog: read('artifacts/protected-controller/trusted-catalog.json'),
            candidateVerificationCatalog: read('artifacts/protected-controller/candidate-catalog.json'),
            protectedCensus: census(read('artifacts/protected-controller/protected-stable-test-ids.json')),
            candidateCensus: {
              schemaVersion: 1,
              status: 'success',
              candidateHeadSha,
              sandboxPolicyId: 'atlas-candidate-census-sandbox-v1',
              census: census(read('artifacts/protected-controller/candidate-stable-test-ids.json')),
            },
            productIdentities: read('artifacts/protected-controller/product-identities.json'),
            authorityIdentity,
            environmentIdentity,
          });
          fs.writeFileSync('artifacts/protected-controller/protected-verification-plan.json', `${JSON.stringify(plan, null, 2)}\n`);
          NODE

      - name: Reject superseded head before plan publication
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER" > artifacts/protected-controller/current-pr.json
          node tools/verification/assert-current-pr-head.mjs \
            --payload artifacts/protected-controller/current-pr.json \
            --repository "$GITHUB_REPOSITORY" --pr-number "$ATLAS_PR_NUMBER" --expected-head-sha "$ATLAS_CANDIDATE_HEAD_SHA"

      - name: Publish protected verification plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-verification-plan-${{ steps.identity.outputs.pr_number }}-${{ steps.identity.outputs.candidate_head_sha }}
          path: |
            artifacts/protected-controller/protected-verification-plan.json
            artifacts/protected-controller/protected-stable-test-ids.json
            artifacts/protected-controller/candidate-stable-test-ids.json
            artifacts/protected-controller/changed-files.json
            artifacts/protected-controller/merge-base.txt
            artifacts/protected-controller/product-identities.json
            artifacts/protected-controller/verification-authority-identity.json
            artifacts/protected-controller/protected-execution-environment-identity.json
          if-no-files-found: error
          retention-days: 14
  handoff-base-advance:
    needs: [protected-plan]
    if: >-
      needs.protected-plan.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      startsWith(inputs.trigger, 'base_advance:')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_RUN_ID: ${{ github.run_id }}
      EXPECTED_PROTECTED_BASE_SHA: ${{ needs.protected-plan.outputs.base_sha }}
      EXPECTED_CANDIDATE_HEAD_SHA: ${{ needs.protected-plan.outputs.candidate_head_sha }}
      EXPECTED_PR_NUMBER: ${{ needs.protected-plan.outputs.pr_number }}
      ATLAS_BASE_ADVANCE_TRIGGER: ${{ inputs.trigger }}
    steps:
      - name: Validate protected base-advance producer and dispatch hosted executor
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONTROLLER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_PROTECTED_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_CANDIDATE_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ATLAS_BASE_ADVANCE_TRIGGER" =~ ^base_advance:[a-f0-9]{40}$ ]]
          test "${ATLAS_BASE_ADVANCE_TRIGGER#base_advance:}" = "$EXPECTED_PROTECTED_BASE_SHA"
          mkdir -p artifacts/base-advance-handoff
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROLLER_RUN_ID" > artifacts/base-advance-handoff/controller-run.json
          node --input-type=module - artifacts/base-advance-handoff/controller-run.json <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (run.repository?.full_name !== process.env.GITHUB_REPOSITORY
            || run.path !== '.github/workflows/protected-verification-controller.yml'
            || run.event !== 'workflow_dispatch'
            || run.status !== 'in_progress'
            || Number(run.run_attempt) !== 1
            || run.head_branch !== 'main'
            || run.head_sha !== process.env.EXPECTED_PROTECTED_BASE_SHA
            || run.actor?.login !== 'github-actions[bot]'
            || run.triggering_actor?.login !== 'github-actions[bot]') {
            throw new Error('Base-advance controller run is not the authoritative active protected producer.');
          }
          NODE
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > artifacts/base-advance-handoff/artifacts.json
          artifact_name="$(node --input-type=module - artifacts/base-advance-handoff/artifacts.json <<'NODE'
          import fs from 'node:fs';
          const rows = (JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).artifacts ?? [])
            .filter((artifact) => artifact.expired === false && artifact.name?.startsWith('protected-verification-plan-'));
          if (rows.length !== 1) throw new Error(`Expected exactly one protected plan artifact, got ${rows.length}.`);
          process.stdout.write(rows[0].name);
          NODE
          )"
          gh run download "$CONTROLLER_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir artifacts/base-advance-handoff/plan
          test -s artifacts/base-advance-handoff/plan/protected-verification-plan.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR_NUMBER" > artifacts/base-advance-handoff/current-pr.json
          node --input-type=module - artifacts/base-advance-handoff/plan/protected-verification-plan.json artifacts/base-advance-handoff/current-pr.json <<'NODE'
          import fs from 'node:fs';
          const [planPath, prPath] = process.argv.slice(2);
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const pr = JSON.parse(fs.readFileSync(prPath, 'utf8'));
          if (plan.schemaVersion !== 3
            || plan.repository !== process.env.GITHUB_REPOSITORY
            || plan.prNumber !== Number(process.env.EXPECTED_PR_NUMBER)
            || plan.protectedBaseSha !== process.env.EXPECTED_PROTECTED_BASE_SHA
            || plan.controller?.sourceSha !== process.env.EXPECTED_PROTECTED_BASE_SHA
            || plan.candidateHeadSha !== process.env.EXPECTED_CANDIDATE_HEAD_SHA) {
            throw new Error('Protected base-advance plan identity does not match controller outputs.');
          }
          if (pr.number !== plan.prNumber || pr.state !== 'open' || pr.merged === true
            || pr.base?.ref !== 'main' || pr.base?.repo?.full_name !== process.env.GITHUB_REPOSITORY
            || pr.head?.repo?.full_name !== process.env.GITHUB_REPOSITORY
            || pr.head?.sha !== plan.candidateHeadSha) {
            throw new Error('Base-advance handoff live PR identity is stale or invalid.');
          }
          NODE
          candidate_head_ref="$(jq -r '.head.ref // empty' artifacts/base-advance-handoff/current-pr.json)"
          test -n "$candidate_head_ref"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/protected-hosted-executor.yml/dispatches" \
            -f ref='main' \
            -f "inputs[controller_run_id]=$CONTROLLER_RUN_ID" \
            -f "inputs[pr_number]=$EXPECTED_PR_NUMBER" \
            -f "inputs[candidate_head_ref]=$candidate_head_ref"
