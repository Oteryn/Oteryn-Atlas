name: Protected publication readiness promotion

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: atlas-protected-publication-readiness-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  targeted-compatibility:
    name: Publish targeted publication readiness compatibility evidence
    if: >-
      github.event.label.name == 'atlas-legacy-transition-qualification' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/issue-179-protected-publication-readiness-promotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      ATLAS_PR_NUMBER: ${{ github.event.pull_request.number }}
      ATLAS_CODE_REVISION: ${{ github.event.pull_request.head.sha }}
      ATLAS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ATLAS_CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
      ATLAS_CANDIDATE_IMAGE: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    steps:
      - name: Require exact four-file readiness promotion delta
        shell: bash
        run: |
          set -euo pipefail
          rows="$(mktemp)"
          expected="$(mktemp)"
          trap 'rm -f "$rows" "$expected"' EXIT
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' | sort > "$rows"
          test "$(wc -l < "$rows" | tr -d '[:space:]')" = "$ATLAS_CHANGED_FILE_COUNT"
          printf '%s\n' \
            '.github/workflows/protected-publication-readiness-promotion.yml' \
            'tests/verification/protected-publication-readiness-promotion-workflow-contract.test.mjs' \
            'tests/verification/publication-readiness.test.mjs' \
            'tools/verification/publication-readiness.mjs' \
            > "$expected"
          diff -u "$expected" "$rows"

      - name: Check out exact protected base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: trusted-base

      - name: Check out exact candidate head as sandbox data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate

      - name: Fence current PR head before hosted proof
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/atlas-readiness-promotion-before.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER" > "$payload"
          node trusted-base/tools/verification/assert-current-pr-head.mjs \
            --payload "$payload" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$ATLAS_PR_NUMBER" \
            --expected-head-sha "$ATLAS_CODE_REVISION"
          test "$(git -C candidate rev-parse HEAD)" = "$ATLAS_CODE_REVISION"
          test "$(git -C trusted-base rev-parse HEAD)" = "$ATLAS_BASE_SHA"

      - name: Prove atomic readiness publication without browser execution
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 120s docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 512m \
            --cpus 2 \
            --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount "type=bind,src=$PWD/candidate,dst=/candidate,readonly" \
            "$ATLAS_CANDIDATE_IMAGE" \
            bash -lc 'cd /candidate && node --test tests/verification/publication-readiness.test.mjs'

      - name: Fence exact head and publish one-time compatibility status
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/atlas-readiness-promotion-after.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ATLAS_PR_NUMBER" > "$payload"
          node trusted-base/tools/verification/assert-current-pr-head.mjs \
            --payload "$payload" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$ATLAS_PR_NUMBER" \
            --expected-head-sha "$ATLAS_CODE_REVISION"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$ATLAS_CODE_REVISION" \
            -f state='success' \
            -f context='atlas-local-e2e' \
            -f description='Protected readiness bootstrap; no browser E2E executed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
