name: Verification Nightly Depth

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-verification-nightly-depth
  cancel-in-progress: false

jobs:
  deterministic-depth:
    name: Deterministic contracts and controlled mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact scheduled main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact scheduled revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" = schedule ]]; then test "$GITHUB_REF" = 'refs/heads/main'; fi

      - name: Run deterministic verification depth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/verification-nightly
          files=(
            tests/animation-runtime.mjs
            tests/browser-semantic.mjs
            tests/deployment-policy.mjs
            tests/gui-contract.mjs
            tests/npc-markers.mjs
            tests/pixel-store.mjs
            tests/semantic-search.mjs
            tests/semantic-search-creatures.mjs
            tests/synology-live-workflow.mjs
            tests/fullworld-layers/*.test.mjs
            tests/fullworld-runtime/*.test.mjs
            tests/properties/*.test.mjs
            tests/verification/*.test.mjs
          )
          node --test "${files[@]}" 2>&1 | tee artifacts/verification-nightly/node-tests.log
          node --test --test-name-pattern='property oracle kills sign and scale mutants' \
            tests/properties/viewport-transform.test.mjs \
            2>&1 | tee artifacts/verification-nightly/controlled-mutants.log

      - name: Publish deterministic nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-verification-nightly-node-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verification-nightly/
          if-no-files-found: error
          retention-days: 14

  browser-depth:
    name: Read-only Docker browser depth
    runs-on:
      group: atlas-runners
      labels: oteryn-atlas-pc
    timeout-minutes: 180
    env:
      ATLAS_CODE_REVISION: ${{ github.sha }}
      ATLAS_EXPECTED_REVISION: ${{ github.sha }}
      ATLAS_PUBLICATION_ORIGIN: http://192.168.1.2:8097
      ATLAS_E2E_WORKERS: '1'
      ATLAS_STRESS_LENGTH: '64'
    steps:
      - name: Verify immutable Molehill Atlas runner identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'Oteryn/Oteryn-Atlas') { throw 'Unexpected repository.' }
          if ($env:RUNNER_NAME -ne 'oteryn-molehill-atlas') { throw "Unexpected runner: $env:RUNNER_NAME" }
          if ($env:RUNNER_OS -ne 'Windows') { throw "Unexpected runner OS: $env:RUNNER_OS" }
          docker version
          if ($LASTEXITCODE -ne 0) { throw 'Docker is unavailable on the Molehill runner.' }
          docker info | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Docker Desktop engine is unavailable on the Molehill runner.' }
          Write-Output 'molehill-atlas-runner-identity=PASS'

      - name: Check out exact scheduled main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checkout and read-only publication origin
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:ATLAS_CODE_REVISION) { throw 'Checkout revision mismatch.' }
          if ($env:GITHUB_EVENT_NAME -eq 'schedule' -and $env:GITHUB_REF -ne 'refs/heads/main') { throw 'Scheduled nightly must run on main.' }
          $response = Invoke-WebRequest -UseBasicParsing "$env:ATLAS_PUBLICATION_ORIGIN/fullworld/publication/publication.json"
          if ($response.StatusCode -ne 200 -or [string]::IsNullOrWhiteSpace($response.Content)) { throw 'Publication origin preflight failed.' }
          $revisionResponse = Invoke-WebRequest -UseBasicParsing -Method Head "$env:ATLAS_PUBLICATION_ORIGIN/web/fullworld.html"
          $servedRevision = [string]$revisionResponse.Headers['X-Oteryn-Atlas-Revision']
          if ($servedRevision -ne $env:ATLAS_CODE_REVISION) { throw "Live publication revision $servedRevision does not match nightly revision $env:ATLAS_CODE_REVISION." }
          New-Item -ItemType Directory -Force artifacts/e2e/nightly | Out-Null
          $response.Content | Set-Content -Encoding utf8 artifacts/e2e/nightly/publication-preflight.json

      - name: Record optional depth applicability
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/e2e/nightly | Out-Null
          $categories = [ordered]@{
            performance = @('tests/performance-desktop.spec.mjs')
            visual = @('tests/visual-desktop.spec.mjs')
            accessibility = @('tests/accessibility-desktop.spec.mjs', 'tests/a11y-desktop.spec.mjs')
            'race-fault' = @('tests/race-fault-desktop.spec.mjs', 'tests/race-desktop.spec.mjs')
            'soak-leak' = @('tests/soak-desktop.spec.mjs', 'tests/soak-leak-desktop.spec.mjs')
          }
          $skips = @()
          foreach ($entry in $categories.GetEnumerator()) {
            $present = @($entry.Value | Where-Object { Test-Path (Join-Path 'e2e' $_) })
            if ($present.Count -eq 0) {
              $skips += [ordered]@{
                category = $entry.Key
                status = 'skip'
                reason = 'No stable worker-delivered spec for this category exists at the exact scheduled revision.'
              }
            }
          }
          [ordered]@{ version = 1; atlasRevision = $env:ATLAS_CODE_REVISION; skips = $skips } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 artifacts/e2e/nightly/optional-depth-skips.json

      - name: Run bounded replayable browser depth
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $origin = [Uri]$env:ATLAS_PUBLICATION_ORIGIN
          $originPort = if ($origin.IsDefaultPort) { if ($origin.Scheme -eq 'https') { 443 } else { 80 } } else { $origin.Port }
          $forwarder = $null
          $project = "oteryn-atlas-nightly-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $composeFile = 'e2e/compose.selfhosted.yml'
          $artifactRoot = Join-Path (Get-Location) 'artifacts/e2e/nightly'
          New-Item -ItemType Directory -Force $artifactRoot | Out-Null

          try {
            $python = (Get-Command python -ErrorAction Stop).Source
            $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
            $listener.Start()
            $forwardPort = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
            $listener.Stop()
            $forwarderOut = Join-Path $artifactRoot 'publication-forwarder.log'
            $forwarderErr = Join-Path $artifactRoot 'publication-forwarder.err.log'
            $forwarder = Start-Process -FilePath $python -ArgumentList @(
              'e2e/local-publication-forwarder.py', '--listen-host', '0.0.0.0', '--listen-port', "$forwardPort",
              '--upstream-host', $origin.Host, '--upstream-port', "$originPort"
            ) -WindowStyle Hidden -PassThru -RedirectStandardOutput $forwarderOut -RedirectStandardError $forwarderErr

            $ready = $false
            for ($attempt = 0; $attempt -lt 50; $attempt += 1) {
              if ($forwarder.HasExited) { break }
              $client = [System.Net.Sockets.TcpClient]::new()
              try {
                $connect = $client.ConnectAsync('127.0.0.1', $forwardPort)
                if ($connect.Wait(200) -and $client.Connected) { $ready = $true; break }
              } catch { } finally { $client.Dispose() }
              Start-Sleep -Milliseconds 100
            }
            if (-not $ready) { throw "Publication forwarder failed; see $forwarderErr" }

            $env:ATLAS_PUBLICATION_SCHEME = $origin.Scheme
            $env:ATLAS_PUBLICATION_HOST = $origin.Host
            $env:ATLAS_PUBLICATION_HOST_HEADER = $origin.Authority
            $env:ATLAS_PUBLICATION_UPSTREAM = "host.docker.internal:$forwardPort"

            docker compose -p $project -f $composeFile up -d --build atlas-web
            if ($LASTEXITCODE -ne 0) { throw 'atlas-web build/start failed.' }
            docker compose -p $project -f $composeFile build e2e
            if ($LASTEXITCODE -ne 0) { throw 'E2E image build failed.' }

            function Invoke-DepthCase {
              param([string]$Label, [string[]]$Environment, [string[]]$Command)
              $args = @('compose', '-p', $project, '-f', $composeFile, 'run', '--rm', '-e', "ATLAS_ARTIFACTS_DIR=/artifacts/$Label")
              foreach ($item in $Environment) { $args += @('-e', $item) }
              $args += $Command
              & docker @args
              if ($LASTEXITCODE -ne 0) { throw "Nightly depth case failed: $Label" }
            }

            Invoke-DepthCase -Label 'repeated-critical' -Environment @('ATLAS_E2E_DEPTH=required') -Command @(
              'e2e', 'npx', 'playwright', 'test', '--config=playwright.config.mjs',
              'tests/geometry-desktop.spec.mjs', 'tests/render-probes-desktop.spec.mjs',
              '--project=desktop-chromium', '--repeat-each=3'
            )
            foreach ($seed in @('133', '1096043585', '2779096485', '3735928559')) {
              Invoke-DepthCase -Label "stress-$seed" -Environment @(
                'ATLAS_E2E_DEPTH=required', "ATLAS_STRESS_SEED=$seed", "ATLAS_STRESS_LENGTH=$env:ATLAS_STRESS_LENGTH"
              ) -Command @('e2e', 'npx', 'playwright', 'test', '--config=playwright.config.mjs', 'tests/stress-desktop.spec.mjs', '--project=desktop-chromium')
            }
            Invoke-DepthCase -Label 'extra-profiles' -Environment @('ATLAS_E2E_DEPTH=nightly') -Command @(
              'e2e', 'npx', 'playwright', 'test', '--config=playwright.config.mjs',
              '--project=nightly-desktop-dpr2', '--project=nightly-tablet'
            )

            $optional = [ordered]@{
              performance = @('tests/performance-desktop.spec.mjs')
              visual = @('tests/visual-desktop.spec.mjs')
              accessibility = @('tests/accessibility-desktop.spec.mjs', 'tests/a11y-desktop.spec.mjs')
              'race-fault' = @('tests/race-fault-desktop.spec.mjs', 'tests/race-desktop.spec.mjs')
              'soak-leak' = @('tests/soak-desktop.spec.mjs', 'tests/soak-leak-desktop.spec.mjs')
            }
            foreach ($entry in $optional.GetEnumerator()) {
              $present = @($entry.Value | Where-Object { Test-Path (Join-Path 'e2e' $_) })
              if ($present.Count -gt 0) {
                $command = @('e2e', 'npx', 'playwright', 'test', '--config=playwright.config.mjs') + $present + @('--project=desktop-chromium')
                Invoke-DepthCase -Label "optional-$($entry.Key)" -Environment @('ATLAS_E2E_DEPTH=required') -Command $command
              }
            }
          } finally {
            $previous = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $exportName = "$project-artifact-export"
            docker compose -p $project -f $composeFile run --no-deps -d --name $exportName e2e sleep 600 | Out-Null
            if ($LASTEXITCODE -eq 0) {
              docker cp "${exportName}:/artifacts/." "$artifactRoot/" | Out-Null
              docker rm -f $exportName | Out-Null
            }
            docker compose -p $project -f $composeFile down -v --remove-orphans | Out-Null
            if ($forwarder -and -not $forwarder.HasExited) { Stop-Process -Id $forwarder.Id -Force }
            $ErrorActionPreference = $previous
          }

      - name: Verify publication revision remained exact
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $revisionResponse = Invoke-WebRequest -UseBasicParsing -Method Head "$env:ATLAS_PUBLICATION_ORIGIN/web/fullworld.html"
          $servedRevision = [string]$revisionResponse.Headers['X-Oteryn-Atlas-Revision']
          if ($servedRevision -ne $env:ATLAS_CODE_REVISION) { throw "Live publication revision changed to $servedRevision during nightly depth; expected $env:ATLAS_CODE_REVISION." }

      - name: Publish bounded nightly browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-verification-nightly-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/e2e/nightly/
          if-no-files-found: error
          retention-days: 14
