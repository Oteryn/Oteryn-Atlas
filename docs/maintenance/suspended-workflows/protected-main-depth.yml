name: Protected main depth

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-protected-main-depth
  cancel-in-progress: false

jobs:
  protected-depth:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove every protected depth profile
        shell: bash
        run: |
          set -euo pipefail
          node tools/verification/run-protected-main-depth.mjs "$PWD" "$RUNNER_TEMP/protected-main-depth"
      - name: Publish exact main depth evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-main-depth-${{ github.run_id }}-1
          path: ${{ runner.temp }}/protected-main-depth/protected-main-depth.json
          if-no-files-found: error
          retention-days: 7
