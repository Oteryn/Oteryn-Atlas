name: oteryn-atlas-e2e

services:
  atlas-web:
    image: ghcr.io/nginx/nginx-unprivileged:1.31.3-alpine3.24-slim@sha256:22f839c5fb4007dc24d203a170a9e03fc185d660bfefc34ac6823a7aef085cbc
    read_only: true
    environment:
      ATLAS_CODE_REVISION: ${ATLAS_CODE_REVISION:-unknown}
      ATLAS_PUBLICATION_ORIGIN: ${ATLAS_PUBLICATION_ORIGIN:-http://127.0.0.1:9}
      NGINX_ENVSUBST_FILTER: ^ATLAS_
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    volumes:
      - ../:/usr/share/nginx/html:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/include-generated.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/web/fullworld.html || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  e2e:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    init: true
    ipc: host
    depends_on:
      atlas-web:
        condition: service_healthy
    environment:
      ATLAS_BASE_URL: ${ATLAS_BASE_URL:-http://atlas-web:8080}
      ATLAS_EXPECTED_REVISION: ${ATLAS_EXPECTED_REVISION:-}
      ATLAS_E2E_WORKERS: ${ATLAS_E2E_WORKERS:-2}
    volumes:
      - ../artifacts/e2e:/artifacts
