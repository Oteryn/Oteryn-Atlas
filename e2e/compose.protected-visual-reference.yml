services:
  reference-capture:
    image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    init: true
    read_only: true
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1536m
    shm_size: 1gb
    tmpfs: [/tmp]
    volumes:
      - ${ATLAS_REFERENCE_AUTHORITY:?protected authority required}:/protected:ro
      - ${ATLAS_REFERENCE_INPUT:?reference identity required}:/run/reference.json:ro
      - ${ATLAS_REFERENCE_OUTPUT:?reference output required}:/out
    command: [node, /protected/tools/verification/run-protected-visual-reference.mjs, /run/reference.json, /out]
