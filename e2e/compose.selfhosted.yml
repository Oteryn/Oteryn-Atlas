name: oteryn-atlas-e2e-selfhosted

services:
  atlas-web:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.web
    read_only: true
    environment:
      ATLAS_CODE_REVISION: ${ATLAS_CODE_REVISION:-unknown}
      ATLAS_PUBLICATION_ORIGIN: ${ATLAS_PUBLICATION_ORIGIN:-http://127.0.0.1:9}
      ATLAS_PUBLICATION_SCHEME: ${ATLAS_PUBLICATION_SCHEME:-http}
      ATLAS_PUBLICATION_UPSTREAM: ${ATLAS_PUBLICATION_UPSTREAM:-127.0.0.1:9}
      ATLAS_PUBLICATION_HOST_HEADER: ${ATLAS_PUBLICATION_HOST_HEADER:-127.0.0.1:9}
      ATLAS_PUBLICATION_HOST: ${ATLAS_PUBLICATION_HOST:-127.0.0.1}
      NGINX_ENVSUBST_FILTER: ^ATLAS_
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/web/fullworld.html || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  e2e:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    init: true
    shm_size: 1gb
    depends_on:
      atlas-web:
        condition: service_healthy
    environment:
      ATLAS_BASE_URL: ${ATLAS_BASE_URL:-http://atlas-web:8080}
      ATLAS_PUBLICATION_ORIGIN: ${ATLAS_PUBLICATION_ORIGIN:-}
      ATLAS_EXPECTED_REVISION: ${ATLAS_EXPECTED_REVISION:-}
      ATLAS_E2E_WORKERS: ${ATLAS_E2E_WORKERS:-2}
      ATLAS_ARTIFACTS_DIR: /artifacts
    volumes:
      - artifacts:/artifacts

volumes:
  artifacts:
