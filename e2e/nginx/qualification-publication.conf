server {
    listen 8081;
    listen [::]:8081;
    server_name _;
    root /srv/atlas;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    location = /__atlas/readiness {
        default_type application/json;
        alias /srv/atlas/fullworld/atlas-publication-readiness.json;
    }

    location = /fullworld/atlas-publication-readiness.json {
        return 404;
    }

    location ^~ /fullworld/ {
        try_files $uri =404;
    }

    location ^~ /data/creatures/ {
        root /srv/atlas/fullworld;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}